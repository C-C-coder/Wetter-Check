name: Tour Weather Cron

on:
  schedule:
    - cron: '*/5 * * * *' # Läuft jetzt alle 5 Minuten für sekundengenaue Unwetter- und Regenwarnungen
  workflow_dispatch: # Erlaubt den manuellen Start über den Button

jobs:
  run-weather-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests firebase-admin

      - name: Run weather check script
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: |
          python check_weather.py
          
