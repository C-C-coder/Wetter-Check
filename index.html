<style>

<script>
const firebaseConfig = {
apiKey: "AIzaSyADlL7BKaVPgdCH6xSqWEjVqf54q33E9WE",
authDomain: "wetter-check.firebaseapp.com",
projectId: "wetter-check",
storageBucket: "wetter-check.firebasestorage.app",
messagingSenderId: "184488061652",
appId: "1:184488061652:web:dda3d879ff8cfd36d6e941"
};

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let messaging = null;

if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('./firebase-messaging-sw.js')
.then((registration) => {
messaging = firebase.messaging(app);
messaging.useServiceWorker(registration);

messaging.onMessage((payload) => {
 if (payload.notification) {
   if ('Notification' in window && Notification.permission === 'granted') {
     navigator.serviceWorker.ready.then(reg => {
       reg.showNotification(payload.notification.title, {
         body: payload.notification.body,
         icon: 'logo.png'
       });
     });
   }
 }
});
})
.catch((err) => {});
}

function updatePushStatusUI() {
const infoBox = document.getElementById('pushStatusInfo');
const isActive = localStorage.getItem('tour_push_active') === 'true';
const tourTitle = localStorage.getItem('tour_push_title') || 'Aktuelle Tour';
const startTime = localStorage.getItem('tour_push_start') || '';

if (isActive) {
infoBox.style.display = 'block';
infoBox.innerHTML = `🔔 <strong>Push-Benachrichtigungen aktiv</strong> für: <em>${tourTitle}</em> (Start: ${startTime ? startTime.replace('T', ' ') : '–'})<br><span style="color:#64748b;">ℹ️ Du erhältst stündliche Updates sowie Unwetter-Warnungen.</span>`;
} else {
infoBox.style.display = 'block';
infoBox.innerHTML = `🔕 <strong>Keine Push-Benachrichtigungen aktiv.</strong>`;
}
}

async function toggleTourPush() {
const btn = document.getElementById('pushToggleBtn');
const isActive = btn.classList.contains('active');

if (!messaging) {
alert('Der Service Worker wird noch geladen. Bitte versuche es in 2 Sekunden noch einmal.');
return;
}

if (!isActive) {
try {
const permission = await Notification.requestPermission();
if (permission === 'granted') {
const vapidKey = "BM1lhomK1in9e4w6Th_On3H8PLxO2nwXeAjSci1y8Y8QIeAG23ntriAqCc2Qx0r4Pu_tITTSGFkA5xsu_KI2Qs4";
const registration = await navigator.serviceWorker.ready;
const currentToken = await messaging.getToken({ vapidKey: vapidKey, serviceWorkerRegistration: registration });

if (currentToken) {
const startPlace = document.getElementById('locationSearch').value || 'Start';
const peak = getPeakData();
const tourTitle = startPlace + (peak?.name ? ' → ' + peak.name : '');
const startTimeVal = document.getElementById('startTime').value;

const tourData = {
token: currentToken,
tourTitle: tourTitle,
lat: parseFloat(document.getElementById('lat').value) || 0,
lon: parseFloat(document.getElementById('lon').value) || 0,
start_lat: parseFloat(document.getElementById('lat').value) || 0,
start_lon: parseFloat(document.getElementById('lon').value) || 0,
startTime: startTimeVal,
duration: Number(document.getElementById('duration').value || 6),
last_weather_state: 'stable',
last_notified_stage: null,
last_hourly_check: null,
updatedAt: firebase.firestore.FieldValue.serverTimestamp()
};

await db.collection('tour_subscriptions').doc(currentToken).set(tourData);
localStorage.setItem('fcm_token', currentToken);
localStorage.setItem('tour_push_active', 'true');
localStorage.setItem('tour_push_title', tourTitle);
localStorage.setItem('tour_push_start', startTimeVal);

btn.classList.add('active');
btn.innerText = 'Push Benachrichtigungen für die Tour deaktivieren';
updatePushStatusUI();
}
}
} catch (error) {
alert('Fehler beim Aktivieren: ' + error.message);
}
} else {
try {
localStorage.removeItem('tour_push_active');
localStorage.removeItem('tour_push_title');
localStorage.removeItem('tour_push_start');
const currentToken = localStorage.getItem('fcm_token');
if (currentToken) {
await db.collection('tour_subscriptions').doc(currentToken).delete();
}
if (currentToken && messaging.deleteToken) {
await messaging.deleteToken();
}
localStorage.removeItem('fcm_token');
btn.classList.remove('active');
btn.innerText = 'Push Benachrichtigungen für die Tour aktivieren';
updatePushStatusUI();
} catch (error) {
btn.classList.remove('active');
btn.innerText = 'Push Benachrichtigungen für die Tour aktivieren';
updatePushStatusUI();
}
}
}

let foundLocations=[], peakCandidates=[], selectedPeak=null; 
let savedFavorites=JSON.parse(localStorage.getItem('bt_favorites_v5')||'[]');
const TOUR_NAMES={hiking:'Wanderung',klettersteig:'Klettersteig',hochtour:'Hochtour',grat:'Gratwanderung',gletscher:'Gletschertour',klettern:'Felskletterei',ski:'Schitour'};

let startMapInstance = null;
let startMapMarker = null;
let selectedMapLat = 47.78;
let selectedMapLon = 15.89;

let peakMapInstance = null;
let peakMapMarkers = [];

// NEU: Öffnet die Start-Karte und zentriert sich automatisch auf aktuelles GPS (falls verfügbar)
function openStartMapModal() {
document.getElementById('startMapModal').style.display = 'flex';

let currentLat = parseFloat(document.getElementById('lat').value) || 47.7800;
let currentLon = parseFloat(document.getElementById('lon').value) || 15.8900;

if (navigator.geolocation && !document.getElementById('lat').value) {

await loadPeaksInCurrentBounds();
}, 100);

// NEU: Lädt Gipfel basierend auf den aktuellen Bounding-Box Grenzen der Leaflet-Karte
async function loadPeaksInCurrentBounds() {
if (!peakMapInstance) return;
const bounds = peakMapInstance.getBounds();
const center = peakMapInstance.getCenter();

const hint = document.getElementById('peakMapHint');
hint.innerText = 'Lade Gipfel im Kartenausschnitt…';

let rawPeaks = [];
try {
const q = `peak near ${center.lat.toFixed(2)},${center.lng.toFixed(2)}`;
const nomRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=peak&bounded=1&viewbox=${bounds.getWest()},${bounds.getNorth()},${bounds.getEast()},${bounds.getSouth()}&limit=40`);
if (nomRes.ok) {
const nomData = await nomRes.json();
nomData.forEach(x => {
const pLat = parseFloat(x.lat);
const pLon = parseFloat(x.lon);
const dist = getDistance(center.lat, center.lng, pLat, pLon);
rawPeaks.push({
name: x.display_name.split(',')[0],
alt: x.extratags && x.extratags.ele ? parseInt(x.extratags.ele) : null,
lat: pLat,
lon: pLon,
distance: dist
});
});
}
} catch(e) {}

// Fallback über Open-Meteo Geocoding, falls Nominatim leer bleibt
if (rawPeaks.length === 0) {
try {
const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=Gipfel&count=30&language=de&format=json`);
if (r.ok) {
const d = await r.json();
if (d.results) {
d.results.forEach(x => {
if (bounds.contains([x.latitude, x.longitude])) {
rawPeaks.push({
name: x.name,
alt: x.elevation ? Math.round(x.elevation) : null,
lat: x.latitude,
lon: x.longitude,
distance: getDistance(center.lat, center.lng, x.latitude, x.longitude)
});
}
});
}
}
} catch(e) {}
}

const uniquePeaks = [];
const map = new Map();
for (const item of rawPeaks) {
if(!map.has(item.name)){
map.set(item.name, true);
uniquePeaks.push(item);
}
}

peakCandidates = uniquePeaks;

// Alte Marker entfernen und neue setzen
peakMapMarkers.forEach(m => peakMapInstance.removeLayer(m));
peakMapMarkers = [];

peakCandidates.forEach((p, idx) => {
if (p.lat && p.lon) {
const altStr = p.alt ? p.alt + ' m' : '';
const marker = L.marker([p.lat, p.lon]).addTo(peakMapInstance);
marker.bindPopup(`<b>⛰️ ${p.name}</b><br>${altStr}<br><button onclick="selectPeakByIndex(${idx})" style="margin-top:6px;background:#10b981;color:#fff;border:none;padding:4px 8px;border-radius:6px;cursor:pointer;">Gipfel auswählen</button>`);
peakMapMarkers.push(marker);
}
});

hint.innerText = `${peakCandidates.length} Gipfel im aktuellen Ausschnitt gefunden.`;
}

function closePeakMapModal() {
document.getElementById('peakMapModal').style.display = 'none';
}

function selectPeakByIndex(idx) {
if (peakCandidates[idx]) {
selectedPeak = peakCandidates[idx];
renderSelectedPeak();
saveState();
closePeakMapModal();
}
}

async function searchMountainsAroundStartSilent() {

if (r.ok) {

if (d.results) {

function getDistance(a,b,c,d){const R=6371,dl=(c-a)*Math.PI/180,dn=(d-b)*Math.PI/180,x=Math.sin(dl/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dn/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}

function getPeakData(){return selectedPeak;}

function scoreRisk(d){
let s=0,r=[];const tourTypes=d.tourTypes||[];
if(d.gust>=75){s+=45;r.push('Kräftige Böen');}
if(d.rain>=4){s+=35;r.push('Starkregen');}
if([95,96,99].includes(d.code)){s+=70;r.push('Gewittergefahr');}
if(d.temp>=30){s+=25;r.push('Extreme Hitze (>30°C)');}
if(d.temp<=0 && d.rain>0){s+=40;r.push('Frost & Glatteis');}
return {score:Math.min(100,Math.round(s)),reasons:[...new Set(r)]};
}

function tourWarnings(d){
const a=[];
if([95,96,99].includes(d.code))a.push('⚡ <strong>Gewittergefahr:</strong> Exponierte Bereiche frühzeitig verlassen!');
if(d.temp>=30)a.push('☀️ <strong>Hitze:</strong> Über 30°C. Auf ausreichend Flüssigkeit achten!');
return a;
}

function conditionHint(d){if([95,96,99].includes(d.code))return'Gewittergefahr';if(d.rain>=4)return'Starkregen';return'Trocken / Bewölkt';}
function riskText(level){return level==='red'?'TOUR NICHT EMPFOHLEN':level==='orange'?'SCHWIERIGE BEDINGUNGEN':'GUTE & STABILE BEDINGUNGEN';}
function riskIcon(level){return level==='red'?'🔴':level==='orange'?'🟠':'🟢';}
function modelConfidence(){return {pct:90,text:'Hohe Modell-Einstimmigkeit.'};}
function windDir(deg){if(!Number.isFinite(deg))return'–';const dirs=['N','NO','O','SO','S','SW','W','NW'];return dirs[Math.round(deg/45)%8];}

async function analyzeRisk(){
const lat=Number(document.getElementById('lat').value),lon=Number(document.getElementById('lon').value),startStr=document.getElementById('startTime').value,duration=Number(document.getElementById('duration').value);
const selectedTourTypes = getSelectedTourTypes();
let peak=getPeakData();
if(!Number.isFinite(lat)||!Number.isFinite(lon)||!startStr){alert('Bitte Start und Startzeit angeben.');return;}
document.getElementById('results').innerHTML='<div style="text-align:center;padding:15px;color:#64748b;">🌦️ Wetter wird berechnet …</div>';

const startDt=new Date(startStr), endDt=new Date(startDt.getTime()+duration*3600000);
try{
const date=startDt.toLocaleDateString('sv-SE'), endDate=endDt.toLocaleDateString('sv-SE');
const vars='temperature_2m,precipitation,rain,snowfall,weather_code,precipitation_probability,wind_speed_10m,wind_gusts_10m,wind_direction_10m,cape';
const res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=${vars}&start_date=${date}&end_date=${endDate}&timezone=auto&wind_speed_unit=kmh`);
const data=await res.json();

const h=data.hourly, times=h.time||[];
let idx=0, bestDelta=Infinity;
times.forEach((x,i)=>{const delta=Math.abs(new Date(x).getTime()-startDt.getTime());if(delta<bestDelta){bestDelta=delta;idx=i;}});

let maxScore=-1,worstReason='',slots='',allWarn=[];
for(let i=0;i<duration;i++){
const bi=idx+i; if(bi>=times.length)break;
const t=times[bi];
let temp=Number(h.temperature_2m?.[bi]??0), rain=Number(h.precipitation?.[bi]??0), gust=Number(h.wind_gusts_10m?.[bi]??0), wind=Number(h.wind_speed_10m?.[bi]??0), dir=Number(h.wind_direction_10m?.[bi]??0), code=Number(h.weather_code?.[bi]??0);
const risk=scoreRisk({rain,gust,cape:0,code,prob:0,temp,tourTypes:selectedTourTypes});
if(risk.score>maxScore){maxScore=risk.score;worstReason=risk.reasons[0]||'';}
allWarn.push(...tourWarnings({code,temp}));
const hint=conditionHint({rain,code});
slots+='<div class="slot status-'+(risk.score>=60?'red':risk.score>=30?'orange':'green')+'"><strong>⏱️ '+t.replace('T',' ')+' Uhr</strong><br>🌡️ '+temp.toFixed(1)+' °C | 💨 '+Math.round(wind)+' km/h | 🌧️ '+rain.toFixed(1)+' mm | 🌦️ '+hint+'</div>';
}

const overall=maxScore>=60?'red':maxScore>=30?'orange':'green';
let html='<div style="font-weight:700;color:var(--primary);margin-bottom:8px;font-size:16px">📍 '+(document.getElementById('locationSearch').value||'Start')+(peak?' → ⛰️ '+peak.name:'')+'</div>';
html+='<div class="risk-hero risk-'+overall+'"><div class="risk-icon">'+riskIcon(overall)+'</div><div class="risk-title">'+riskText(overall)+'</div></div>';
if(allWarn.length)html+='<div class="warning-box">'+[...new Set(allWarn)].join('<br>')+'</div>';
html+=slots;
document.getElementById('results').innerHTML=html;
document.getElementById('pushToggleBtn').style.display='block';
saveState();
}catch(e){document.getElementById('results').innerHTML='<div class="warning-box">❌ Fehler beim Abrufen der Wetterdaten.</div>';}
}
