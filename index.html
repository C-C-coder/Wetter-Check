// ==========================================
// ALPINE RISIKO-ENGINE
// ==========================================
// Gefuehlte Temperatur nach der internationalen Windchill-Formel (gueltig ab
// Temperatur <= 10 Grad und Wind >= 4,8 km/h). Ein konkreter Wert sagt mehr als
// das Etikett "gefaehrlich".
function windChill(tempC, windKmh) {
if (tempC > 10 || windKmh < 4.8) return null;
const v = Math.pow(windKmh, 0.16);
return 13.12 + 0.6215 * tempC - 11.37 * v + 0.3965 * tempC * v;
}

function evaluateZoneRisk(weather, tourTypes, isPeak, month) {
let score = 0;
let reasons = [];
const isExposed = tourTypes.some(t=>['klettersteig','grat','hochtour','gletscher','klettern'].includes(t));
const isKlettersteigOrClimb = tourTypes.some(t=>['klettersteig','klettern'].includes(t));
const isHochtourOrGlacier = tourTypes.some(t=>['hochtour','gletscher'].includes(t));

const isThunder = [95,96,99].includes(weather.code) || (weather.cape >= 1000 && weather.prob >= 30);
if (isThunder && isKlettersteigOrClimb) {
 return { score: 100, reasons: ['⚡ Gewittergefahr am Klettersteig/Fels (Absolutes Risiko/ Drahtseile!)'] };
} else if (isThunder) {
 score += 70; 
 reasons.push('Gewittergefahr');
}

if (weather.rain >= 2.0 && (isKlettersteigOrClimb || isHochtourOrGlacier)) {
 return { score: 90, reasons: ['🌧️ Starker Regen bei Klettersteig/Hochtour (Extremer Nässe- & Absturzfaktor!)'] };
}

if (weather.wetRock && (isKlettersteigOrClimb || tourTypes.includes('grat'))) {
 score += 45;
 reasons.push(isPeak ? 'Feuchter Fels in exponierter Lage (Rutschgefahr)' : 'Fels durch Vorniederschlag noch nass');
}

const windFactor = isExposed ? 1.4 : 1.0;
if (weather.gust >= 80) { score += 55 * windFactor; reasons.push('Sturmböen'); }
else if (weather.gust >= 60) { score += 35 * windFactor; reasons.push('Kräftige Böen'); }
else if (weather.gust >= 45) { score += 20 * windFactor; reasons.push('Böen'); }

if (weather.rain >= 4) { score += 40; reasons.push('Starkregen'); }
else if (weather.rain >= 1) { score += 25; reasons.push('Regen'); }
else if (weather.prob >= 60 && weather.rain < 0.2) { score += 15; reasons.push('Hohe Schauerneigung'); }

// FIX: Open-Meteo liefert 'snowfall' in ZENTIMETERN. Die Schwelle "snow >= 2"
// meinte 2 cm und lag damit viel zu hoch - 1,5 cm Neuschnee ergaben in der App
// gar keinen Punkt, waehrend das Backend dafuer 35 vergab. Jetzt identisch.
if (weather.snow >= 1.0) { score += 35; reasons.push('Kräftiger Schneefall'); }
else if (weather.snow >= 0.2) { score += 20; reasons.push('Schneefall'); }
if (weather.ice) { score += 35; reasons.push('Vereisung / Glatteis'); }

if ((weather.vis > 0 && weather.vis < 2000) || [45,48].includes(weather.code)) {
 score += 25; reasons.push('Eingeschränkte Sicht / Nebel');
}
// FIX: Hitze und Windchill fehlten in der App vollstaendig - 32 Grad am
// Klettersteig ergaben 0 Punkte, also gruen. Das Backend wertete sie laengst.
if (weather.temp >= 30) { score += 25; reasons.push('Extreme Hitze (über 30°C)'); }
if (weather.temp <= -10 && weather.gust >= 30) {
 const gefuehlt = windChill(weather.temp, weather.gust);
 score += 25;
 reasons.push(gefuehlt !== null ? `Windchill ${Math.round(gefuehlt)}°C gefühlt` : 'Gefährlicher Windchill');
}

const finalScore = Math.min(100, Math.round(score));
let level = 'Niedrig';
if (finalScore >= 60) level = 'Hoch';
else if (finalScore >= 30) level = 'Mäßig';

return { score: finalScore, level: level, reasons: [...new Set(reasons)] };
}

function tourWarnings(weather, tourTypes, isPeak) {
const a = [];
const isKlettersteigOrClimb = tourTypes.some(t=>['klettersteig','klettern'].includes(t));
const isThunder = [95,96,99].includes(weather.code) || (weather.cape >= 1000 && weather.prob >= 30);

if (weather.wetRock && isKlettersteigOrClimb) {
 // Der Zustand "nasser Fels" allein sagt nicht, woher er kommt. Ob es gerade
 // regnet oder vor der Tour geregnet hat, ist für die Einschätzung ein
 // Unterschied - im zweiten Fall trocknet der Fels womöglich ab.
 a.push(weather.rainNow
   ? '⚠️ <strong>Es regnet – nasser Fels:</strong> Rutschig in steilen und ausgesetzten Passagen. Erhöhte Absturzgefahr!'
   : '⚠️ <strong>Es hat geregnet – nasser Fels:</strong> Fels noch klamm, rutschig in steilen und ausgesetzten Passagen. Erhöhte Absturzgefahr!');
}
if (isThunder && isKlettersteigOrClimb) {
 a.push('⚡ <strong>Lebensgefahr am Klettersteig:</strong> Drahtseile wirken wie Blitzableiter!');
} else if (isThunder) {
 a.push('⚡ <strong>Gewittergefahr:</strong> Blitzeinschlagsrisiko in exponierten Bereichen.');
}
if (weather.gust >= 50 && isKlettersteigOrClimb) {
 a.push('💨 <strong>Wind an Geländekanten:</strong> Erhöhtes Sturzrisiko.');
}
if ((weather.vis > 0 && weather.vis < 2000) || [45,48].includes(weather.code)) {
 // FIX: Die Warnung lautete pauschal "Nebel schränkt Orientierung ein" und war
 // dadurch nicht nachvollziehbar - sie stammte fast immer vom Gipfel, während in
 // den Stundenzeilen die Talsicht mit ">24km" stand. Jetzt steht dabei, wo sie gilt
 // und wie schlecht es wirklich ist.
 const wo = isPeak ? 'am Gipfel' : 'im Tal';
 const wie = weather.vis > 0 && weather.vis < 2000
     ? `Sicht ${wo} nur ${Math.round(weather.vis)} m`
     : `Nebel ${wo} gemeldet`;
 a.push(`👁️ <strong>Sichtwarnung:</strong> ${wie} – Orientierung erschwert.`);
}
if (weather.ice) {
 a.push('🧊 <strong>Glatteis:</strong> Gefrierende Nässe.');
}
return a;
}

function conditionHint(d){
// FIX: Die Gesamtbewertung stuft ein Gewitter auch dann ein, wenn nur die
// Labilitätsenergie hoch ist (cape >= 1000 bei prob >= 30) - der Stundentext
// prüfte aber ausschließlich den WMO-Code. Dadurch stand oben "erhöhtes
// Gewitterrisiko ab 06:00", während in der betreffenden Stunde bloß
// "Regen / Nässe" zu lesen war. Beide Wege führen jetzt zum selben Hinweis.
if([95,96,99].includes(d.code)) return 'Gewittergefahr';
if(d.cape>=1000 && d.prob>=30) return 'Gewitterneigung (labile Luft)';
// Nebel vor Regen prüfen: Wer in der Wolke steht, hat ein Orientierungsproblem,
// und das wiegt am Grat schwerer als die Nässe. Vorher konnte "Regen / Nässe"
// den Nebelhinweis verdecken.
if([45,48].includes(d.code) || (d.vis>0&&d.vis<1000)) return 'Nebel / Sicht unter 1km';
// FIX: Bezeichnungen an die Ampel angeglichen. Bei 85 km/h stand hier
// "Kräftige Böen", waehrend die Ampel "Sturmböen" meldete - dieselbe Lage
// unter zwei Namen. Ebenso beim Schnee.
if(d.snow>=1) return 'Kräftiger Schneefall';
if(d.snow>=0.2) return 'Schneefall';
if(d.rain>=4) return 'Starkregen';
if(d.rain>=.1) return 'Regen / Nässe';
if(d.gust>=80) return 'Sturmböen';
if(d.gust>=60) return 'Kräftige Böen';
if(d.gust>=45) return 'Böen';
if(d.vis>0&&d.vis<2000) return 'Schlechte Sicht';
if(d.prob>=60) return 'Hohe Schauerneigung';
return 'Trocken / Stabil';
}

function calculateRealModelConfidence(quellen, startIndex, duration) {
// quellen: Liste von hourly-Objekten (Tal, Zwischenpunkte, Gipfel). Alle wurden
// mit denselben Modellen und demselben Zeitraum abgerufen; Quellen mit
// abweichender Zeitachse werden verworfen statt falsch indiziert.
const basis = quellen.find(q => q && Array.isArray(q.time));
if (!basis) return { pct: null, spread: '', text: 'Keine Prognosedaten verfügbar.' };
const punkte = quellen.filter(q => q && Array.isArray(q.time) && q.time.length === basis.time.length);
const h = basis;
const MODELLE = ['icon_d2','ecmwf_ifs04','gfs_seamless','geosphere_arome_austria','arome_france'];

// Werte aller Modelle für einen Parameter zu einem Zeitschritt einsammeln
function werte(quelle, feld, idx) {
 if (!quelle) return [];
 return MODELLE.map(m => quelle[`${feld}_${m}`]?.[idx])
               .filter(v => typeof v === 'number' && Number.isFinite(v));
}

let totalScore = 0, validHours = 0;
// Spannweiten über den ganzen Tourzeitraum, für die Anzeige
let tSpanne = 0, rSpanne = 0, wSpanne = 0;
// Start mit Spannweite 0, damit der Vergleich "groesser als bisher" funktioniert.
let gustMin = 0, gustMax = 0, regenMin = 0, regenMax = 0;

for (let i = 0; i < duration; i++) {
 const idx = startIndex + i;
 if (idx >= h.time.length) break;

 // FIX: Verglichen wurde nur das Tal. Am Gipfel gehen die Modelle deutlich
 // weiter auseinander - und genau dort wird die Tour entschieden. Es zählt
 // jetzt die jeweils größere Streuung von Tal und Gipfel.
 // Je Ort die Streuung der Modelle bestimmen; maßgeblich ist der Ort mit der
 // größten Uneinigkeit. Die Zwischenpunkte der Route wurden ohnehin mit allen
 // Modellen geladen - sie flossen bisher nur nicht in die Bewertung ein.
 const spanne = (a) => a.length > 1 ? (Math.max(...a) - Math.min(...a)) : 0;
 const proOrt = (feld) => punkte.map(q => werte(q, feld, idx));

 const tempsAlle = proOrt('temperature_2m');
 const rainsAlle = proOrt('precipitation');
 const windsAlle = proOrt('wind_speed_10m');
 const gustsAlle = proOrt('wind_gusts_10m');

 const tempDiff = Math.max(0, ...tempsAlle.map(spanne));
 const rainDiff = Math.max(0, ...rainsAlle.map(spanne));
 const windDiff = Math.max(0, ...windsAlle.map(spanne));

 const temps = tempsAlle.flat(), rains = rainsAlle.flat(), winds = windsAlle.flat();

 tSpanne = Math.max(tSpanne, tempDiff);
 rSpanne = Math.max(rSpanne, rainDiff);
 wSpanne = Math.max(wSpanne, windDiff);

 // WICHTIG: Die Spannweite muss die Uneinigkeit der MODELLE beschreiben, nicht
 // den Unterschied zwischen Tal und Gipfel. Ein globales Minimum über alle Orte
 // ergäbe "Böen 25-130 km/h" - das ist aber der normale Höhengradient und hätte
 // Modellstreuung vorgetäuscht, wo keine ist. Deshalb je Ort getrennt messen und
 // den Ort mit der größten Streuung ausweisen.
 gustsAlle.forEach(g => {
     if (g.length > 1 && (Math.max(...g) - Math.min(...g)) > (gustMax - gustMin)) {
         gustMin = Math.min(...g); gustMax = Math.max(...g);
     }
 });
 rainsAlle.forEach(r => {
     if (r.length > 1 && (Math.max(...r) - Math.min(...r)) > (regenMax - regenMin)) {
         regenMin = Math.min(...r); regenMax = Math.max(...r);
     }
 });

 const tempScore = Math.max(0, 100 - (Math.max(0, tempDiff - 1.5) * 15));
 const rainScore = Math.max(0, 100 - (Math.max(0, rainDiff - 0.5) * 12));
 const windScore = Math.max(0, 100 - (Math.max(0, windDiff - 10) * 2));

 if (temps.length > 1 || rains.length > 1 || winds.length > 1) {
     totalScore += (tempScore * 0.3) + (rainScore * 0.4) + (windScore * 0.3);
     validHours++;
 }
}

// FIX: Ohne Vergleichsdaten stand hier pauschal 85 % und "Sehr gute
// Modellübereinstimmung" - eine erfundene Zahl, die Verlässlichkeit vortäuschte.
if (validHours === 0) {
 return { pct: null, spread: '',
          text: 'Es liegen keine Vergleichsdaten weiterer Modelle vor. Die Angaben stammen aus einem einzelnen Modelllauf.' };
}

const finalPct = Math.round(totalScore / validHours);
let text = 'Sehr gute Modellübereinstimmung für diesen Zeitraum.';
if (finalPct < 80) text = 'Leichte Unsicherheiten in der Prognose (Modelle weichen ab).';
if (finalPct < 60) text = 'Hohe Unsicherheit: Die Modelle sind sich uneinig. Der ungünstigste Fall ist real möglich.';

// Die Spannweite ist die eigentlich nutzbare Information - eine Prozentzahl
// allein sagt nicht, WORIN die Modelle uneinig sind.
const teile = [];
if (gustMax - gustMin >= 15) {
 teile.push(`Böen je nach Modell ${Math.round(gustMin)}–${Math.round(gustMax)} km/h`);
}
if (regenMax - regenMin >= 1) {
 teile.push(`Niederschlag ${regenMin.toFixed(1)}–${regenMax.toFixed(1)} mm/h`);
}
if (tSpanne >= 3) teile.push(`Temperatur ± ${(tSpanne / 2).toFixed(1)} °C`);

return { pct: finalPct, text: text,
         spread: teile.length ? 'Spannweite: ' + teile.join(' · ') : '' };
}

function windDir(deg){
if(!Number.isFinite(deg)) return '–';
const dirs=['N','NO','O','SO','S','SW','W','NW'];
return dirs[Math.round(deg/45)%8];
}

async function analyzeRisk(){
const lat = Number(document.getElementById('start_lat').value) || Number(document.getElementById('lat').value);
const lon = Number(document.getElementById('start_lon').value) || Number(document.getElementById('lon').value);
const startStr = document.getElementById('startTime').value;
const duration = Number(document.getElementById('duration').value);
const selectedTourTypes = getSelectedTourTypes();
let peak = getPeakData();

if(!Number.isFinite(lat) || !Number.isFinite(lon) || !startStr){
 alert('Bitte Startort und Startzeit angeben.');
 return;
}

document.getElementById('results').innerHTML = '<div class="loading" style="text-align:center;padding:15px;color:#64748b;">🌦️ Alpine Risiko-Engine berechnet Tal- & Gipfel-Werte …</div>';

const startDt = new Date(startStr);
const endDt = new Date(startDt.getTime()+duration*3600000);
const tourMonth = startDt.getMonth();
const isSummer = (tourMonth >= 5 && tourMonth <= 7);
const isWinterSeason = (tourMonth >= 10 || tourMonth <= 4);
const startHour = startDt.getHours();
const isHighTourOrGlacier = selectedTourTypes.some(t => ['hochtour', 'gletscher'].includes(t));

try{
 const searchStart = new Date(startDt.getTime() - 4 * 3600000);
 const date = searchStart.toLocaleDateString('sv-SE');
 const endDate = endDt.toLocaleDateString('sv-SE');
 
 // is_day und apparent_temperature wurden abgerufen, aber nie verwendet - entfernt.
 // freezing_level_height ergaenzt: dient als Rueckfall fuer die Schneefallgrenze.
 const vars = 'temperature_2m,precipitation,rain,snowfall,weather_code,precipitation_probability,cloud_cover,visibility,wind_speed_10m,wind_direction_10m,wind_gusts_10m,cape,snowfall_height,freezing_level_height,dew_point_2m';
 const multiModels = 'best_match,icon_d2,ecmwf_ifs04,gfs_seamless,geosphere_arome_austria,arome_france';

 // =====================================================================
 // ROUTENPUNKTE STATT NUR TAL UND GIPFEL
 // ---------------------------------------------------------------------
 // Bisher wurden ausschließlich Start und Gipfel ausgewertet. Genau dazwischen
 // liegen aber die Stellen, die auf einer Bergtour zählen: der Sattel im Wind,
 // die schattige Nordflanke, der Grat auf halber Höhe. Ein Gewitter, das nur
 // die Mitte der Route trifft, tauchte in der Bewertung überhaupt nicht auf.
 //
 // Open-Meteo nimmt mehrere Koordinaten in EINEM Request entgegen. Die
 // Zwischenpunkte kosten also keinen zusätzlichen Aufruf - im Gegenteil, Tal
 // und Gipfel wandern in denselben Request und es wird einer gespart.
 // =====================================================================
 const ROUTE_SAMPLES = 5;   // Tal, 3 Zwischenpunkte, Gipfel

 function buildRoutePoints() {
     const pts = [{ lat: lat, lon: lon, alt: null, label: 'Tal', frac: 0 }];
     const track = (typeof gpxTrackForCloud !== 'undefined' && gpxTrackForCloud
                    && gpxTrackForCloud.length >= 2) ? gpxTrackForCloud : null;

     if (track) {
         // Entlang des echten Wegs, gleichmäßig nach Streckenanteil
         const kum = [0];
         for (let i = 1; i < track.length; i++) {
             const dLat = (track[i][0] - track[i-1][0]) * 110.54;
             const dLon = (track[i][1] - track[i-1][1]) * 111.32 * Math.cos(track[i][0] * Math.PI / 180);
             kum.push(kum[i-1] + Math.hypot(dLat, dLon));
         }
         const gesamt = kum[kum.length - 1];
         if (gesamt > 0.3) {
             for (let s = 1; s < ROUTE_SAMPLES - 1; s++) {
                 const ziel = gesamt * (s / (ROUTE_SAMPLES - 1));
                 let i = kum.findIndex(k => k >= ziel);
                 if (i < 1) i = 1;
                 const sp = kum[i] - kum[i-1];
                 const f = sp > 0 ? (ziel - kum[i-1]) / sp : 0;
                 pts.push({
                     lat: track[i-1][0] + (track[i][0] - track[i-1][0]) * f,
                     lon: track[i-1][1] + (track[i][1] - track[i-1][1]) * f,
                     alt: track[i-1][2] != null && track[i][2] != null
                          ? Math.round(track[i-1][2] + (track[i][2] - track[i-1][2]) * f) : null,
                     label: `Route ${Math.round(100 * s / (ROUTE_SAMPLES - 1))}%`,
                     frac: s / (ROUTE_SAMPLES - 1)
                 });
             }
         }
     } else if (peak && Number.isFinite(peak.lat) && Number.isFinite(peak.lon)) {
         // Ohne GPX: Luftlinie. Grob, aber immer noch besser als gar keine
         // Zwischenpunkte - die Höhe wird linear mitgeführt.
         for (let s = 1; s < ROUTE_SAMPLES - 1; s++) {
             const f = s / (ROUTE_SAMPLES - 1);
             pts.push({
                 lat: lat + (peak.lat - lat) * f,
                 lon: lon + (peak.lon - lon) * f,
                 alt: null,
                 label: `Route ${Math.round(100 * f)}%`,
                 frac: f
             });
         }
     }

     if (peak && Number.isFinite(peak.lat) && Number.isFinite(peak.lon)) {
         pts.push({ lat: peak.lat, lon: peak.lon, alt: peak.alt || null, label: 'Gipfel', frac: 1 });
     }
     return pts;
 }

 const routePoints = buildRoutePoints();
 const hasPeakPoint = routePoints.length > 1 && routePoints[routePoints.length - 1].label === 'Gipfel';

 const iconUrl = 'latitude='+lat+'&longitude='+lon+'&hourly='+vars+'&daily=sunrise,sunset,daylight_duration&start_date='+date+'&end_date='+endDate+'&timezone=auto&wind_speed_unit=kmh&models='+multiModels;

 // Alle Punkte außer dem Tal in einem einzigen Request. Höhenangaben nur dort,
 // wo sie bekannt sind - sonst nimmt Open-Meteo seine eigene Gitterhöhe.
 const weitere = routePoints.slice(1);
 let routeUrl = null;
 if (weitere.length) {
     routeUrl = 'https://api.open-meteo.com/v1/forecast'
         + '?latitude=' + weitere.map(p => p.lat.toFixed(5)).join(',')
         + '&longitude=' + weitere.map(p => p.lon.toFixed(5)).join(',')
         + '&hourly=' + vars + '&start_date=' + date + '&end_date=' + endDate
         + '&timezone=auto&wind_speed_unit=kmh&models=' + multiModels;
     if (weitere.some(p => p.alt)) {
         routeUrl += '&elevation=' + weitere.map(p => p.alt || 'nan').join(',');
     }
 }

 const [baseR, routeR, elevR] = await Promise.all([
     fetch('https://api.open-meteo.com/v1/forecast?'+iconUrl),
     routeUrl ? fetch(routeUrl) : Promise.resolve(null),
     fetch('https://api.open-meteo.com/v1/elevation?latitude='+lat+'&longitude='+lon)
 ]);

 const data = await baseR.json();
 const elevD = await elevR.json();

 // Mehrere Koordinaten liefern ein Array, eine einzelne ein Objekt.
 let routeData = [];
 if (routeR && routeR.ok) {
     const rj = await routeR.json();
     routeData = Array.isArray(rj) ? rj : [rj];
 }
 routeData.forEach((rd, i) => {
     if (rd && rd.hourly) {
         Object.keys(rd.hourly).forEach(k => {
             if (k.endsWith('_best_match')) rd.hourly[k.replace('_best_match','')] = rd.hourly[k];
         });
         if (weitere[i]) weitere[i].hourly = rd.hourly;
     }
 });

 // Der Gipfel bleibt für die bestehende Zwei-Spalten-Darstellung gesondert greifbar.
 const pData = hasPeakPoint && weitere.length
     ? { hourly: weitere[weitere.length - 1].hourly } : null;

 const baseElev = Number(elevD.elevation?.[0]||0);
 const h = data.hourly;
 const pH = pData?.hourly;

 if (h) {
     Object.keys(h).forEach(key => {
         if (key.endsWith('_best_match')) {
             h[key.replace('_best_match', '')] = h[key];
         }
     });
 }
 if (pH) {
     Object.keys(pH).forEach(key => {
         if (key.endsWith('_best_match')) {
             pH[key.replace('_best_match', '')] = pH[key];
         }
     });
 }

 const times = h.time||[];
 const targetMs = startDt.getTime();

 const sunsetStr = data.daily?.sunset?.[0];
 const sunsetDt = sunsetStr ? new Date(sunsetStr) : null;
 const isAfterSunset = sunsetDt && (endDt > sunsetDt);
 
 let idx=0, bestDelta=Infinity;
 times.forEach((x,i)=>{
     const delta=Math.abs(new Date(x).getTime()-targetMs);
     if(delta<bestDelta){bestDelta=delta;idx=i;}
 });

 let liveBlend=null;
 if(liveIsTourWindow()){
     try{ liveBlend = await fetchLiveCenter(lat,lon); }catch(e){}
 }

 let slots='', maxTotalScore=-1, maxLevel='Niedrig';
 // Warnungen werden jetzt MIT ihren Stunden gesammelt. Vorher war es eine flache
 // Liste, die am Ende nur dedupliziert wurde - dadurch stand in der Box zwar
 // "Sichtwarnung: Sicht am Gipfel nur 400 m", aber nicht, ob das um 06:00 oder
 // um 13:00 gilt. Für eine Tourplanung ist genau das die entscheidende Angabe.
 const warnHours = new Map();
 const slotZeiten = [];
 function sammleWarnungen(liste, stunde) {
     liste.forEach(txt => {
         if (!warnHours.has(txt)) warnHours.set(txt, []);
         warnHours.get(txt).push(stunde);
     });
 }
 const parsedPeakAlt = peak && peak.alt ? parseFloat(peak.alt) : 0;
 const hasPeakAlt = Number.isFinite(parsedPeakAlt) && parsedPeakAlt > 0;

 let maxGust = 0, gustTime = "";
 let firstRainTime = null;
 let maxThunderRisk = false, thunderTime = "";

 for(let i=0; i<duration; i++){
     const bi=idx+i; 
     if(bi>=times.length) break;
     const t=times[bi];
     
     let temp=Number(h.temperature_2m?.[bi]??0);
     // FIX: Wurde für die Wolkenbasis im Tal gebraucht, aber nie deklariert -
     // im Unterschied zum Gipfel, wo pdew korrekt gesetzt wird. Jede Tourabfrage
     // brach deshalb mit "ReferenceError: dew is not defined" ab, sichtbar nur
     // als generisches "Fehler beim Abrufen der Wetterdaten".
     let dew=Number.isFinite(Number(h.dew_point_2m?.[bi])) ? Number(h.dew_point_2m[bi]) : (temp-3);
     let rain=Number(h.precipitation?.[bi]??0);
     let snow=Number(h.snowfall?.[bi]??0);
     let wind=Number(h.wind_speed_10m?.[bi]??0);
     let gust=Number(h.wind_gusts_10m?.[bi]??0);
     let dir=Number(h.wind_direction_10m?.[bi]??0);
     let prob=Number(h.precipitation_probability?.[bi]??0);
     let cape=Number(h.cape?.[bi]??0);
     let vis=Number(h.visibility?.[bi]??0);
     let code=Number(h.weather_code?.[bi]??0);
     let cloud=Number(h.cloud_cover?.[bi]??0);
     // FIX: snowfall_height liefert nicht jedes Modell. Fehlte der Wert, wurde 0
     // eingesetzt und als "Schneefallgrenze: 0m" angezeigt - das hiesse, es
     // schneit bis auf Meereshoehe. Ersatzweise wird die Nullgradgrenze
     // herangezogen; Schnee faellt typischerweise 250 m darunter bis zum Boden durch.
     let snowHeightRaw = Number(h.snowfall_height?.[bi]);
     let freezingLvl = Number(h.freezing_level_height?.[bi]);
     let snowHeight = Number.isFinite(snowHeightRaw) && snowHeightRaw > 0
         ? snowHeightRaw
         : (Number.isFinite(freezingLvl) && freezingLvl > 0 ? Math.max(0, freezingLvl - 250) : null);

     let nowcastRegen = 0;
     if(liveBlend?.nc?.times?.length){
         const hourStart=new Date(t).getTime();
         const hourEnd=hourStart+3600000;
         liveBlend.nc.times.forEach((ts,k)=>{
             const ms=new Date(ts).getTime();
             if(ms>=hourStart&&ms<hourEnd) nowcastRegen+=Number(liveBlend.nc.values?.[k]||0);
         });
         if(nowcastRegen>0){
             rain=Math.max(rain,nowcastRegen);
             prob=Math.max(prob,Math.min(100,Math.round(35+nowcastRegen*25)));
         }
     }
     if(liveBlend?.current && Math.abs(new Date(t)-new Date())<45*60000){
         const lc=liveBlend.current;
         if(Number.isFinite(Number(lc.temperature_2m))) temp=Number(lc.temperature_2m);
         if(Number.isFinite(Number(lc.wind_speed_10m))) wind=Number(lc.wind_speed_10m);
         if(Number.isFinite(Number(lc.wind_gusts_10m))) gust=Number(lc.wind_gusts_10m);
         if(Number.isFinite(Number(lc.rain))) rain=Math.max(rain,Number(lc.rain));
     }

     let baseWetRock = false;
     for(let p=0; p<=3; p++){
         let pre = bi-p;
         if(pre>=0 && Number(h.precipitation?.[pre]??0) >= 0.1) {
             if (!isSummer || p <= 1) {
                 baseWetRock = true; 
                 break;
             }
         }
     }

     const isFreezing = temp <= 1;
     const isIce = isFreezing && (snow > 0 || rain > 0.05);

     const valleyWeather = { rain, snow, gust, wind, cape, code, prob, vis, temp, ice: isIce, wetRock: baseWetRock, rainNow: rain >= 0.1 };
     const valleyRisk = evaluateZoneRisk(valleyWeather, selectedTourTypes, false, tourMonth);

     // FIX: Der Nowcast korrigierte bisher ausschliesslich den Talwert. Der Gipfel
     // behielt die reine Modellprognose, obwohl das Radar auch dort misst - die
     // beiden Spalten konnten sich dadurch offen widersprechen. Der gemessene
     // Niederschlag wird jetzt auch auf den Gipfel angewandt; orographisch faellt
     // dort eher mehr, nie weniger, deshalb als Untergrenze.
     let ptemp = pH ? Number(pH.temperature_2m?.[bi]) : (hasPeakAlt ? temp - (((parsedPeakAlt - baseElev)/100) * 0.65) : temp);
     let pdew = pH ? Number(pH.dew_point_2m?.[bi]) : (temp - 3);
     let pwind = pH ? Number(pH.wind_speed_10m?.[bi]) : wind;
     let pgust = pH ? Number(pH.wind_gusts_10m?.[bi]) : (hasPeakAlt ? gust * 1.2 : gust);
     let pdir = pH ? Number(pH.wind_direction_10m?.[bi]) : dir;
     let prain = pH ? Number(pH.precipitation?.[bi]) : rain;
     let psnow = pH ? Number(pH.snowfall?.[bi]) : snow;
     let pcode = pH ? Number(pH.weather_code?.[bi]) : code;
     let pcape = pH ? Number(pH.cape?.[bi]) : cape;
     let pprob = pH ? Number(pH.precipitation_probability?.[bi]) : prob;
     let pvis = pH ? Number(pH.visibility?.[bi]) : vis;

     let peakCloudBaseMsl = hasPeakAlt ? Math.round(parsedPeakAlt + Math.max(0, (ptemp - pdew) * 125)) : 0;
     
     let pWetRock = false;
     if(pH) {
         for(let p=0; p<=3; p++){
             let pre = bi-p;
             if(pre>=0 && Number(pH.precipitation?.[pre]??0) >= 0.1) {
                 if (!isSummer || p <= 1) {
                     pWetRock = true; 
                     break;
                 }
             }
         }
     } else {
         pWetRock = baseWetRock;
     }

     if (nowcastRegen > 0 && hasPeakAlt) {
         prain = Math.max(prain, nowcastRegen);
         pprob = Math.max(pprob, Math.min(100, Math.round(35 + nowcastRegen * 25)));
     }

     const peakWeather = { rain: prain, snow: psnow, gust: pgust, wind: pwind, cape: pcape, code: pcode, prob: pprob, vis: pvis, temp: ptemp, ice: ptemp<=1&&(psnow>0||prain>0.05), wetRock: pWetRock, rainNow: prain >= 0.1 };
     const peakRisk = evaluateZoneRisk(peakWeather, selectedTourTypes, true, tourMonth);

     let currentMaxGust = Math.max(gust, hasPeakAlt ? pgust : 0);
     if (currentMaxGust > maxGust) { maxGust = currentMaxGust; gustTime = t.replace('T', ' '); }
     
     if (!firstRainTime && (rain > 0.1 || (hasPeakAlt && prain > 0.1))) {
         firstRainTime = t.replace('T', ' ');
     }
     
     if ([95,96,99].includes(code) || (cape >= 1000 && prob >= 30) || (hasPeakAlt && ([95,96,99].includes(pcode) || (pcape >= 1000 && pprob >= 30)))) {
         maxThunderRisk = true;
         if (!thunderTime) thunderTime = t.replace('T', ' ');
     }

     const slotMaxScore0 = Math.max(valleyRisk.score, hasPeakAlt ? peakRisk.score : 0);

     // --- Zwischenpunkte der Route auswerten -----------------------------
     // Sie fließen in die Bewertung ein, werden aber nur angezeigt, wenn sie
     // schlechter sind als Tal und Gipfel - sonst wäre die Karte überfrachtet.
     let routeWorst = null;
     for (let ri = 0; ri < weitere.length - (hasPeakPoint ? 1 : 0); ri++) {
         const rp = weitere[ri];
         if (!rp.hourly) continue;
         const rTemp = Number(rp.hourly.temperature_2m?.[bi]);
         if (!Number.isFinite(rTemp)) continue;
         const rGust = Number(rp.hourly.wind_gusts_10m?.[bi] ?? gust);
         const rRain = Number(rp.hourly.precipitation?.[bi] ?? 0);
         const rSnow = Number(rp.hourly.snowfall?.[bi] ?? 0);
         const rCode = Number(rp.hourly.weather_code?.[bi] ?? 0);
         const rCape = Number(rp.hourly.cape?.[bi] ?? 0);
         const rProb = Number(rp.hourly.precipitation_probability?.[bi] ?? 0);
         const rVis = Number(rp.hourly.visibility?.[bi] ?? 0);

         let rWet = false;
         for (let p = 0; p <= 3; p++) {
             const pre = bi - p;
             if (pre >= 0 && Number(rp.hourly.precipitation?.[pre] ?? 0) >= 0.1) {
                 if (!isSummer || p <= 1) { rWet = true; break; }
             }
         }
         const rW = { rain: rRain, snow: rSnow, gust: rGust, wind: Number(rp.hourly.wind_speed_10m?.[bi] ?? wind),
                      cape: rCape, code: rCode, prob: rProb, vis: rVis, temp: rTemp,
                      ice: rTemp <= 1 && (rSnow > 0 || rRain > 0.05), wetRock: rWet, rainNow: rRain >= 0.1 };
         const rRisk = evaluateZoneRisk(rW, selectedTourTypes, true, tourMonth);
         if (!routeWorst || rRisk.score > routeWorst.score) {
             routeWorst = { score: rRisk.score, label: rp.label, w: rW,
                            alt: rp.alt, hint: conditionHint(rW) };
         }
         if ([95,96,99].includes(rCode) || (rCape >= 1000 && rProb >= 30)) {
             maxThunderRisk = true;
             if (!thunderTime) thunderTime = t.replace('T', ' ');
         }
     }

     const slotMaxScore = Math.max(slotMaxScore0, routeWorst ? routeWorst.score : 0);
     if(slotMaxScore > maxTotalScore) {
         maxTotalScore = slotMaxScore;
         maxLevel = slotMaxScore >= 60 ? 'Hoch' : (slotMaxScore >= 30 ? 'Mäßig' : 'Niedrig');
     }

     // Vollen Zeitstempel sammeln, nicht nur "HH:MM": Sonst sortiert eine Tour
     // von 22:00 bis 02:00 die Nachtstunden vor die Abendstunden und zerreißt
     // einen zusammenhängenden Zeitraum in zwei Blöcke. Alpine Starts liegen
     // regelmäßig vor Mitternacht.
     const slotStunde = t;
     slotZeiten.push(t);
     sammleWarnungen(tourWarnings(valleyWeather, selectedTourTypes, false), slotStunde);
     if(hasPeakAlt) sammleWarnungen(tourWarnings(peakWeather, selectedTourTypes, true), slotStunde);
     if(routeWorst && routeWorst.score > slotMaxScore0) {
         sammleWarnungen(tourWarnings(routeWorst.w, selectedTourTypes, true), slotStunde);
     }

     const hint = conditionHint(valleyWeather);
     const dirTxt = windDir(dir);
     const pDirTxt = windDir(pdir);

     // FIX: Angezeigt wurde bisher NUR die Sichtweite des Tals - berechnet und für
     // die Warnung "Nebel schränkt Orientierung ein" benutzt wurde aber die des
     // Gipfels. Dadurch stand oben eine Sichtwarnung, während in jeder Stundenzeile
     // ">24km" zu lesen war. Jetzt wird beides getrennt ausgewiesen.
     const visFmt = (v) => Number.isFinite(v) && v > 0
         ? (v >= 24000 ? '>24km' : (v >= 1000 ? (v/1000).toFixed(1)+'km' : Math.round(v)+'m'))
         : '–';
     const visTxt = visFmt(vis);
     const pvisTxt = visFmt(pvis);

     // Wolkenbasis auch fürs Tal, damit vergleichbar. Und der eigentlich
     // entscheidende Hinweis: Liegt die Wolkenbasis auf oder unter dem eigenen
     // Standort, steht man IM Nebel - unabhängig davon, was die Sichtweite sagt.
     const valleyCloudBaseMsl = Math.round(baseElev + Math.max(0, (temp - dew) * 125));
     const imNebelTal = cloud > 60 && valleyCloudBaseMsl <= baseElev + 60;
     const imNebelGipfel = hasPeakAlt && cloud > 60 && peakCloudBaseMsl <= parsedPeakAlt + 60;

     const nebelTxt = (flag) => flag
         ? '<br><span style="color:#b45309">🌫️ <strong>in Wolken</strong> – Sicht am Boden stark eingeschränkt</span>' : '';

     const peakBox = hasPeakAlt ? `<div><div class="weather-box-title">⛰️ Gipfel (${Math.round(parsedPeakAlt)}m)</div>🌡️ ${ptemp.toFixed(1)}°C<br>💨 Wind: ${Math.round(pwind)} km/h (Böen: ${Math.round(pgust)} km/h)<br>🧭 ${pDirTxt}<br>🌦️ ${conditionHint(peakWeather)}<br>🌧️ ${prain.toFixed(1)}mm<br>💧 Regenwahrscheinlichkeit: ${Math.round(pprob)}%<br>👁️ Sicht: ${pvisTxt}<br>☁️ Wolkenbasis: ca. ${peakCloudBaseMsl}m${nebelTxt(imNebelGipfel)}</div>` : '';

     // Zwischenpunkt nur zeigen, wenn er tatsächlich der kritischste ist.
     const routeBox = (routeWorst && routeWorst.score > slotMaxScore0 + 5)
         ? `<div style="font-size:11px;margin-top:6px;padding:6px;background:#fff7ed;border-radius:6px;border-left:3px solid #f59e0b">
              ⚠️ <strong>Kritischster Punkt: ${routeWorst.label}${routeWorst.alt ? ' ('+routeWorst.alt+'m)' : ''}</strong> –
              ${routeWorst.hint}, Böen ${Math.round(routeWorst.w.gust)} km/h, ${routeWorst.w.rain.toFixed(1)}mm.
              Schlechter als Tal und Gipfel.
            </div>` : '';

     const cls = slotMaxScore>=60?'status-red':slotMaxScore>=30?'status-orange':'status-green';

     slots+=`<div class="slot ${cls}"><div style="display:flex;justify-content:space-between"><strong>⏱️ ${t.replace('T',' ')} Uhr</strong><span>Risiko: <strong>${slotMaxScore>=60?'Hoch':(slotMaxScore>=30?'Mäßig':'Niedrig')}</strong></span></div><div class="weather-split${hasPeakAlt?'':' single-col'}"><div><div class="weather-box-title">📍 Tal (${Math.round(baseElev)}m)</div>🌡️ ${temp.toFixed(1)}°C<br>💨 Wind: ${Math.round(wind)} km/h (Böen: ${Math.round(gust)} km/h)<br>🧭 ${dirTxt}<br>🌦️ ${hint}<br>🌧️ ${rain.toFixed(1)}mm<br>💧 Regenwahrscheinlichkeit: ${Math.round(prob)}%<br>👁️ Sicht: ${visTxt}<br>☁️ Wolkenbasis: ca. ${valleyCloudBaseMsl}m${nebelTxt(imNebelTal)}</div>${peakBox}</div>${routeBox}<div style="font-size:11px">Bewölkung: ${Math.round(cloud)}%${snowHeight !== null ? ` · Schneefallgrenze: ${Math.round(snowHeight)}m` : ''}</div></div>`;
 }

 // Modellstreuung fliesst jetzt in die Bewertung ein. Bisher stand die Zahl nur
 // dekorativ in einer Box: Bei 45 % Uebereinstimmung meldete die Ampel dieselbe
 // Stufe wie bei 98 %, obwohl im ersten Fall die halbe Modellpalette etwas
 // anderes rechnet. Sind sich die Modelle uneinig, ist der unguenstigere Fall
 // real moeglich - dann wird eine knapp verfehlte Schwelle angehoben.
 // Tal, alle Zwischenpunkte der Route und Gipfel fließen in den Vergleich ein.
 const vergleichsQuellen = [h, ...weitere.map(w => w.hourly)].filter(Boolean);
 const conf = calculateRealModelConfidence(vergleichsQuellen, idx, duration);
 let bewertungsScore = maxTotalScore;
 let unsicherheitHinweis = '';
 if (conf.pct !== null && conf.pct < 60 && maxTotalScore >= 20 && maxTotalScore < 60) {
     bewertungsScore = Math.min(100, maxTotalScore + 15);
     unsicherheitHinweis = 'Bewertung angehoben, weil die Modelle deutlich auseinanderliegen.';
 }
 const overall = bewertungsScore>=60?'red':bewertungsScore>=30?'orange':'green';
 const tourName = selectedTourTypes.length ? selectedTourTypes.map(t=>TOUR_NAMES[t]).join(' + ') : 'Wetteranalyse';
 
 // Aufeinanderfolgende Stunden zu Fenstern zusammenfassen. Eine Warnung, die von
 // 06:00 bis 09:00 gilt, soll als "06:00-09:00" erscheinen und nicht als vier
 // Einzelangaben; unterbrochene Zeitraeume werden mit "und" verbunden.
 // Zeitangabe bewusst weich: Prognosen sind auf die Stunde genau nicht belastbar,
 // und die eigene Gehzeit erst recht nicht. Deshalb "ab ca." statt einer harten
 // Klammer. Ein Ende wird nur genannt, wenn die Lage sich waehrend der Tour
 // deutlich bessert - sonst suggeriert es eine Sicherheit, die es nicht gibt.
 const BESSERUNG_MIN_H = 2;   // so lange muss es danach ruhig bleiben

 function formatiereZeitraum(zeitstempel, tourEndeTs) {
     const eindeutig = [...new Set(zeitstempel)].sort();   // ISO sortiert chronologisch
     if (!eindeutig.length) return '';
     const ms = (v) => new Date(v).getTime();
     const hhmm = (v) => v.slice(11, 16);

     // Zusammenhaengende Bloecke bilden (Luecke groesser als eine Stunde trennt)
     const bloecke = [];
     let von = eindeutig[0], vorher = eindeutig[0];
     for (let i = 1; i < eindeutig.length; i++) {
         if (ms(eindeutig[i]) - ms(vorher) > 60 * 60 * 1000) {
             bloecke.push([von, vorher]);
             von = eindeutig[i];
         }
         vorher = eindeutig[i];
     }
     bloecke.push([von, vorher]);

     const start = hhmm(bloecke[0][0]);
     // Der Zeitstempel 08:00 steht fuer die Stunde 08:00-09:00. Die Besserung
     // beginnt also erst danach - sonst stand bei einer einzelnen betroffenen
     // Stunde "ab ca. 08:00 Uhr, Besserung ab ca. 08:00 Uhr".
     const letzterSlot = bloecke[bloecke.length - 1][1];
     const besserungAb = new Date(ms(letzterSlot) + 60 * 60 * 1000);
     const bhh = String(besserungAb.getHours()).padStart(2, '0') + ':'
               + String(besserungAb.getMinutes()).padStart(2, '0');
     const restStunden = tourEndeTs ? (ms(tourEndeTs) - ms(letzterSlot)) / 3600000 : 0;

     if (bloecke.length > 1) {
         // Unterbrochener Verlauf - ein Zeitfenster waere irrefuehrend.
         return `zeitweise ab ca. ${start} Uhr`;
     }
     if (restStunden >= BESSERUNG_MIN_H) {
         return `ab ca. ${start} Uhr, Besserung ab ca. ${bhh} Uhr`;
     }
     return `ab ca. ${start} Uhr`;
 }

 // Letzter ausgewerteter Zeitschritt = Ende des Tourfensters
 const tourEndeTs = slotZeiten.length ? slotZeiten[slotZeiten.length - 1] : null;
 let warnings = [...warnHours.entries()].map(([txt, stunden]) => {
     const fenster = formatiereZeitraum(stunden, tourEndeTs);
     if (!fenster) return txt;
     // Zeit auf eine eigene Zeile: Zwischen Bezeichnung und Beschreibung geklemmt
     // las sie sich wie ein Satzteil ("nasser Fels: ab ca. 06:00 Uhr Rutschig in ...").
     return `${txt}<br><span style="color:#64748b;font-size:12px;">⏱ ${fenster}</span>`;
 });

 let summaryText = overall==='red'?'Erhöhte alpine Gefahren (Gewitter, Nässe, Sturm).':(overall==='orange'?'Anspruchsvolle Bedingungen mit Wetterumschwüngen im Tourfenster.':'Stabile alpine Bedingungen.');
 // Wurde die Stufe wegen Modellstreuung angehoben, muss das im Fazit stehen und
 // nicht als Fußnote in einer anderen Box. Sonst wirkt die Ampel willkürlich:
 // dieselbe Wetterlage, einmal orange, einmal rot, ohne erkennbaren Grund.
 if (unsicherheitHinweis) {
     summaryText += ' Die Einstufung wurde angehoben, weil die Wettermodelle für diese Tour weit auseinanderliegen – der ungünstigere Verlauf ist möglich.';
 }

 const startLatVal = document.getElementById('start_lat').value || document.getElementById('lat').value || '';
 const startLonVal = document.getElementById('start_lon').value || document.getElementById('lon').value || '';
 const startTitleVal = document.getElementById('locationSearch').value || 'Start';
 const peakLatVal = peak && peak.lat ? peak.lat : '';
 const peakLonVal = peak && peak.lon ? peak.lon : '';
 const peakTitleVal = peak && peak.name ? peak.name : '';
 const gpxVal = document.getElementById('gpxUrlParam').value || '';

 let timeVal = document.getElementById('startTime').value;
 if (!timeVal) {
     const now = new Date();
     timeVal = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0,16);
 }
 const durVal = document.getElementById('duration').value || "6";

 let mapQueryParams = new URLSearchParams();
 if(startLatVal) mapQueryParams.set('startLat', startLatVal);
 if(startLonVal) mapQueryParams.set('startLng', startLonVal);
 if(startTitleVal) mapQueryParams.set('startTitle', startTitleVal);
 if(peakLatVal) mapQueryParams.set('peakLat', peakLatVal);
 if(peakLonVal) mapQueryParams.set('peakLng', peakLonVal);
 if(peakTitleVal) mapQueryParams.set('peakTitle', peakTitleVal);
 if(gpxVal) mapQueryParams.set('gpx', gpxVal);
 mapQueryParams.set('startTime', timeVal);
 mapQueryParams.set('duration', durVal);

 const mapAppUrl = 'map.html?' + mapQueryParams.toString();

 let html=`<div style="font-weight:700;color:var(--primary);margin-bottom:8px;font-size:16px">📍 ${(document.getElementById('locationSearch').value||'Startpunkt')+(peak?' → ⛰️ '+peak.name:'')}</div>`;
 html+=`<div class="tour-specs-header">📅 <strong>Datum:</strong> ${startDt.toLocaleDateString('de-DE')} | ⏱️ <strong>Start:</strong> ${startDt.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} (${duration} Std.)<br>🥾 <strong>Tour:</strong> ${tourName}</div>`;

 if (isHighTourOrGlacier && startHour >= 7) {
     html+=`<div class="warning-box" style="background:#eff6ff;border-color:#3b82f6;color:#1e3a8a;">⏰ <strong>Frühstart-Empfehlung:</strong> Bei Hochtouren und Gletschertouren wird ein Start zwischen <strong>03:00 und 06:00 Uhr</strong> dringend empfohlen!</div>`;
 }

 if(isAfterSunset && sunsetDt) {
     const sunsetTimeStr = sunsetDt.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
     html+=`<div class="warning-box" style="background:#fefce8;border-color:#fef08a;color:#854d0e;">🔦 <strong>Dunkelheitswarnung:</strong> Die Tour endet nach Sonnenuntergang (${sunsetTimeStr} Uhr). <strong>Stirnlampe mitnehmen!</strong></div>`;
 }

 html+=`<div class="risk-hero risk-${overall}"><div class="risk-icon">${overall==='red'?'🔴':overall==='orange'?'🟠':'🟢'}</div><div class="risk-title">GESAMTRISIKO: ${maxLevel.toUpperCase()}</div><div class="risk-summary"><strong>Alpin-Fazit:</strong> ${summaryText}</div></div>`;

 html+=`<a href="${mapAppUrl}" target="_blank" class="map-link-btn">🗺️ 3D-Wetter Simulation ↗</a>`;

 if (isWinterSeason) {
     html+=`<a href="https://lawinen.at/" target="_blank" class="link-button" style="background:#0284c7;margin-bottom:8px;"><span>🏔️ Lawinenwarndienst</span><span>Öffnen ↗</span></a>`;
 }

 html+=`<a href="https://www.windy.com/?rain,${lat},${lon},11" target="_blank" class="link-button" style="background:#0f766e;margin-bottom:12px;"><span>🌧️ Live Regenradar & Wind (Windy)</span><span>Öffnen ↗</span></a>`;
 // FIX: Die Box war fest auf "trend-good" gesetzt und damit auch bei 45 %
 // Übereinstimmung grün - direkt neben dem Text "Hohe Unsicherheit!".
 const confClass = (conf.pct !== null && conf.pct >= 80) ? 'trend-good' : 'trend-warn';
 // Beschriftung so, dass die Richtung ohne Nachdenken klar ist: Ein hoher Wert
 // ist gut. Der Farbcode dieser Box beschreibt die VERLÄSSLICHKEIT der Prognose,
 // nicht das Risiko der Tour - das steht in der Ampel darüber.
 const confKopf = conf.pct === null
     ? 'Prognose-Verlässlichkeit: nicht bewertbar'
     : `Prognose-Verlässlichkeit: ${conf.pct}% Modellübereinstimmung`;
 html+=`<div class="trend-box ${confClass}"><strong>${confKopf}</strong><br><span style="font-size:11px">${conf.text}</span>${conf.spread ? `<br><span style="font-size:11px;color:#475569;">${conf.spread}</span>` : ''}${unsicherheitHinweis ? `<br><span style="font-size:11px;color:#b45309;">${unsicherheitHinweis}</span>` : ''}</div>`;

 if(warnings.length) {
     html+=`<div class="warning-box">${warnings.join('<br><br>')}</div>`;
 }
 
 let summaryBox = `<div style="background:#f8fafc; border:1px solid #94a3b8; border-radius:12px; padding:12px; margin-bottom:15px; font-size:13px; line-height:1.5;">`;
 summaryBox += `<strong style="color:var(--primary); text-transform:uppercase; font-size:11px;">⚠️ Tour-Fokus (Heikelste Faktoren)</strong><br>`;

 if (maxThunderRisk) {
     summaryBox += `⚡ Ab ca. ${thunderTime.split(' ')[1]} Uhr erhöhtes <strong>Gewitterrisiko</strong>!<br>`;
 }
 if (maxGust >= 45) {
     summaryBox += `💨 <strong>Spitzenböen bis ${Math.round(maxGust)} km/h</strong> (um ca. ${gustTime.split(' ')[1]} Uhr).<br>`;
 }
 if (firstRainTime) {
     summaryBox += `🌧️ <strong>Niederschlag</strong> erwartet ab ca. ${firstRainTime.split(' ')[1]} Uhr.<br>`;
 } else if (!maxThunderRisk) {
     summaryBox += `✅ Niederschlag im Tourverlauf derzeit <strong>unwahrscheinlich</strong>.<br>`;
 }
 
 if(!maxThunderRisk && maxGust < 45 && !firstRainTime) {
     summaryBox += `✅ Wetterbedingungen im Zeitraum durchgehend <strong>stabil und ruhig</strong>.`;
 }
 summaryBox += `</div>`;
 html += summaryBox;

 html+=slots;
 html+=`<button type="button" class="share-btn" onclick="triggerShare()">🔗 Tour-Wetter teilen</button><button type="button" class="export-btn" onclick="window.print()">📄 Als PDF speichern</button>`;

 document.getElementById('results').innerHTML=html;
 document.getElementById('pushToggleBtn').style.display = 'block';
 document.getElementById('results').scrollIntoView({behavior:'smooth'});
 saveState();
 
} catch(e) { 
 // FIX: Dieser Block hat den echten Fehler bisher komplett verschluckt - die
 // Nutzeroberfläche zeigte immer denselben unspezifischen Text, egal ob es an
 // den Eingaben lag oder an einem Programmfehler (wie zuletzt dem fehlenden
 // "dew"). console.error macht die eigentliche Ursache in den Browser-
 // Entwicklertools sichtbar, ohne dass sich am Nutzertext etwas ändert.
 console.error('Fehler in analyzeRisk():', e);
 document.getElementById('results').innerHTML='<div class="warning-box">❌ Fehler beim Abrufen der Wetterdaten. Bitte Eingaben überprüfen.</div>'; 
}
}

async function triggerShare(){
const text='🏔️ Bergtouren Wetter-Check: '+(document.getElementById('locationSearch').value||'Tour');
if(navigator.share){try{await navigator.share({title:'Bergtouren Wetter',text});}catch(e){}}
else window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(text),'_blank');
}

window.addEventListener('DOMContentLoaded',()=>{
localStorage.removeItem('bt_favorites_v5');
setNowTime(); 
updatePushStatusUI();
document.getElementById('gpxStatus').innerText=''; 
clearPeak();

['startTime','duration'].forEach(id=>{
 const el = document.getElementById(id);
 if(el) el.addEventListener('input', scheduleLiveTourWeather);
});
});
</script>
</body>
</html>
