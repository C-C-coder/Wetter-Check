<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bergtouren Wetter Ampel</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.png">
<link rel="icon" href="logo.png" type="image/png">

<!-- Firebase SDKs (Compat Versionen) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>

<style>
:root { --primary: #1e293b; --accent: #10b981; --accent-hover: #059669; --bg: #f8fafc; --card-bg: #ffffff; --border: #e2e8f0; --text: #334155; --text-light: #64748b; }
body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; justify-content: center; }
.container { width: 100%; max-width: 520px; background: var(--card-bg); padding: 20px; border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05); }
.header { text-align: center; margin-bottom: 16px; }
.logo-img { width: 80px; height: 80px; object-fit: contain; margin-bottom: 8px; border-radius: 16px; }
h1 { font-size: 1.3rem; color: var(--primary); margin: 0 0 4px 0; }
.subtitle { font-size: 0.85rem; color: var(--text-light); margin: 0; }
.form-group { margin-bottom: 14px; }
label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: var(--primary); }
input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.9rem; box-sizing: border-box; background: #fff; color: var(--text); outline: none; transition: border-color 0.2s; }
input:focus, select:focus { border-color: var(--accent); }
.row { display: flex; gap: 10px; }
.row .form-group { flex: 1; }
.btn { width: 100%; background: var(--accent); color: white; border: none; padding: 12px; border-radius: 12px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 5px; }
.btn:hover { background: var(--accent-hover); }
.btn-push { background: #8b5cf6; margin-top: 8px; }
.btn-push:hover { background: #7c3aed; }
.results { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px; }
.card-section { background: #f8fafc; border: 1px solid var(--border); border-radius: 16px; padding: 15px; margin-bottom: 12px; }
.fav-bar { display: flex; gap: 6px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
.action-btn { background: #3b82f6; color: white; padding: 0 12px; font-size: 13px; white-space: nowrap; border: none; border-radius: 10px; cursor: pointer; }
.detected-location { font-size: 12px; color: #3b82f6; margin-top: 6px; font-weight: 600; }
.advanced-panel { display: none; margin-top: 10px; }
.advanced-panel.open { display: block; }
.advanced-toggle { width: 100%; background: #64748b; color: #fff; padding: 10px 12px; border-radius: 11px; font-size: 13px; margin-top: 10px; border: none; cursor: pointer; }
.peak-section { margin-top: 12px; }
.selected-peak { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; padding: 10px; border-radius: 10px; font-size: 12px; margin-top: 8px; }
.manual-peak { display: none; margin-top: 10px; }
.manual-peak.show { display: block; }
.small-note { font-size: 11px; color: var(--text-light); line-height: 1.4; }
.clear-small { background: #e2e8f0; color: #334155; padding: 8px 10px; font-size: 11px; border: none; border-radius: 8px; cursor: pointer; }
.tour-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
.tour-checkbox { display: flex; align-items: center; gap: 6px; font-size: 13px; background: #fff; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; }
.tour-checkbox input { width: auto; margin: 0; }
.gpx-box { background: #f0fdf4; border: 1px dashed #10b981; border-radius: 16px; padding: 12px; margin-bottom: 12px; text-align: center; }
.gpx-btn { background: #10b981; color: white; padding: 10px 14px; font-size: 13px; border-radius: 10px; cursor: pointer; display: inline-block; font-weight: 600; border: none; }
.slot { padding: 14px; margin-bottom: 12px; border-radius: 12px; font-size: 13px; }
.status-green { background: #ecfdf5; border-left: 5px solid #10b981; color: #065f46; }
.status-orange { background: #fff7ed; border-left: 5px solid #f59e0b; color: #9a3412; }
.status-red { background: #fef2f2; border-left: 5px solid #ef4444; color: #7f1d1d; }
.weather-split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; background: rgba(255,255,255,0.6); padding: 8px; border-radius: 8px; }
.weather-split.single-col { grid-template-columns: 1fr; }
.weather-box-title { font-weight: 700; font-size: 11px; text-transform: uppercase; margin-bottom: 4px; color: var(--primary); }
.risk-hero { border-radius: 18px; padding: 18px; margin-bottom: 14px; text-align: center; border: 1px solid var(--border); }
.risk-green { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
.risk-orange { background: #fff7ed; border-color: #fdba74; color: #9a3412; }
.risk-red { background: #fef2f2; border-color: #fecaca; color: #7f1d1d; }
.risk-icon { font-size: 34px; line-height: 1.1; }
.risk-title { font-size: 20px; font-weight: 800; margin: 5px 0; }
.risk-summary { font-size: 13px; margin-top: 8px; line-height: 1.4; text-align: left; background: rgba(255,255,255,0.6); padding: 10px; border-radius: 10px; }
.trend-box { margin: 12px 0; padding: 12px; border-radius: 12px; background: #f1f5f9; border: 1px solid var(--border); font-size: 13px; line-height: 1.45; }
.trend-good { border-color: #a7f3d0; background: #ecfdf5; color: #065f46; }
.trend-warn { border-color: #fdba74; background: #fff7ed; color: #9a3412; }
.trend-danger { border-color: #fecaca; background: #fef2f2; color: #7f1d1d; }
.link-button { display: flex; justify-content: space-between; align-items: center; background: #e2e8f0; color: var(--primary); text-decoration: none; padding: 10px 12px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; margin-top: 8px; }
.share-btn, .export-btn { background: var(--primary); color: #fff; margin-top: 8px; border: none; padding: 10px; border-radius: 10px; width: 100%; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
.footer-copyright { text-align: center; font-size: 11px; color: var(--text-light); margin-top: 25px; font-weight: 500; }
</style>
</head>
<body>
<div class="container">
 <div class="header">
   <img src="logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
   <h1>Bergtouren Wetter Ampel</h1>
   <p class="subtitle">Präzise Vorhersagen & Live-Nowcasting für deine Tour</p>
 </div>

 <div class="gpx-box">
   <label style="color:#065f46;margin-bottom:6px">🗺️ Tour aus GPX-Datei laden</label>
   <input type="file" id="gpxFileInput" accept=".gpx" style="display:none" onchange="handleGPXUpload(event)">
   <button type="button" class="gpx-btn" onclick="document.getElementById('gpxFileInput').click()">📂 GPX-Datei auswählen</button>
   <div id="gpxStatus" class="small-note" style="margin-top:6px;color:#047857"></div>
 </div>

 <div class="card-section">
   <label>📍 Startort</label>
   <div class="row" style="position:relative">
     <input type="text" id="locationSearch" placeholder="z.B. Waldegg, Ramsau, Puchberg" oninput="clearCoordsIfSearching()">
     <button type="button" onclick="clearSearchField()" style="position:absolute;right:155px;top:50%;transform:translateY(-50%);background:transparent;border:none;font-size:16px;color:#94a3b8;cursor:pointer">✖</button>
     <button type="button" class="action-btn" onclick="useCurrentGPS()" style="background:#10b981;" title="Aktuelle GPS Position verwenden">📍 GPS</button>
     <button type="button" class="action-btn" onclick="searchLocation()">Suchen</button>
   </div>

   <div class="fav-bar">
     <select id="favoritesDropdown" onchange="loadFavoriteFromDropdown()" style="font-size:12px;padding:8px;flex:1"><option value="">💾 Gespeicherte Touren laden...</option></select>
     <button type="button" class="action-btn" onclick="saveCurrentAsFavorite()" style="background:#10b981;font-size:12px;padding:8px 10px">+ Speichern</button>
     <button type="button" class="action-btn" onclick="deleteSelectedFavorite()" style="background:#ef4444;font-size:12px;padding:8px 10px">❌ Löschen</button>
   </div>

   <select id="locationResultsSelect" onchange="selectLocationFromDropdown()" style="display:none;margin-top:8px;"><option value="">-- Bitte Ort auswählen --</option></select>
   <div id="locationPreview" class="detected-location"></div>
   <button type="button" class="advanced-toggle" onclick="toggleAdvancedLocation()">⚙️ Erweiterte Standortangabe</button>
   <div id="advancedLocation" class="advanced-panel">
     <label>Koordinaten (Breite, Länge)</label>
     <div class="row">
       <input type="text" id="lat" placeholder="47.7800" oninput="clearSearchInput()">
       <input type="text" id="lon" placeholder="15.8900" oninput="clearSearchInput()">
     </div>
   </div>
 </div>

 <div class="card-section peak-section">
   <label>⛰️ Gipfel / Ziel (optional)</label>
   <button type="button" id="peakSearchBtn" class="action-btn" onclick="searchMountainsAroundStart()" style="width:100%;padding:10px;margin-bottom:8px;background:#059669;">⛰️ Gipfel im Umkreis suchen</button>
   <div id="peakSelected" class="selected-peak" style="display:none"></div>
   <div id="peakSearchHint" class="small-note">Startort wählen und Suche starten.</div>
   <select id="peakDropdown" onchange="selectPeakFromDropdown()" style="margin-top:8px;display:none"><option value="">-- Gipfel auswählen --</option></select>
   <div id="peakLoading" class="small-note" style="display:none;color:#059669;margin-top:6px;">⛰️ Suche Gipfel in der Umgebung …</div>
   <button type="button" id="manualPeakButton" class="clear-small" onclick="showManualPeak()" style="width:100%;margin-top:8px">Mein Berg ist nicht dabei → manuelle Eingabe</button>
   <div id="manualPeak" class="manual-peak">
     <label>Gipfelname</label>
     <input id="manualPeakName" placeholder="z.B. Hohe Wand">
     <div class="row" style="margin-top:8px">
       <div style="flex:1"><label>Höhe (m)</label><input type="number" id="peakAltInput" placeholder="z.B. 1132"></div>
       <div style="flex:1"><label>Breite</label><input type="text" id="peakLatInput" placeholder="47.82"></div>
     </div>
     <label style="margin-top:8px">Länge</label>
     <input type="text" id="peakLonInput" placeholder="16.03">
     <button type="button" class="action-btn" onclick="saveManualPeakFavorite()" style="background:#10b981;margin-top:8px;width:100%;">⭐ Gipfel als Favorit speichern</button>
   </div>
 </div>

 <div class="card-section">
   <label>🥾 Tourart (Mehrfachauswahl möglich)</label>
   <div class="tour-grid">
     <label class="tour-checkbox"><input type="checkbox" name="tourType" value="hiking" onchange="saveState()"> Wanderung</label>
     <label class="tour-checkbox"><input type="checkbox" name="tourType" value="klettersteig" onchange="saveState()"> Klettersteig</label>
     <label class="tour-checkbox"><input type="checkbox" name="tourType" value="hochtour" onchange="saveState()"> Hochtour</label>
     <label class="tour-checkbox"><input type="checkbox" name="tourType" value="grat" onchange="saveState()"> Gratwanderung</label>
     <label class="tour-checkbox"><input type="checkbox" name="tourType" value="gletscher" onchange="saveState()"> Gletschertour</label>
     <label class="tour-checkbox"><input type="checkbox" name="tourType" value="klettern" onchange="saveState()"> Felskletterei</label>
     <label class="tour-checkbox"><input type="checkbox" name="tourType" value="ski" onchange="saveState()"> Schitour</label>
   </div>
 </div>

 <div class="card-section">
   <div class="form-group" style="margin-bottom:12px">
     <label style="display:flex;justify-content:space-between;align-items:center">
       <span>⏱️ Geplante Startzeit:</span>
       <button type="button" onclick="setNowTime()" style="background:#e2e8f0;color:var(--text);border:none;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;">🕒 Jetzt</button>
     </label>
     <input type="datetime-local" id="startTime" onchange="saveState()">
   </div>
   <div class="form-group">
     <label>🥾 Geplante Tourendauer:</label>
     <select id="duration" onchange="saveState()">
       <option value="4">4 Stunden (Halbtag)</option>
       <option value="6" selected>6 Stunden (Normal)</option>
       <option value="8">8 Stunden (Tagestour)</option>
       <option value="10">10 Stunden (Lange Tour)</option>
       <option value="12">12 Stunden (Sehr lange Tour)</option>
     </select>
   </div>
 </div>

 <button class="btn" onclick="analyzeRisk()">Wetter abfragen</button>
 <button type="button" class="btn btn-push" onclick="requestPushPermission()">🔔 Push-Benachrichtigungen aktivieren</button>

 <div id="results" class="results"></div>
 <div class="footer-copyright">© 2026 Christian Camus. Alle Rechte vorbehalten.</div>
</div>

<script>
 // Firebase Initialisierung & Push Konfiguration
 const firebaseConfig = {
   apiKey: "AIzaSyADlL7BKaVPgdCH6xSqWEjVqf54q33E9WE",
   authDomain: "wetter-check.firebaseapp.com",
   projectId: "wetter-check",
   storageBucket: "wetter-check.firebasestorage.app",
   messagingSenderId: "184488061652",
   appId: "1:184488061652:web:dda3d879ff8cfd36d6e941"
 };

 firebase.initializeApp(firebaseConfig);
 const messaging = firebase.messaging();

 async function requestPushPermission() {
   try {
     const permission = await Notification.requestPermission();
     if (permission === 'granted') {
       const vapidKey = "BM1lhomK1in9e4w6Th_On3H8PLxO2nwXeAjSci1y8Y8QIeAG23ntriAqCc2Qx0r4Pu_tITTSGFkA5xsu_KI2Qs4";
       const currentToken = await messaging.getToken({ vapidKey: vapidKey });
       if (currentToken) {
         localStorage.setItem('fcm_token', currentToken);
         alert('Push-Benachrichtigungen für Wetterwarnungen erfolgreich aktiviert!');
       } else {
         console.warn('Kein Registrierungstoken verfügbar.');
       }
     } else {
       alert('Push-Benachrichtigungen wurden abgelehnt.');
     }
   } catch (error) {
     console.error('Fehler beim Abrufen des Push-Tokens:', error);
   }
 }

 let foundLocations=[], peakCandidates=[], selectedPeak=null; 
 let savedFavorites=JSON.parse(localStorage.getItem('bt_favorites_v5')||'[]');
 const TOUR_NAMES={hiking:'Wanderung',klettersteig:'Klettersteig',hochtour:'Hochtour',grat:'Gratwanderung',gletscher:'Gletschertour',klettern:'Felskletterei',ski:'Schitour'};

 function getSelectedTourTypes() {
   return Array.from(document.querySelectorAll('input[name="tourType"]:checked')).map(cb => cb.value);
 }

 function setSelectedTourTypes(typesArray) {
   document.querySelectorAll('input[name="tourType"]').forEach(cb => {
     cb.checked = typesArray.includes(cb.value);
   });
 }

 function getDistance(a,b,c,d){const R=6371,dl=(c-a)*Math.PI/180,dn=(d-b)*Math.PI/180,x=Math.sin(dl/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dn/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
 function toggleAdvancedLocation(){document.getElementById('advancedLocation').classList.toggle('open');}
 function setNowTime(){
   const n=new Date();
   document.getElementById('startTime').value=new Date(n.getTime()-n.getTimezoneOffset()*60000).toISOString().slice(0,16);
   saveState();
 }

 function saveState(){
   ['locationSearch','lat','lon','startTime','duration'].forEach(id=>{
     const el = document.getElementById(id);
     if(el) localStorage.setItem('bt5_'+id, el.value);
   });
   localStorage.setItem('bt5_tourTypes', JSON.stringify(getSelectedTourTypes()));
   if(selectedPeak) localStorage.setItem('bt5_peak',JSON.stringify(selectedPeak));
 }

 function clearSearchField(){document.getElementById('locationSearch').value='';document.getElementById('locationResultsSelect').style.display='none';document.getElementById('locationPreview').innerText='';document.getElementById('lat').value='';document.getElementById('lon').value='';clearPeak();saveState();}
 function clearSearchInput(){document.getElementById('locationSearch').value='';document.getElementById('locationResultsSelect').style.display='none';saveState();}
 function clearCoordsIfSearching(){document.getElementById('lat').value='';document.getElementById('lon').value='';document.getElementById('locationPreview').innerText='';clearPeak();saveState();}
 function clearPeak(){selectedPeak=null;document.getElementById('peakDropdown').style.display='none';document.getElementById('peakDropdown').innerHTML='<option value="">-- Gipfel auswählen --</option>';document.getElementById('peakSelected').style.display='none';document.getElementById('manualPeak').classList.remove('show');document.getElementById('manualPeakName').value='';document.getElementById('peakAltInput').value='';document.getElementById('peakLatInput').value='';document.getElementById('peakLonInput').value='';}

 function handleGPXUpload(event) {
   const file = event.target.files[0];
   if (!file) return;
   const status = document.getElementById('gpxStatus');
   status.innerText = 'Lese GPX-Datei ...';
   const reader = new FileReader();
   reader.onload = async function(e) {
     try {
       const xmlDoc = new DOMParser().parseFromString(e.target.result, "text/xml");
       const trackpoints = xmlDoc.querySelectorAll("trkpt, wpt");
       if (trackpoints.length === 0) { status.innerText = '❌ Keine Wegpunkte gefunden.'; return; }
       const startLat = parseFloat(trackpoints[0].getAttribute("lat"));
       const startLon = parseFloat(trackpoints[0].getAttribute("lon"));
       document.getElementById('lat').value = startLat.toFixed(5);
       document.getElementById('lon').value = startLon.toFixed(5);
       status.innerText = '✅ GPX-Daten übernommen!';
       saveState();
     } catch (err) { status.innerText = '❌ Fehler beim Lesen.'; }
   };
   reader.readAsText(file);
 }

 function updateFavoritesDropdown(){
   const d=document.getElementById('favoritesDropdown');
   d.innerHTML='<option value="">💾 Gespeicherte Touren laden...</option>';
   savedFavorites.forEach((f,i)=>{
     const o=document.createElement('option');
     o.value=i;
     o.text = f.tourTitle || (f.startName || 'Tour ' + (i+1));
     d.appendChild(o);
   });
 }

 function saveCurrentAsFavorite(){
   const s=document.getElementById('locationSearch').value.trim(),lat=document.getElementById('lat').value.trim(),lon=document.getElementById('lon').value.trim();
   if(!lat||!lon){alert('Bitte zuerst Startort wählen.');return;}
   const tourTitle=prompt('Name für diese Tour:', s || 'Bergtour');
   if(!tourTitle) return;
   savedFavorites.push({tourTitle, startName:s, lat, lon, tourTypes:getSelectedTourTypes(), duration:document.getElementById('duration').value});
   localStorage.setItem('bt_favorites_v5',JSON.stringify(savedFavorites));
   updateFavoritesDropdown();
   alert('Tour gespeichert!');
 }

 function loadFavoriteFromDropdown(){
   const i=Number(document.getElementById('favoritesDropdown').value);
   const f=savedFavorites[i];
   if(!f)return;
   document.getElementById('locationSearch').value=f.startName||'';
   document.getElementById('lat').value=f.lat||'';
   document.getElementById('lon').value=f.lon||'';
   if(f.tourTypes) setSelectedTourTypes(f.tourTypes);
   if(f.duration) document.getElementById('duration').value = f.duration;
   document.getElementById('favoritesDropdown').value='';
   saveState();
 }

 function deleteSelectedFavorite(){
   const d=document.getElementById('favoritesDropdown'),i=Number(d.value);
   if(!Number.isInteger(i)||!savedFavorites[i]){alert('Bitte Tour aus Liste wählen.');return;}
   if(confirm('Tour löschen?')){
     savedFavorites.splice(i,1);
     localStorage.setItem('bt_favorites_v5',JSON.stringify(savedFavorites));
     updateFavoritesDropdown();
   }
   d.value='';
 }

 function useCurrentGPS(){
   if(!navigator.geolocation){alert('GPS nicht unterstützt.');return;}
   navigator.geolocation.getCurrentPosition(async (pos)=>{
     const lat=pos.coords.latitude, lon=pos.coords.longitude;
     document.getElementById('lat').value=lat.toFixed(5);
     document.getElementById('lon').value=lon.toFixed(5);
     document.getElementById('locationSearch').value='Aktueller Standort';
     saveState();
   },(err)=>{alert('GPS-Fehler: '+err.message);});
 }

 async function searchLocation(){
   const q=document.getElementById('locationSearch').value.trim();
   if(!q){alert('Ort eingeben.');return;}
   try {
     const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=1&language=de&format=json');
     const d=await r.json();
     if(d.results?.[0]){
       const p=d.results[0];
       document.getElementById('lat').value=p.latitude.toFixed(5);
       document.getElementById('lon').value=p.longitude.toFixed(5);
       saveState();
     } else { alert('Ort nicht gefunden.'); }
   } catch(e) { alert('Fehler bei Ortssuche.'); }
 }

 function getPeakData(){ return selectedPeak; }
 function selectPeakFromDropdown(){}
 function searchMountainsAroundStart(){}
 function showManualPeak(){}
 function saveManualPeakFavorite(){}

 async function analyzeRisk(){
   const lat=Number(document.getElementById('lat').value),lon=Number(document.getElementById('lon').value),startStr=document.getElementById('startTime').value,duration=Number(document.getElementById('duration').value);
   if(!Number.isFinite(lat)||!Number.isFinite(lon)||!startStr){alert('Bitte Startort und Startzeit angeben.');return;}
   document.getElementById('results').innerHTML='<div style="text-align:center;padding:15px;color:#64748b;">🌦️ Lade Wetterdaten...</div>';
   try {
     const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,precipitation,wind_speed_10m&timezone=auto`);
     const d=await r.json();
     document.getElementById('results').innerHTML=`<div class="slot status-green"><h3>📍 Wetter-Check erfolgreich</h3><p>Temperatur: ${d.current.temperature_2m} °C</p><p>Regen: ${d.current.precipitation} mm</p><p>Wind: ${d.current.wind_speed_10m} km/h</p></div>`;
   } catch(e){
     document.getElementById('results').innerHTML='<div class="warning-box">❌ Fehler beim Laden der Wetterdaten.</div>';
   }
 }

 window.addEventListener('DOMContentLoaded',()=>{
   updateFavoritesDropdown();
   const n=localStorage.getItem('bt5_startTime');
   document.getElementById('startTime').value=n||'';
   if(!n)setNowTime();
   ['locationSearch','lat','lon','duration'].forEach(id=>{
     const v=localStorage.getItem('bt5_'+id);
     if(v!==null)document.getElementById(id).value=v;
   });
 });
</script>
</body>
</html>
