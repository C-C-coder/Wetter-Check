<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bergtouren Wetter Ampel</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.png">
<link rel="icon" href="logo.png" type="image/png">

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<!-- Leaflet CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

<style>
 :root { 
     --primary: #1e293b; 
     --accent: #10b981; 
     --accent-hover: #059669; 
     --bg: #f8fafc; 
     --card-bg: #ffffff; 
     --border: #e2e8f0; 
     --text: #334155; 
     --text-light: #64748b; 
 }
 
 body { 
     font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
     background: var(--bg); 
     color: var(--text); 
     margin: 0; 
     padding: 15px; 
     display: flex; 
     justify-content: center; 
 }
 
 .container { 
     width: 100%; 
     max-width: 520px; 
     background: var(--card-bg); 
     padding: 20px; 
     border-radius: 24px; 
     box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05); 
 }
 
 .header { 
     text-align: center; 
     margin-bottom: 16px; 
 }
 
 .logo-img { 
     width: 80px; 
     height: 80px; 
     object-fit: contain; 
     margin-bottom: 8px; 
     border-radius: 16px; 
 }
 
 h1 { 
     font-size: 1.3rem; 
     color: var(--primary); 
     margin: 0 0 4px 0; 
 }
 
 .subtitle { 
     font-size: 0.85rem; 
     color: var(--text-light); 
     margin: 0; 
 }
 
 .form-group { 
     margin-bottom: 14px; 
 }
 
 label { 
     display: block; 
     font-size: 0.85rem; 
     font-weight: 600; 
     margin-bottom: 5px; 
     color: var(--primary); 
 }
 
 input, select { 
     width: 100%; 
     padding: 10px 12px; 
     border: 1px solid var(--border); 
     border-radius: 10px; 
     font-size: 0.9rem; 
     box-sizing: border-box; 
     background: #fff; 
     color: var(--text); 
     outline: none; 
     transition: border-color 0.2s; 
 }
 
 input:focus, select:focus { 
     border-color: var(--accent); 
 }
 
 .row { 
     display: flex; 
     gap: 6px; 
 }
 
 .row .form-group { 
     flex: 1; 
 }
 
 .btn { 
     width: 100%; 
     background: var(--accent); 
     color: white; 
     border: none; 
     padding: 12px; 
     border-radius: 12px; 
     font-size: 0.95rem; 
     font-weight: 600; 
     cursor: pointer; 
     transition: background 0.2s; 
     margin-top: 5px; 
 }
 
 .btn:hover { 
     background: var(--accent-hover); 
 }
 
 .btn-push { 
     background: #8b5cf6; 
     margin-top: 8px; 
     display: none; 
 } 
 
 .btn-push:hover { 
     background: #7c3aed; 
 }
 
 .btn-push.active { 
     background: #ef4444; 
 } 
 
 .btn-push.active:hover { 
     background: #dc2626; 
 }
 
 .results { 
     margin-top: 20px; 
     border-top: 1px solid var(--border); 
     padding-top: 15px; 
 }
 
 .warning-box { 
     background: #fff7ed; 
     border-left: 4px solid #f97316; 
     padding: 10px; 
     border-radius: 8px; 
     font-size: 0.85rem; 
     margin-top: 10px; 
     color: #9a3412; 
 }
 
 .share-btn, .export-btn, .map-link-btn { 
     background: var(--primary); 
     color: #fff; 
     margin-top: 8px; 
     border: none; 
     padding: 10px; 
     border-radius: 10px; 
     width: 100%; 
     cursor: pointer; 
     font-weight: 600; 
     font-size: 0.85rem; 
     text-align: center;
     text-decoration: none;
     display: block;
     box-sizing: border-box;
 }
 
 .map-link-btn {
     background: #0284c7;
 }
 .map-link-btn:hover {
     background: #0369a1;
 }

 .link-button { 
     display: flex; 
     justify-content: space-between; 
     align-items: center; 
     background: #e2e8f0; 
     color: var(--primary); 
     text-decoration: none; 
     padding: 10px 12px; 
     border-radius: 10px; 
     font-size: 0.85rem; 
     font-weight: 600; 
     margin-top: 8px; 
 }
 
 .card-section { 
     background: #f8fafc; 
     border: 1px solid var(--border); 
     border-radius: 16px; 
     padding: 15px; 
     margin-bottom: 12px; 
 }
 
 .fav-bar { 
     display: flex; 
     gap: 6px; 
     margin-top: 10px; 
     align-items: center; 
     flex-wrap: wrap; 
 }
 
 .action-btn { 
     background: #3b82f6; 
     color: white; 
     padding: 0 10px; 
     font-size: 13px; 
     white-space: nowrap; 
     border: none; 
     border-radius: 10px; 
     cursor: pointer; 
 }
 
 .detected-location { 
     font-size: 12px; 
     color: #3b82f6; 
     margin-top: 6px; 
     font-weight: 600; 
 }
 
 .advanced-panel { 
     display: none; 
     margin-top: 10px; 
 }
 
 .advanced-toggle { 
     width: 100%; 
     background: #64748b; 
     color: #fff; 
     padding: 10px 12px; 
     border-radius: 11px; 
     font-size: 13px; 
     margin-top: 10px; 
     border: none; 
     cursor: pointer; 
 }
 
 .peak-section { 
     margin-top: 12px; 
 }
 
 .selected-peak { 
     background: #ecfdf5; 
     border: 1px solid #a7f3d0; 
     color: #065f46; 
     padding: 10px; 
     border-radius: 10px; 
     font-size: 12px; 
     margin-top: 8px; 
 }
 
 .small-note { 
     font-size: 11px; 
     color: var(--text-light); 
     line-height: 1.4; 
 }
 
 .clear-small { 
     background: #e2e8f0; 
     color: #334155; 
     padding: 8px 10px; 
     font-size: 11px; 
     border: none; 
     border-radius: 8px; 
     cursor: pointer; 
 }
 
 .tour-grid { 
     display: grid; 
     grid-template-columns: 1fr 1fr; 
     gap: 8px; 
     margin-top: 6px; 
 }
 
 .tour-checkbox { 
     display: flex; 
     align-items: center; 
     gap: 6px; 
     font-size: 13px; 
     background: #fff; 
     padding: 8px 10px; 
     border-radius: 8px; 
     border: 1px solid var(--border); 
     cursor: pointer; 
 }
 
 .tour-checkbox input { 
     width: auto; 
     margin: 0; 
 }
 
 .gpx-box { 
     background: #f0fdf4; 
     border: 1px dashed #10b981; 
     border-radius: 16px; 
     padding: 12px; 
     margin-bottom: 12px; 
     text-align: center; 
 }
 
 .gpx-btn { 
     background: #10b981; 
     color: white; 
     padding: 10px 14px; 
     font-size: 13px; 
     border-radius: 10px; 
     cursor: pointer; 
     display: inline-block; 
     font-weight: 600; 
     border: none; 
 }
 
 .slot { 
     padding: 14px; 
     margin-bottom: 12px; 
     border-radius: 12px; 
     font-size: 13px; 
 }
 
 .status-green { 
     background: #ecfdf5; 
     border-left: 5px solid #10b981; 
     color: #065f46; 
 }
 
 .status-orange { 
     background: #fff7ed; 
     border-left: 5px solid #f59e0b; 
     color: #9a3412; 
 }
 
 .status-red { 
     background: #fef2f2; 
     border-left: 5px solid #ef4444; 
     color: #7f1d1d; 
 }
 
 .weather-split { 
     display: grid; 
     grid-template-columns: 1fr 1fr; 
     gap: 8px; 
     margin: 8px 0; 
     background: rgba(255,255,255,0.6); 
     padding: 8px; 
     border-radius: 8px; 
 }
 
 .weather-split.single-col { 
     grid-template-columns: 1fr; 
 }
 
 .weather-box-title { 
     font-weight: 700; 
     font-size: 11px; 
     text-transform: uppercase; 
     margin-bottom: 4px; 
     color: var(--primary); 
 }
 
 .risk-hero { 
     border-radius: 18px; 
     padding: 18px; 
     margin-bottom: 14px; 
     text-align: center; 
     border: 1px solid var(--border); 
 }
 
 .risk-green { 
     background: #ecfdf5; 
     border-color: #a7f3d0; 
     color: #065f46; 
 }
 
 .risk-orange { 
     background: #fff7ed; 
     border-color: #fdba74; 
     color: #9a3412; 
 }
 
 .risk-red { 
     background: #fef2f2; 
     border-color: #fecaca; 
     color: #7f1d1d; 
 }
 
 .risk-icon { 
     font-size: 34px; 
     line-height: 1.1; 
 }
 
 .risk-title { 
     font-size: 20px; 
     font-weight: 800; 
     margin: 5px 0; 
 }
 
 .risk-summary { 
     font-size: 13px; 
     margin-top: 8px; 
     line-height: 1.4; 
     text-align: left; 
     background: rgba(255,255,255,0.6); 
     padding: 10px; 
     border-radius: 10px; 
 }
 
 .trend-box { 
     margin: 12px 0; 
     padding: 12px; 
     border-radius: 12px; 
     background: #f1f5f9; 
     border: 1px solid var(--border); 
     font-size: 13px; 
     line-height: 1.45; 
 }
 
 .trend-good { 
     border-color: #a7f3d0; 
     background: #ecfdf5; 
     color: #065f46; 
 }
 
 .trend-warn { 
     border-color: #fdba74; 
     background: #fff7ed; 
     color: #9a3412; 
 }
 
 .trend-danger { 
     border-color: #fecaca; 
     background: #fef2f2; 
     color: #7f1d1d; 
 }
 
 .live-tour-box { 
     background: #eff6ff; 
     border: 1px solid #bfdbfe; 
     color: #1e3a8a; 
     padding: 14px; 
     border-radius: 14px; 
     margin-bottom: 12px; 
     font-size: 13px; 
     line-height: 1.45; 
 }
 
 .live-tour-box.live-alert { 
     background: #fff7ed; 
     border-color: #fdba74; 
     color: #9a3412; 
 }
 
 .live-tour-box.live-danger { 
     background: #fef2f2; 
     border-color: #fecaca; 
     color: #7f1d1d; 
 }
 
 .live-tour-head { 
     display: flex; 
     justify-content: space-between; 
     align-items: center; 
     gap: 8px; 
     margin-bottom: 7px; 
 }
 
 .live-dot { 
     display: inline-block; 
     width: 8px; 
     height: 8px; 
     border-radius: 50%; 
     background: #10b981; 
     margin-right: 6px; 
     box-shadow: 0 0 0 3px rgba(16,185,129,.15); 
 }
 
 .live-muted { 
     font-size: 11px; 
     color: #64748b; 
 }
 
 .live-row { 
     display: flex; 
     justify-content: space-between; 
     gap: 8px; 
     margin-top: 5px; 
 }

 #mapModal, #startMapModal, #peakMapModal { 
     display: none; 
     position: fixed; 
     z-index: 1000; 
     left: 0; 
     top: 0; 
     width: 100%; 
     height: 100%; 
     background-color: rgba(0,0,0,0.5); 
     align-items: center; 
     justify-content: center; 
 }
 
 #mapContainerWrapper, #startMapContainerWrapper, #peakMapContainerWrapper { 
     background: #fff; 
     width: 90%; 
     max-width: 500px; 
     height: 450px; 
     border-radius: 16px; 
     display: flex; 
     flex-direction: column; 
     overflow: hidden; 
     box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
 }
 
 #mapElement, #startMapElement, #peakMapElement { 
     flex: 1; 
     width: 100%; 
 }
 
 .map-modal-header { 
     padding: 12px 16px; 
     background: var(--primary); 
     color: white; 
     display: flex; 
     justify-content: space-between; 
     align-items: center; 
     font-weight: 600; 
     font-size: 0.9rem; 
 }
 
 .map-modal-footer { 
     padding: 10px; 
     background: #f8fafc; 
     display: flex; 
     justify-content: flex-end; 
     gap: 8px; 
     border-top: 1px solid var(--border); 
 }
</style>
</head>
<body>
<div class="container">
<div class="header">
 <img src="logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
 <h1>Bergtouren Wetter Ampel</h1>
 <p class="subtitle">Präzise Vorhersagen & Alpine Risiko-Engine</p>
</div>

<!-- GPX Import Section -->
<div class="gpx-box">
 <label style="color:#065f46;margin-bottom:6px">🗺️ Tour aus GPX-Datei laden</label>
 <input type="file" id="gpxFileInput" accept=".gpx" style="display:none" onchange="handleGPXUpload(event)">
 <button type="button" class="gpx-btn" onclick="document.getElementById('gpxFileInput').click()">📂 GPX-Datei auswählen</button>
 <div id="gpxStatus" class="small-note" style="margin-top:6px;color:#047857"></div>
</div>

<div class="card-section">
 <label>📍 Start / Talort</label>
 <div class="row" style="position:relative">
     <input type="text" id="locationSearch" placeholder="z.B. Waldegg, Ramsau, Puchberg" oninput="clearCoordsIfSearching()">
     <button type="button" onclick="clearSearchField()" style="position:absolute;right:175px;top:50%;transform:translateY(-50%);background:transparent;border:none;font-size:16px;color:#94a3b8;cursor:pointer">✖</button>
     <button type="button" class="action-btn" onclick="useCurrentGPS()" style="background:#0284c7;" id="gpsBtn">📍 GPS</button>
     <button type="button" class="action-btn" onclick="searchLocation()">Suchen</button>
 </div>

 <!-- Touren speichern & laden -->
 <div class="fav-bar">
     <select id="favoritesDropdown" onchange="loadFavoriteFromDropdown()" style="font-size:12px;padding:8px;flex:1"><option value="">💾 Cloud-Touren laden...</option></select>
     <button type="button" class="action-btn" onclick="saveCurrentAsFavorite()" style="background:#10b981;font-size:12px;padding:8px 10px">+ Speichern</button>
     <button type="button" class="action-btn" onclick="deleteSelectedFavorite()" style="background:#ef4444;font-size:12px;padding:8px 10px">❌ Löschen</button>
 </div>

 <select id="locationResultsSelect" onchange="selectLocationFromDropdown()" style="display:none;margin-top:8px;"><option value="">-- Bitte Ort auswählen --</option></select>
 <div id="locationPreview" class="detected-location"></div>

 <button type="button" class="advanced-toggle" onclick="openStartMapModal()">🗺️ auf Karte auswählen</button>

 <div id="advancedLocation" class="advanced-panel" style="display:none;">
     <input type="hidden" id="lat">
     <input type="hidden" id="lon">
     <input type="hidden" id="start_lat">
     <input type="hidden" id="start_lon">
     <input type="hidden" id="gpxUrlParam" value="">
 </div>
</div>

<!-- Startpunkt Karten-Modal -->
<div id="startMapModal">
 <div id="startMapContainerWrapper">
     <div class="map-modal-header">
         <span>Startpunkt auf Karte auswählen</span>
         <button type="button" onclick="closeStartMapModal()" style="background:transparent;border:none;color:white;font-size:16px;cursor:pointer;">✖</button>
     </div>
     <div id="startMapElement"></div>
     <div class="map-modal-footer">
         <button type="button" class="clear-small" onclick="closeStartMapModal()">Abbrechen</button>
         <button type="button" class="action-btn" onclick="confirmStartMapSelection()" style="background:#10b981;">Punkt übernehmen</button>
     </div>
 </div>
</div>

<!-- Gipfel Karten-Modal -->
<div id="peakMapModal">
 <div id="peakMapContainerWrapper">
     <div class="map-modal-header">
         <span>Gipfel auf Karte auswählen</span>
         <button type="button" onclick="closePeakMapModal()" style="background:transparent;border:none;color:white;font-size:16px;cursor:pointer;">✖</button>
     </div>
     <div id="peakMapElement"></div>
     <div class="map-modal-footer" style="display:flex;justify-content:space-between;align-items:center;">
         <span id="peakMapHint" style="font-size:11px;color:var(--text-light);">Klicke auf einen Gipfel oder eine freie Stelle.</span>
         <div>
             <button type="button" class="clear-small" onclick="closePeakMapModal()">Abbrechen</button>
         </div>
     </div>
 </div>
</div>

<div class="card-section peak-section">
 <label>⛰️ Gipfel / Ziel (optional)</label>
 <div id="peakSelected" class="selected-peak" style="display:none"></div>
 <div id="peakSearchHint" class="small-note">Startort wählen oder Karte öffnen.</div>
 <select id="peakDropdown" onchange="selectPeakFromDropdown()" style="margin-top:8px;display:none"><option value="">-- Gipfel auswählen --</option></select>
 <div id="peakLoading" class="small-note" style="display:none;color:#059669;margin-top:6px;">⛰️ Suche Gipfel in der Umgebung …</div>
 <div class="row" style="margin-top:8px;">
     <button type="button" id="peakSearchBtn" class="action-btn" onclick="searchMountainsAroundStart()" style="display:none;"></button>
     <button type="button" id="peakMapBtn" class="action-btn" onclick="openPeakMapModal()" style="width:100%;padding:10px;background:#0284c7;">🗺️ Gipfel auf Karte auswählen</button>
 </div>
</div>

<div class="card-section">
 <label>🥾 Tourart (Mehrfachauswahl möglich)</label>
 <div class="tour-grid">
     <label class="tour-checkbox"><input type="checkbox" name="tourType" value="hiking" onchange="saveState()"> Wanderung</label>
     <label class="tour-checkbox"><input type="checkbox" name="tourType" value="klettersteig" onchange="saveState()"> Klettersteig</label>
     <label class="tour-checkbox"><input type="checkbox" name="tourType" value="hochtour" onchange="saveState()"> Hochtour</label>
     <label class="tour-checkbox"><input type="checkbox" name="tourType" value="grat" onchange="saveState()"> Gratwanderung</label>
     <label class="tour-checkbox"><input type="checkbox" name="tourType" value="gletscher" onchange="saveState()"> Gletschertour</label>
     <label class="tour-checkbox"><input type="checkbox" name="tourType" value="klettern" onchange="saveState()"> Felskletterei</label>
     <label class="tour-checkbox"><input type="checkbox" name="tourType" value="ski" onchange="saveState()"> Schitour</label>
 </div>
</div>

<div class="card-section">
 <div class="form-group" style="margin-bottom:12px">
     <label style="display:flex;justify-content:space-between;align-items:center">
         <span>⏱️ Geplante Startzeit:</span>
         <button type="button" onclick="setNowTime()" style="background:#e2e8f0;color:var(--text);border:none;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;">🕒 Jetzt</button>
     </label>
     <input type="datetime-local" id="startTime" onchange="saveState()">
 </div>
 <div class="form-group">
     <label>🥾 Geplante Tourendauer:</label>
     <select id="duration" onchange="saveState()">
         <option value="4">4 Stunden (Halbtag)</option>
         <option value="6" selected>6 Stunden (Normal)</option>
         <option value="8">8 Stunden (Tagestour)</option>
         <option value="10">10 Stunden (Lange Tour)</option>
         <option value="12">12 Stunden (Sehr lange Tour)</option>
     </select>
 </div>
</div>

<button class="btn" onclick="analyzeRisk()">Wetter abfragen</button>
<!-- Der Knopf "Live-Standort aktualisieren" ist entfallen. Die Warnungen
     beziehen sich auf Routenabschnitte von mehreren Kilometern Laenge; eine auf
     30 m genaue Position bringt bei 1 km Rasterweite keinen Erkenntnisgewinn. -->
<button type="button" id="pushToggleBtn" class="btn btn-push" onclick="toggleTourPush()">Push Benachrichtigungen für die Tour aktivieren</button>

<div id="pushStatusInfo" class="small-note" style="margin-top:8px;padding:10px;background:#f1f5f9;border-radius:10px;border:1px solid var(--border);display:none;"></div>

<div id="results" class="results"></div>
<div class="footer-copyright" style="text-align:center;font-size:11px;color:var(--text-light);margin-top:20px">© 2026 Christian Camus. Alle Rechte vorbehalten.</div>
</div>

<script>
// --- Firebase Initialisierung ---
const firebaseConfig = {
apiKey: "AIzaSyADlL7BKaVPgdCH6xSqWEjVqf54q33E9WE",
authDomain: "wetter-check.firebaseapp.com",
projectId: "wetter-check",
storageBucket: "wetter-check.firebasestorage.app",
messagingSenderId: "184488061652",
appId: "1:184488061652:web:dda3d879ff8cfd36d6e941"
};

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
let messaging = null;
let currentUserUid = null;

// Sichere Auth-Zustandsänderung & Laden der Cloud-Favoriten
auth.onAuthStateChanged((user) => {
  if (user) {
      currentUserUid = user.uid;
      loadFavoritesFromCloud();
  } else {
      auth.signInAnonymously().catch(err => console.error('Auth Fehler:', err));
  }
});

if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('./firebase-messaging-sw.js')
.then((registration) => {
 messaging = firebase.messaging(app);
 messaging.useServiceWorker(registration);
 messaging.onMessage((payload) => {
     if (payload.notification) {
         if ('Notification' in window && Notification.permission === 'granted') {
             navigator.serviceWorker.ready.then(reg => {
                 reg.showNotification(payload.notification.title, { body: payload.notification.body, icon: 'logo.png', data: payload.data });
             });
         }
     }
 });
}).catch((err) => {
 console.error('Service Worker Registrierung fehlgeschlagen:', err);
});
}

// --- Push-Status & Live-GPS Button Update ---
function updatePushStatusUI() {
const infoBox = document.getElementById('pushStatusInfo');
const btn = document.getElementById('pushToggleBtn');
let isActive = localStorage.getItem('tour_push_active') === 'true';
const tourTitle = localStorage.getItem('tour_push_title') || 'Aktuelle Tour';
const startTime = localStorage.getItem('tour_push_start') || '';
const dauer = Number(localStorage.getItem('tour_push_duration') || 6);

// FIX: Geprüft wurde ausschließlich das localStorage-Flag - nie, ob die Tour
// überhaupt noch läuft. Eine Tour von gestern wurde dadurch dauerhaft als
// "Push-Benachrichtigungen aktiv" angezeigt, obwohl das Backend sie längst
// abgeschlossen hatte. Die Anzeige endet jetzt mit der Tour.
let beendet = false;
if (isActive && startTime) {
  const start = new Date(startTime);
  if (Number.isFinite(start.getTime())) {
    const ende = new Date(start.getTime() + dauer * 3600000);
    if (Date.now() > ende.getTime()) {
      beendet = true;
      isActive = false;
      localStorage.setItem('tour_push_active', 'false');
      localStorage.setItem('tour_push_finished', ende.toISOString());
    }
  }
}

if (isActive) {
 btn.classList.add('active');
 btn.innerText = 'Push Benachrichtigungen für die Tour deaktivieren';
 infoBox.style.display = 'block';
 const start = startTime ? new Date(startTime) : null;
 const laeuft = start && Date.now() >= start.getTime();
 const phase = laeuft

async function searchMountainsAroundStartSilent() {
const lat = parseFloat(document.getElementById('lat').value);
const lon = parseFloat(document.getElementById('lon').value);
if (isNaN(lat) || isNaN(lon)) return;

const radius = 15000;
// FIX: "out body 100" begrenzt Overpass auf 100 Elemente - aber in der Reihenfolge,
            // in der Overpass sie intern findet (grob nach OSM-Objekt-ID), NICHT nach Entfernung.
            // Die Sortierung nach Distanz passiert erst DANACH im Browser. In dicht benannten
            // Gebieten (z.B. Schladming/Dachstein) gibt es oft deutlich mehr als 100 benannte
            // "natural=peak"-Knoten im 15-km-Radius - dann wurden nahe Gipfel wie "Vordere
            // Mandling" oder "Annikahöhe" zufällig aussortiert, während weiter entfernte
            // Gipfel (mit kleinerer OSM-ID) in der Liste landeten. Die Basiskarte selbst zeigt
            // alle Gipfel korrekt an (sie nutzt die vollständigen OSM-Daten der Kachel), nur die
            // App-eigene Auswahlliste war betroffen.
            // "out body qt;" gibt ALLE Treffer zurück (kein hartes Limit) und ordnet sie dabei
            // grob geografisch (Quadtile-Reihenfolge) vor - das clientseitige Sortieren nach
            // Distanz bleibt zusätzlich bestehen. Bei 15 km Radius und einem reinen Punkt-Tag
            // ist die Ergebnismenge auch in dichten Alpenregionen unkritisch für Overpass.
            const query = `[out:json][timeout:15];
            node["natural"="peak"](around:${radius},${lat},${lon});
            out body qt;`;

try {
 const res = await fetch('https://overpass-api.de/api/interpreter', {
     method: 'POST',
     body: "data=" + encodeURIComponent(query),
     headers: { 'Content-type': 'application/x-www-form-urlencoded' }
 });
 const data = await res.json();
 
 let rawPeaks = data.elements
     .filter(el => el.tags && el.tags.name)
     .map(el => {
         return {
             name: el.tags.name,
             alt: el.tags.ele ? parseInt(el.tags.ele) : null,
             lat: el.lat,
             lon: el.lon,
             distance: getDistance(lat, lon, el.lat, el.lon)
         };
     });
 peakCandidates = rawPeaks.sort((a, b) => a.distance - b.distance);
} catch (e) {
 console.error("Fehler bei der stillen Overpass Gipfelsuche", e);
}
}

function getDistance(a,b,c,d){
const R=6371;
const dl=(c-a)*Math.PI/180;
const dn=(d-b)*Math.PI/180;
const x=Math.sin(dl/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dn/2)**2;
return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ===========================================================================
// ROUTENVERLAUF FÜR DAS BACKEND
// ---------------------------------------------------------------------------
// Das Backend kannte bisher nur Start und Gipfel und hat dazwischen linear
// interpoliert. Bei einer Route, die im Bogen ums Massiv führt, liegen die
// Zwischenpunkte dadurch weit neben dem echten Weg - und damit auch die
// Stellen, an denen der Nowcast abgefragt wird.
//
// Der Track wird deshalb auf wenige Stützpunkte reduziert und mitgespeichert.
// Douglas-Peucker statt "jeden n-ten Punkt": Bei gleichmäßiger Ausdünnung
// verschwinden genau die Kehren und Grate, die den Weg ausmachen, während auf
// geraden Abschnitten unnötig viele Punkte übrig bleiben. Douglas-Peucker
// behält die Punkte, die die Form tragen.
// ===========================================================================
const TRACK_MAX_POINTS = 50;

function trackPerpDistance(p, a, b) {
  // Näherung in Metern; auf Tourlänge völlig ausreichend.
  const kx = 111320 * Math.cos(a[0] * Math.PI / 180), ky = 110540;
  const px = (p[1] - a[1]) * kx, py = (p[0] - a[0]) * ky;
  const bx = (b[1] - a[1]) * kx, by = (b[0] - a[0]) * ky;
  const len2 = bx * bx + by * by;
  if (len2 === 0) return Math.hypot(px, py);
  let t = (px * bx + py * by) / len2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - t * bx, py - t * by);
}

function trackSimplify(points, toleranceM) {
  if (points.length < 3) return points.slice();
  const keep = new Array(points.length).fill(false);
  keep[0] = keep[points.length - 1] = true;
  const stack = [[0, points.length - 1]];
  while (stack.length) {
    const [i, j] = stack.pop();
    let maxD = -1, maxI = -1;
    for (let k = i + 1; k < j; k++) {
      const d = trackPerpDistance(points[k], points[i], points[j]);
      if (d > maxD) { maxD = d; maxI = k; }
    }
    if (maxD > toleranceM && maxI > 0) {
      keep[maxI] = true;
      stack.push([i, maxI], [maxI, j]);
    }
  }
  return points.filter((_, i) => keep[i]);
}

function buildTrackForCloud(rawPoints) {
  if (!rawPoints || rawPoints.length < 2) return null;
  // Toleranz so lange erhöhen, bis die Punktzahl passt. Startwert 25 m ist
  // feiner als jede Nowcast-Rasterzelle (1 km) - Genauigkeit geht also nicht
  // verloren, es wird nur Speicher gespart.
  let tol = 25, simplified = trackSimplify(rawPoints, tol);
  let guard = 0;
  while (simplified.length > TRACK_MAX_POINTS && guard++ < 20) {
    tol *= 1.6;
    simplified = trackSimplify(rawPoints, tol);
  }
  if (simplified.length > TRACK_MAX_POINTS) {
    const schritt = Math.ceil(simplified.length / TRACK_MAX_POINTS);
    simplified = simplified.filter((_, i) => i % schritt === 0 || i === simplified.length - 1);
  }
  // Kompaktes Format: [lat, lon, ele] auf sinnvolle Stellen gerundet.
  // 5 Nachkommastellen entsprechen gut einem Meter.
  return simplified.map(p => [
    Math.round(p[0] * 1e5) / 1e5,
    Math.round(p[1] * 1e5) / 1e5,
    p[2] != null ? Math.round(p[2]) : null
  ]);
}

let gpxTrackForCloud = null;   // wird beim Abonnieren mitgeschrieben

function handleGPXUpload(event) {
const file = event.target.files[0];
if (!file) return;
const status = document.getElementById('gpxStatus');
status.innerText = 'Lese GPX ...';

const gpxBlobUrl = URL.createObjectURL(file);
document.getElementById('gpxUrlParam').value = gpxBlobUrl;

const reader = new FileReader();
reader.onload = async function(e) {
 try {
     const xmlDoc = new DOMParser().parseFromString(e.target.result, "text/xml");
     const pts = xmlDoc.querySelectorAll("trkpt, wpt");
     if (!pts.length) {
         status.innerText = '❌ Keine Punkte in GPX.';
         return;
     }

     // Rohpunkte einsammeln und für die Cloud ausdünnen
     const rohPunkte = [];
     pts.forEach(pt => {
         const la = parseFloat(pt.getAttribute("lat"));
         const lo = parseFloat(pt.getAttribute("lon"));
         if (!Number.isFinite(la) || !Number.isFinite(lo)) return;
         const el = pt.querySelector("ele");
         const ele = el ? parseFloat(el.textContent) : null;
         rohPunkte.push([la, lo, Number.isFinite(ele) ? ele : null]);
     });
     gpxTrackForCloud = buildTrackForCloud(rohPunkte);

     const sLat = parseFloat(pts[0].getAttribute("lat"));
     const sLon = parseFloat(pts[0].getAttribute("lon"));
     document.getElementById('lat').value = sLat.toFixed(5);
     document.getElementById('lon').value = sLon.toFixed(5);
     document.getElementById('start_lat').value = sLat.toFixed(5);
     document.getElementById('start_lon').value = sLon.toFixed(5);
     
     try {
         const rRev = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${sLat}&lon=${sLon}`);
         const dRev = await rRev.json();
         const placeName = dRev.address.village || dRev.address.town || dRev.address.city || dRev.address.municipality || 'GPX Startort';
         document.getElementById('locationSearch').value = placeName;
         document.getElementById('locationPreview').innerText = '📍 GPX Start: ' + placeName;
     } catch(err) {
         document.getElementById('locationSearch').value = 'GPX Startort';
     }
     
     let maxEle = -Infinity, pLat = null, pLon = null;
     pts.forEach(pt => {
         const el = pt.querySelector("ele");
         if (el) {
             const val = parseFloat(el.textContent);
             if (val > maxEle) {
                 maxEle = val;
                 pLat = parseFloat(pt.getAttribute("lat"));
                 pLon = parseFloat(pt.getAttribute("lon"));
             }
         }
     });
     
     if (maxEle !== -Infinity && pLat !== null) {
         let peakName = "Höchster Punkt";
         try {
             const nomRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=peak+near+${pLat},${pLon}&limit=1`);
             if (nomRes.ok) {
                 const nomData = await nomRes.json();
                 if (nomData && nomData.length > 0) {
                     peakName = nomData[0].display_name.split(',')[0];
                 }
             }
         } catch(err) {}

         selectedPeak = { name: peakName, alt: Math.round(maxEle), lat: pLat, lon: pLon };
         renderSelectedPeak();
     }
     status.innerText = gpxTrackForCloud
         ? `✅ GPX geladen (${gpxTrackForCloud.length} Stützpunkte für die Routenwarnung)`
         : '✅ GPX erfolgreich geladen!';
     saveState();
     searchMountainsAroundStart();
 } catch (err) {
     status.innerText = '❌ Fehler beim Lesen.';

async function searchMountainsAroundStart() {
const lat = parseFloat(document.getElementById('lat').value);
const lon = parseFloat(document.getElementById('lon').value);
if (isNaN(lat) || isNaN(lon)) return;

const loading = document.getElementById('peakLoading');
const sel = document.getElementById('peakDropdown');
const hint = document.getElementById('peakSearchHint');

loading.style.display = 'block';
sel.style.display = 'none';
hint.innerText = `Suche Gipfel im Umkreis von 15 km (Overpass API)…`;

const radius = 15000;
// FIX: "out body 100" begrenzt Overpass auf 100 Elemente - aber in der Reihenfolge,
            // in der Overpass sie intern findet (grob nach OSM-Objekt-ID), NICHT nach Entfernung.
            // Die Sortierung nach Distanz passiert erst DANACH im Browser. In dicht benannten
            // Gebieten (z.B. Schladming/Dachstein) gibt es oft deutlich mehr als 100 benannte
            // "natural=peak"-Knoten im 15-km-Radius - dann wurden nahe Gipfel wie "Vordere
            // Mandling" oder "Annikahöhe" zufällig aussortiert, während weiter entfernte
            // Gipfel (mit kleinerer OSM-ID) in der Liste landeten. Die Basiskarte selbst zeigt
            // alle Gipfel korrekt an (sie nutzt die vollständigen OSM-Daten der Kachel), nur die
            // App-eigene Auswahlliste war betroffen.
            // "out body qt;" gibt ALLE Treffer zurück (kein hartes Limit) und ordnet sie dabei
            // grob geografisch (Quadtile-Reihenfolge) vor - das clientseitige Sortieren nach
            // Distanz bleibt zusätzlich bestehen. Bei 15 km Radius und einem reinen Punkt-Tag
            // ist die Ergebnismenge auch in dichten Alpenregionen unkritisch für Overpass.
            const query = `[out:json][timeout:15];
            node["natural"="peak"](around:${radius},${lat},${lon});
            out body qt;`;

try {
 const res = await fetch('https://overpass-api.de/api/interpreter', {
     method: 'POST',
     body: "data=" + encodeURIComponent(query),
     headers: { 'Content-type': 'application/x-www-form-urlencoded' }
 });
 const data = await res.json();
 
 let rawPeaks = data.elements
     .filter(el => el.tags && el.tags.name)
     .map(el => {
         return {
             name: el.tags.name,
             alt: el.tags.ele ? parseInt(el.tags.ele) : null,
             lat: el.lat,
             lon: el.lon,
             distance: getDistance(lat, lon, el.lat, el.lon)
         };
     });

 const missingEle = rawPeaks.filter(p => !p.alt);
 if (missingEle.length > 0) {
     try {
         const lats = missingEle.map(p => p.lat.toFixed(5)).join(',');
         const lons = missingEle.map(p => p.lon.toFixed(5)).join(',');
         const elR = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lats}&longitude=${lons}`);
         if (elR.ok) {
             const elD = await elR.json();
             const elevs = Array.isArray(elD.elevation) ? elD.elevation : [elD.elevation];
             missingEle.forEach((p, idx) => {
                 if (elevs[idx] !== undefined && elevs[idx] !== null) {
                     p.alt = Math.round(elevs[idx]);
                 }
             });
         }
     } catch (e) {}
 }

 loading.style.display = 'none';
 peakCandidates = rawPeaks.sort((a, b) => a.distance - b.distance);
 renderPeakOptions(peakCandidates, 15);
     
} catch (e) {
 console.error("Gipfel-Suche fehlgeschlagen", e);
 loading.style.display = 'none';
 hint.innerText = "Fehler bei der geographischen Gipfelsuche.";
}
}

// Ringabstaende der Nowcast-Frontanalyse. 15 km Abstand entspricht bei der
// 15-Minuten-Aufloesung des GeoSphere-Nowcasts genau 60 km/h pro Zeitschritt.
const LIVE_RING_IN_KM = 5;
const LIVE_RING_OUT_KM = 20;
const LIVE_RING_SPACING_KM = LIVE_RING_OUT_KM - LIVE_RING_IN_KM;
const LIVE_RING_KM = [LIVE_RING_IN_KM, LIVE_RING_OUT_KM];

function liveDistancePoint(lat,lon,dir,km=8){
const dLat=(km/111.32)*dir.lat;
const dLon=(km/(111.32*Math.max(.2,Math.cos(lat*Math.PI/180))))*dir.lon;
return [lat+dLat,lon+dLon];
}

async function fetchGeoSphereNowcast(lat,lon){
const url='https://dataset.api.hub.geosphere.at/v1/timeseries/forecast/nowcast-v1-15min-1km?lat_lon='+
encodeURIComponent(lat.toFixed(5)+','+lon.toFixed(5))+
'&parameters=rr&forecast_offset=0&output_format=geojson';
const r=await fetch(url,{cache:'no-store'});
if(!r.ok)throw new Error('GeoSphere Nowcast HTTP '+r.status);
return r.json();
}

async function fetchGeoSphereNowcastPoints(points){
const url='https://dataset.api.hub.geosphere.at/v1/timeseries/forecast/nowcast-v1-15min-1km?'+
points.map(p=>'lat_lon='+encodeURIComponent(p.lat.toFixed(5)+','+p.lon.toFixed(5))).join('&')+
'&parameters=rr&forecast_offset=0&output_format=geojson';
const r=await fetch(url,{cache:'no-store'});
if(!r.ok)throw new Error('GeoSphere Nowcast HTTP '+r.status);
return r.json();
}

// ---------------------------------------------------------------------------
// FIX (Kernfehler der Live-Engine): Die GeoSphere-API liefert die Zeitachse EINMAL
// auf oberster Ebene der FeatureCollection ("timestamps"), nicht pro Feature. Der
// alte Code suchte sie unter feature.properties.parameters.rr.timestamps und bekam
// deshalb IMMER eine leere Liste zurueck. Folge: liveFindOnset() lieferte Treffer
// ohne Zeitstempel, und fetchLiveDirectionSamples() hat wegen
// .filter(s=>s.nc.times.length) ausnahmslos ALLE Richtungsproben verworfen -> es
// konnte nie eine anziehende Regenfront erkannt werden.
// Der Parser liest nun alle bekannten Varianten (der Endpunkt ist offiziell als
// "prerelease" markiert und kann sich noch aendern).
function geoSphereTimestamps(data, feature){
const top = data?.timestamps || data?.time || data?.times;
if(Array.isArray(top) && top.length) return top;
const props = feature?.properties;
const inProps = props?.timestamps || props?.time || props?.times;
if(Array.isArray(inProps) && inProps.length) return inProps;
const params = props?.parameters || {};
for(const key of Object.keys(params)){
 const p = params[key];
 const t = p?.timestamps || p?.time || p?.times;
 if(Array.isArray(t) && t.length) return t;
}
return [];
}

function geoSphereValues(feature, param='rr'){
const params = feature?.properties?.parameters;
if(!params) return [];
// Parameternamen kommen je nach Datensatz gross- oder kleingeschrieben zurueck.
const keys = Object.keys(params);
const entry = params[param] || params[param.toUpperCase()] || params[param.toLowerCase()]
           || (keys.length===1 ? params[keys[0]] : null);
const data = entry?.data;
if(!Array.isArray(data)) return [];
if(data.length && Array.isArray(data[0])) return []; // verschachtelte Grid-Matrix
return data;
}

function parseGeoSphereSeries(data){
const f=data?.features?.[0];
if(!f) return {times:[],values:[]};
return {times:geoSphereTimestamps(data,f),values:geoSphereValues(f,'rr')};
}

function parseGeoSpherePointSeries(data,index){
const f=data?.features?.[index];
if(!f) return {times:[],values:[]};
return {times:geoSphereTimestamps(data,f),values:geoSphereValues(f,'rr')};
}

async function fetchLiveCenter(lat,lon){

async function fetchLiveDirectionSamples(lat,lon){
const points=[];
LIVE_DIRS.forEach(d=>{
 // FIX: Die Ringe lagen bei 4 und 8 km - nur 4 km auseinander. Der GeoSphere-Nowcast
 // hat aber 15-Minuten-Schritte: eine Front mit 40 km/h legt 4 km in 6 Minuten zurueck
 // und liegt damit im SELBEN Zeitschritt -> dt=0 -> Kandidat verworfen. Rechnerisch
 // waren mit der alten Kombination aus Ringabstand und Plausibilitaetsgrenzen nur
 // Zuggeschwindigkeiten zwischen 2 und 16 km/h ueberhaupt erkennbar; reale
 // Niederschlagsfronten ziehen mit 20-60 km/h. Mit 15 km Ringabstand entspricht ein
 // Zeitschritt genau 60 km/h und der gesamte realistische Bereich wird abgedeckt.
 LIVE_RING_KM.forEach(km=>{
     const [pLat,pLon]=liveDistancePoint(lat,lon,d,km);
     points.push({dir:d.name,km,lat:pLat,lon:pLon});
 });
});
const j=await fetchGeoSphereNowcastPoints(points);
let thunder=[];
try {
 const u='https://api.open-meteo.com/v1/forecast?latitude='+points.map(p=>p.lat.toFixed(5)).join(',')+
 '&longitude='+points.map(p=>p.lon.toFixed(5)).join(',')+
 '&hourly=weather_code&forecast_hours=4&timezone=UTC';
 const r=await fetch(u,{cache:'no-store'});
 if(r.ok){
     const x=await r.json(); 
     thunder=Array.isArray(x)?x:[x];
 }
} catch(e) {
 thunder=[];
}
return points.map((p,i)=>{
 const nc=parseGeoSpherePointSeries(j,i);
 const wx=thunder[i]?.hourly||{};
 return {...p,nc,wx,thunderAt(time){
     const ts=wx.time||[]; 
     const codes=wx.weather_code||[];
     if(!time||!ts.length) return false;
     const target=new Date(time).getTime(); 
     let best=-1,bestDiff=Infinity;
     for(let k=0;k<ts.length;k++){
         const diff=Math.abs(new Date(ts[k]).getTime()-target);
         if(diff<bestDiff){bestDiff=diff;best=k;}
     }
     return best>=0 && bestDiff<=90*60000 && [95,96,99].includes(Number(codes[best]));
 }};
}).filter(s=>s.nc.times.length);
}

function getRainDescription(amount) {
if (amount < 0.2) return "Nieselregen";
if (amount < 2.0) return "leichter Regen";
if (amount < 6.0) return "moderater Regen";
return "starker Regen";
}

function liveFindOnset(series, threshold=0.08) {
for(let i=0;i<series.values.length;i++){
 const v=Number(series.values[i]||0);
 const next=Number(series.values[i+1]||0);
 if(v>=threshold && (next>=threshold || i===series.values.length-1)){
     return {idx:i,time:series.times?.[i],amount:v};
 }
}
return null;
}

function liveFindArrival(centerSeries,samples){
let threshold = 0.08;
let centerOnset = liveFindOnset(centerSeries, threshold);
if (!centerOnset) {
 threshold = 0.02; 
 centerOnset = liveFindOnset(centerSeries, threshold);
}

if(centerOnset){
 return {kind:'now',time:centerOnset.time,direction:null,amount:centerOnset.amount,confidence:'hoch'};
}
const grouped={};
samples.forEach(s=>{(grouped[s.dir] ||= {})[s.km]=s;});
const candidates=[];

Object.keys(grouped).forEach(dir=>{
 const sIn=grouped[dir][LIVE_RING_IN_KM], sOut=grouped[dir][LIVE_RING_OUT_KM];
 if(!sIn||!sOut) return;

 let oIn=liveFindOnset(sIn.nc,0.08), oOut=liveFindOnset(sOut.nc,0.08);
 if (!oIn || !oOut) {
      oIn=liveFindOnset(sIn.nc,0.02);
      oOut=liveFindOnset(sOut.nc,0.02);
 }

 if(!oIn||!oOut||!oIn.time||!oOut.time) return;
 const tIn=new Date(oIn.time).getTime(), tOut=new Date(oOut.time).getTime();
 const dt=tIn-tOut;   // Front trifft erst den aeusseren, dann den inneren Ring

 // 15 min Zeitschritt = 60 km/h, 150 min = 6 km/h bei 15 km Ringabstand.
 if(dt < 15*60000 || dt > 150*60000) return;

 const speedKmh=LIVE_RING_SPACING_KM/(dt/3600000);
 if(speedKmh<5 || speedKmh>90) return;

 // FIX (Vorzeichenfehler): Die Front erreicht den inneren Ring zum Zeitpunkt tIn und
 // braucht danach noch LIVE_RING_IN_KM bis zur eigenen Position - die Restlaufzeit
 // muss also ADDIERT werden. Der alte Code hat sie abgezogen, wodurch die gemeldete
 // Ankunft um die doppelte Laufzeit ZU FRUEH lag und die Warnung durch den
 // anschliessenden Plausibilitaets-Check haeufig ganz herausgefiltert wurde.
 const etaMs=tIn+(LIVE_RING_IN_KM/speedKmh)*3600000;
 const now=Date.now();
 
 if(etaMs<now-15*60000 || etaMs>now+3*3600000) return;
 
 const thunder = Boolean(sIn.thunderAt?.(oIn.time) || sOut.thunderAt?.(oIn.time));
 candidates.push({
     kind:'incoming',time:new Date(etaMs).toISOString(),direction:dir,
     amount:Math.max(oIn.amount,oOut.amount),speedKmh,confidence:'hoch',thunder,
     sourceIn:oIn.time,sourceOut:oOut.time
 });
});

if(!candidates.length){
 const fallback=[];
 Object.keys(grouped).forEach(dir=>{
     const s4=grouped[dir][LIVE_RING_IN_KM];
     if(!s4) return;
     let o4=liveFindOnset(s4.nc,0.08);
     if (!o4) o4=liveFindOnset(s4.nc,0.02);
     if(!o4||!o4.time) return;
     const mins=Math.round((new Date(o4.time)-new Date())/60000);
     if(mins>=0 && mins<=120){
         fallback.push({kind:'incoming',time:o4.time,direction:dir,amount:o4.amount,confidence:'mittel',thunder:Boolean(s4.thunderAt?.(o4.time))});
     }
 });
 if(!fallback.length) return null;
 fallback.sort((a,b)=>new Date(a.time)-new Date(b.time));
 return fallback[0];
}

candidates.sort((a,b)=>new Date(a.time)-new Date(b.time));
return candidates[0];
}
