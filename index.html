<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bergtouren Wetter Ampel</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.png">
<link rel="icon" href="logo.png" type="image/png">
<style>
:root { --primary: #1e293b; --accent: #10b981; --accent-hover: #059669; --bg: #f8fafc; --card-bg: #ffffff; --border: #e2e8f0; --text: #334155; --text-light: #64748b; }
body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; justify-content: center; }
.container { width: 100%; max-width: 520px; background: var(--card-bg); padding: 20px; border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05); }
.header { text-align: center; margin-bottom: 16px; }
.logo-img { width: 80px; height: 80px; margin-bottom: 10px; border-radius: 50%; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
h1 { color: var(--primary); font-size: 20px; margin: 0; font-weight: 700; }
.card-section { background: #f8fafc; border: 1px solid var(--border); border-radius: 16px; padding: 15px; margin-bottom: 12px; transition: all 0.2s ease; }
.card-section:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(16,185,129,0.1); }
label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 13px; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; }
.row { display: flex; gap: 8px; }
input, select { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; font-size: 14px; background: #fff; color: var(--text); box-sizing: border-box; transition: all 0.2s; }
input:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(16,185,129,0.15); }
button, .link-button { cursor: pointer; font-weight: 600; border: none; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.25); transition: all 0.15s ease; }
button:hover, .link-button:hover { transform: translateY(-2px); box-shadow: 0 6px 10px -1px rgba(0, 0, 0, 0.15), 0 3px 6px -1px rgba(0, 0, 0, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.3); }
.action-btn { background: #3b82f6; color: white; padding: 0 16px; font-size: 13px; white-space: nowrap; }
.action-btn:hover { background: #2563eb; }
.fav-bar { display: flex; gap: 6px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
.main-btn { background: var(--accent); color: white; padding: 14px; width: 100%; border-radius: 14px; font-size: 15px; font-weight: 700; margin-top: 5px; }
.main-btn:hover { background: var(--accent-hover); }
#results { margin-top: 20px; }
.slot { padding: 14px; margin-bottom: 12px; border-radius: 12px; font-size: 13px; }
.status-green { background: #ecfdf5; border-left: 5px solid #10b981; color: #065f46; }
.status-orange { background: #fff7ed; border-left: 5px solid #f59e0b; color: #9a3412; }
.status-red { background: #fef2f2; border-left: 5px solid #ef4444; color: #7f1d1d; }
.weather-split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; background: rgba(255,255,255,0.6); padding: 8px; border-radius: 8px; }
.weather-box-title { font-weight: 700; font-size: 11px; text-transform: uppercase; margin-bottom: 4px; color: var(--primary); }
.badge { font-weight: 700; padding: 4px 8px; border-radius: 6px; font-size: 11px; white-space: nowrap; background: rgba(0,0,0,0.06); }
.location-title { font-weight: 700; color: var(--primary); margin-bottom: 8px; font-size: 16px; }
.tour-specs-header { background: #f1f5f9; border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 12px; font-size: 12px; line-height: 1.5; color: var(--text); }
.detected-location { font-size: 12px; color: #3b82f6; margin-top: 6px; font-weight: 600; }
.warning-box { background: #fff5f5; border: 1px solid #fecaca; color: #991b1b; padding: 14px; border-radius: 12px; margin-bottom: 12px; font-size: 13px; line-height: 1.5; }
.sun-text { font-size: 13px; color: var(--text-light); margin-bottom: 12px; text-align: center; }
.link-button { display: flex; justify-content: space-between; align-items: center; background: #3b82f6; color: white; padding: 12px 14px; font-size: 13px; text-decoration: none; margin-bottom: 8px; width: 100%; box-sizing: border-box; }
.share-btn { background: #25d366; color: white; padding: 12px; width: 100%; border-radius: 12px; font-size: 14px; font-weight: 700; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.export-btn { background: #475569; color: white; padding: 12px; width: 100%; border-radius: 12px; font-size: 14px; font-weight: 700; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.meta-info { margin-top: 20px; font-size: 11px; color: var(--text-light); text-align: center; border-top: 1px solid var(--border); padding-top: 10px; }
.footer-copyright { text-align: center; font-size: 11px; color: var(--text-light); margin-top: 24px; border-top: 1px solid var(--border); padding-top: 12px; }
#locationResultsSelect { display: none; margin-top: 8px; background: #f8fafc; border: 1px solid #3b82f6; }
.risk-hero { border-radius: 18px; padding: 18px; margin-bottom: 14px; text-align: center; border: 1px solid var(--border); }
.risk-green { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
.risk-orange { background: #fff7ed; border-color: #fdba74; color: #9a3412; }
.risk-red { background: #fef2f2; border-color: #fecaca; color: #7f1d1d; }
.risk-icon { font-size: 34px; line-height: 1.1; }
.risk-title { font-size: 20px; font-weight: 800; margin: 5px 0; }
.risk-summary { font-size: 13px; margin-top: 8px; line-height: 1.4; text-align: left; background: rgba(255,255,255,0.6); padding: 10px; border-radius: 10px; }
.input-section-title { font-size: 14px; font-weight: 800; color: var(--primary); margin: -2px 0 10px; display: flex; align-items: center; gap: 6px; }
.input-hint { font-size: 11px; color: var(--text-light); margin-top: 6px; line-height: 1.35; }
.trend-box { margin: 12px 0; padding: 12px; border-radius: 12px; background: #f1f5f9; border: 1px solid var(--border); font-size: 13px; line-height: 1.45; }
.trend-good { border-color: #a7f3d0; background: #ecfdf5; color: #065f46; }
.trend-warn { border-color: #fdba74; background: #fff7ed; color: #9a3412; }
.trend-danger { border-color: #fecaca; background: #fef2f2; color: #7f1d1d; }

@media print {
  @page { size: A4 portrait; margin: 6mm 8mm; }
  body { background: white !important; padding: 0 !important; font-size: 9pt !important; color: black !important; }
  .container { box-shadow: none !important; max-width: 100% !important; padding: 0 !important; width: 100% !important; }
  .card-section, .main-btn, .fav-bar, .share-btn, .export-btn, .link-button, .header, button { display: none !important; }
  .location-title { font-size: 14pt !important; margin-bottom: 4px !important; }
  .tour-specs-header { padding: 5px 8px !important; margin-bottom: 6px !important; font-size: 8.5pt !important; line-height: 1.3 !important; }
  .risk-hero { padding: 6px 10px !important; margin-bottom: 6px !important; border-radius: 8px !important; }
  .risk-icon { font-size: 20px !important; }
  .risk-title { font-size: 13pt !important; margin: 0 !important; }
  .risk-summary { font-size: 8.5pt !important; padding: 4px 6px !important; margin-top: 4px !important; }
  .trend-box { padding: 4px 8px !important; margin: 4px 0 !important; font-size: 8.5pt !important; border-radius: 6px !important; }
  .warning-box { padding: 5px 8px !important; margin-bottom: 6px !important; font-size: 8.5pt !important; }
  .slot { padding: 4px 8px !important; margin-bottom: 4px !important; font-size: 8.5pt !important; border-radius: 6px !important; page-break-inside: avoid; break-inside: avoid; }
  .weather-split { padding: 3px 6px !important; margin: 3px 0 !important; gap: 4px !important; }
  .weather-box-title { font-size: 8pt !important; margin-bottom: 2px !important; }
  .sun-text { font-size: 8pt !important; margin-bottom: 6px !important; }
  .footer-copyright, .meta-info { font-size: 7.5pt !important; margin-top: 4px !important; padding-top: 4px !important; }
}
</style>
</head>
<body>
<div class="container">
<div class="header">
<img src="logo.png" class="logo-img" alt="Logo">
<h1>Bergtouren Wetter Ampel</h1>
</div>

<div class="card-section">
<label>Ort suchen:</label>
<div class="row" style="position: relative;">
<input type="text" id="locationSearch" placeholder="z.B. Puchberg, Reichenau, Maiersdorf" oninput="clearCoordsIfSearching()" style="padding-right: 35px;">
<button type="button" onclick="clearSearchField()" style="position: absolute; right: 85px; top: 50%; transform: translateY(-50%); background: transparent; border: none; font-size: 16px; color: #94a3b8; cursor: pointer; padding: 5px; box-shadow: none;">✖</button>
<button type="button" class="action-btn" onclick="searchLocation()">Suchen</button>
</div>
<div class="fav-bar">
<select id="favoritesDropdown" onchange="loadFavoriteFromDropdown()" style="font-size: 12px; padding: 8px; flex: 1;">
<option value="">⭐ Favoriten wählen...</option>
</select>
<button type="button" class="action-btn" onclick="saveCurrentAsFavorite()" style="background: #10b981; font-size: 12px; padding: 8px 10px;">+ Speichern</button>
<button type="button" class="action-btn" onclick="deleteSelectedFavorite()" style="background: #ef4444; font-size: 12px; padding: 8px 10px;">❌ Löschen</button>
</div>
<select id="locationResultsSelect" onchange="selectLocationFromDropdown()">
<option value="">-- Bitte Ort auswählen --</option>
</select>
<div id="locationPreview" class="detected-location"></div>
</div>

<div class="card-section">
<label>Oder Koordinaten (Breite, Länge):</label>
<div class="row" style="margin-bottom: 8px;">
<input type="text" id="lat" placeholder="Breite (z.B. 47.7800)" oninput="clearSearchInput()">
<input type="text" id="lon" placeholder="Länge (z.B. 15.8900)" oninput="clearSearchInput()">
</div>
<button type="button" class="action-btn" onclick="getGPS()" style="width: 100%; padding: 10px; background: #64748b;">📍 Aktueller Standort</button>
</div>
<div class="card-section">
<label>⛰️ Gipfel-Höhenmeter (optional):</label>
<input type="number" id="peakAltInput" placeholder="z.B. 2076 (für Gipfel-Wetter)" oninput="saveState()" style="font-size: 13px;">
<small class="input-hint">Ohne Gipfelhöhe wird nur das Wetter am Ort angezeigt. Mit Gipfelhöhe wird zusätzlich das Wetter am Gipfel berechnet.</small>
</div>

<div class="card-section">
<div class="form-group" style="margin-bottom: 12px;">
<label style="display: flex; justify-content: space-between; align-items: center;">
<span>⏱️ Geplante Startzeit:</span>
<button type="button" onclick="setNowTime()" style="background: #e2e8f0; color: var(--text); border: none; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600;">🕒 Jetzt</button>
</label>
<input type="datetime-local" id="startTime" onchange="saveState()">
</div>
<div class="form-group" style="margin-bottom: 0;">
<label>🥾 Geplante Tourendauer:</label>
<select id="duration" onchange="saveState()">
<option value="4">4 Stunden (Halbtag)</option>
<option value="6" selected>6 Stunden (Normal)</option>
<option value="8">8 Stunden (Tagestour)</option>
<option value="10">10 Stunden (Lange Tour)</option>
</select>
</div>
</div>

<button class="main-btn" onclick="analyzeRisk()">Wetter abfragen</button>
<div id="results"></div>
<div class="footer-copyright">&copy; 2026 Christian Camus. Alle Rechte vorbehalten.</div>
</div>
<script>
let foundLocations = [];
let savedFavorites = JSON.parse(localStorage.getItem('bt_favorites') || '[]');
let lastCoordLat = null;
let lastCoordLon = null;

function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function checkAndResetElevation(newLat, newLon) {
    if (lastCoordLat !== null && lastCoordLon !== null) {
        if (getDistance(lastCoordLat, lastCoordLon, newLat, newLon) > 20) {
            document.getElementById('peakAltInput').value = "";
            localStorage.removeItem('bt_alt');
        }
    }
    lastCoordLat = newLat;
    lastCoordLon = newLon;
}

window.addEventListener('DOMContentLoaded', () => {
    updateFavoritesDropdown();

    const urlParams = new URLSearchParams(window.location.search);
    const pLat = urlParams.get('lat');
    const pLon = urlParams.get('lon');
    const pSearch = urlParams.get('search');
    const pStart = urlParams.get('start');
    const pDuration = urlParams.get('duration');
    const pAlt = urlParams.get('alt');

    if (pLat && pLon) {
        document.getElementById('lat').value = pLat;
        document.getElementById('lon').value = pLon;
        lastCoordLat = parseFloat(pLat);
        lastCoordLon = parseFloat(pLon);
        if (pAlt && pAlt !== "null" && pAlt !== "") document.getElementById('peakAltInput').value = pAlt;
        if (pSearch) {
            document.getElementById('locationSearch').value = decodeURIComponent(pSearch);
            document.getElementById('locationPreview').innerText = '📍 Geteiltes Ziel: ' + decodeURIComponent(pSearch);
        }
        if (pStart) document.getElementById('startTime').value = pStart;
        if (pDuration) document.getElementById('duration').value = pDuration;
        saveState();
        analyzeRisk();
        return;
    }

    const savedSearch = localStorage.getItem('bt_search');
    const savedLat = localStorage.getItem('bt_lat');
    const savedLon = localStorage.getItem('bt_lon');
    const savedStart = localStorage.getItem('bt_start');
    const savedDuration = localStorage.getItem('bt_duration');
    const savedPreview = localStorage.getItem('bt_preview');
    const savedAlt = localStorage.getItem('bt_alt');

    if (savedSearch) document.getElementById('locationSearch').value = savedSearch;
    if (savedLat) { document.getElementById('lat').value = savedLat; lastCoordLat = parseFloat(savedLat); }
    if (savedLon) { document.getElementById('lon').value = savedLon; lastCoordLon = parseFloat(savedLon); }
    if (savedAlt && savedAlt !== "null" && savedAlt !== "") document.getElementById('peakAltInput').value = savedAlt;
    if (savedStart) document.getElementById('startTime').value = savedStart;
    if (!document.getElementById('startTime').value) setNowTime();
    if (savedDuration) document.getElementById('duration').value = savedDuration;
    if (savedPreview) document.getElementById('locationPreview').innerText = savedPreview;

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
});
function updateFavoritesDropdown() {
    const dropdown = document.getElementById('favoritesDropdown');
    dropdown.innerHTML = '<option value="">⭐ Favoriten wählen...</option>';
    savedFavorites.forEach((fav, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.text = fav.peakAlt ? fav.name + ' (' + fav.peakAlt + 'm)' : fav.name;
        dropdown.appendChild(opt);
    });
}

async function saveCurrentAsFavorite() {
    const name = document.getElementById('locationSearch').value.trim();
    const lat = document.getElementById('lat').value.trim();
    const lon = document.getElementById('lon').value.trim();
    const preview = document.getElementById('locationPreview').innerText;
    const peakAlt = document.getElementById('peakAltInput').value.trim();

    if (!name || !lat || !lon) { alert("Bitte Ort/Koordinaten eingeben."); return; }
    const favData = { name, lat, lon, preview, peakAlt };
    const index = savedFavorites.findIndex(f => f.name.toLowerCase() === name.toLowerCase());
    if (index > -1) savedFavorites[index] = favData;
    else savedFavorites.push(favData);

    localStorage.setItem('bt_favorites', JSON.stringify(savedFavorites));
    updateFavoritesDropdown();
    alert('"' + name + '" wurde inklusive Gipfelhöhe gespeichert!');
}

function deleteSelectedFavorite() {
    const currentSearchName = document.getElementById('locationSearch').value.trim();
    if (!currentSearchName) { alert("Bitte wähle zuerst einen Favoriten aus oder gib den Namen im Suchfeld ein."); return; }
    const index = savedFavorites.findIndex(f => f.name.toLowerCase() === currentSearchName.toLowerCase());
    if (index === -1) { alert('"' + currentSearchName + '" wurde nicht in den Favoriten gefunden.'); return; }
    if (confirm('Möchtest du "' + savedFavorites[index].name + '" wirklich aus den Favoriten löschen?')) {
        const deletedName = savedFavorites[index].name;
        savedFavorites.splice(index, 1);
        localStorage.setItem('bt_favorites', JSON.stringify(savedFavorites));
        updateFavoritesDropdown();
        clearSearchField();
        alert('"' + deletedName + '" wurde erfolgreich gelöscht.');
    }
}

function loadFavoriteFromDropdown() {
    const dropdown = document.getElementById('favoritesDropdown');
    const index = dropdown.value;
    if (index === "") return;

    const fav = savedFavorites[index];
    document.getElementById('locationSearch').value = fav.name || "";
    document.getElementById('lat').value = fav.lat || "";
    document.getElementById('lon').value = fav.lon || "";
    document.getElementById('peakAltInput').value = fav.peakAlt || "";
    document.getElementById('locationPreview').innerText = fav.preview || ('⭐ Favorit: ' + fav.name);
    document.getElementById('locationResultsSelect').style.display = "none";

    lastCoordLat = parseFloat(fav.lat);
    lastCoordLon = parseFloat(fav.lon);
    saveState();
    dropdown.value = "";
}

function clearSearchField() {
    document.getElementById('locationSearch').value = "";
    document.getElementById('locationResultsSelect').style.display = "none";
    document.getElementById('locationPreview').innerText = "";
    document.getElementById('peakAltInput').value = "";
    saveState();
}

function setNowTime() {
    const now = new Date();
    const localIso = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
    document.getElementById('startTime').value = localIso;
    saveState();
}

function saveState() {
    localStorage.setItem('bt_search', document.getElementById('locationSearch').value);
    localStorage.setItem('bt_lat', document.getElementById('lat').value);
    localStorage.setItem('bt_lon', document.getElementById('lon').value);
    localStorage.setItem('bt_start', document.getElementById('startTime').value);
    localStorage.setItem('bt_duration', document.getElementById('duration').value);
    localStorage.setItem('bt_preview', document.getElementById('locationPreview').innerText);
    localStorage.setItem('bt_alt', document.getElementById('peakAltInput').value);
}

function clearSearchInput() {
    document.getElementById('locationSearch').value = "";
    document.getElementById('locationResultsSelect').style.display = "none";
    saveState();
}

function clearCoordsIfSearching() {
    document.getElementById('lat').value = "";
    document.getElementById('lon').value = "";
    document.getElementById('peakAltInput').value = "";
    document.getElementById('locationPreview').innerText = "";
    saveState();
}
async function searchLocation() {
    const query = document.getElementById('locationSearch').value.trim();
    const selectBox = document.getElementById('locationResultsSelect');
    if (!query) { alert("Bitte Ort eingeben."); return; }
    document.getElementById('locationPreview').innerText = "Suche Orte...";
    selectBox.style.display = "none";
    selectBox.innerHTML = '<option value="">-- Bitte Ort auswählen --</option>';
    try {
        const res = await fetch('https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(query) + '&count=5&language=de');
        const data = await res.json();
        if (data.results && data.results.length > 0) {
            foundLocations = data.results;
            if (foundLocations.length === 1) { setCoordinates(foundLocations[0]); }
            else {
                foundLocations.forEach((place, index) => {
                    const opt = document.createElement('option'); opt.value = index;
                    const regionParts = [place.admin1, place.country].filter(Boolean).join(', ');
                    opt.text = place.name + ' (' + regionParts + ') [' + place.latitude.toFixed(2) + ', ' + place.longitude.toFixed(2) + ']';
                    selectBox.appendChild(opt);
                });
                selectBox.style.display = "block";
                document.getElementById('locationPreview').innerText = "🔍 Mehrere Treffer. Bitte wählen:";
            }
        } else { document.getElementById('locationPreview').innerText = "❌ Kein Ort gefunden."; }
        saveState();
    } catch(e) { document.getElementById('locationPreview').innerText = "❌ Fehler bei der Ortssuche."; }
}

async function selectLocationFromDropdown() {
    const selectBox = document.getElementById('locationResultsSelect');
    const index = selectBox.value;
    if (index !== "" && foundLocations[index]) {
        setCoordinates(foundLocations[index]);
        selectBox.style.display = "none";
    }
}

async function setCoordinates(place) {
    const lat = parseFloat(place.latitude);
    const lon = parseFloat(place.longitude);
    checkAndResetElevation(lat, lon);
    document.getElementById('lat').value = lat.toFixed(4);
    document.getElementById('lon').value = lon.toFixed(4);
    const regionParts = [place.admin1, place.country].filter(Boolean).join(', ');
    document.getElementById('locationPreview').innerText = '📍 Ausgewählt: ' + place.name + ' (' + regionParts + ')';
    saveState();
}

async function getGPS() {
    if (!navigator.geolocation) { alert("GPS nicht unterstützt."); return; }
    document.getElementById('locationSearch').value = "";
    document.getElementById('locationResultsSelect').style.display = "none";
    navigator.geolocation.getCurrentPosition(async (p) => {
        const lat = parseFloat(p.coords.latitude); const lon = parseFloat(p.coords.longitude);
        checkAndResetElevation(lat, lon);
        document.getElementById('lat').value = lat.toFixed(4);
        document.getElementById('lon').value = lon.toFixed(4);
        document.getElementById('locationPreview').innerText = "Ermittle Ortsname...";
        const placeName = await fetchLocationName(lat, lon);
        document.getElementById('locationPreview').innerText = '📍 GPS: ' + placeName + ' [' + lat.toFixed(4) + ', ' + lon.toFixed(4) + ']';
        saveState();
    }, () => { alert("Standort konnte nicht ermittelt werden."); }, { enableHighAccuracy: true, timeout: 10000 });
}

async function fetchLocationName(lat, lon) {
    try {
        const res = await fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lon + '&zoom=12&addressdetails=1', { headers: { 'Accept-Language': 'de' } });
        const data = await res.json();
        if (data && data.address) {
            const addr = data.address;
            const name = addr.village || addr.town || addr.city || addr.municipality || addr.county || addr.suburb || "";
            const region = addr.state || addr.region || "";
            if (name && region) return name + ' (' + region + ')';
            if (name) return name; if (region) return region;
        }
    } catch(e) {}
    return 'Position (' + lat + ', ' + lon + ')';
}

function getSunTimes(dateStr, lat, lon) {
    const d = new Date(dateStr + 'T12:00:00');
    const rad = Math.PI / 180;
    const day = Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(d.getFullYear(),0,0)) / 86400000);

function scoreRisk({rain, gust, cape, weatherCode, precipProb, visibility, freezingLevel, peakAlt, hour, snowfall, cloudLow, baseElevation}) {

    const reasons = [];
    const hard = [];

    if (gust >= 90) { score += 60; reasons.push('Sturmböen'); hard.push('wind'); }
    else if (gust >= 75) { score += 45; reasons.push('Sehr kräftige Böen'); }
    else if (gust >= 60) { score += 30; reasons.push('Kräftige Böen'); }
    else if (gust >= 50) { score += 15; reasons.push('Böen'); }

    const effectiveRain = rain * (0.55 + 0.45 * Math.min(1, precipProb / 100));
    if (effectiveRain >= 8) { score += 45; reasons.push('Starkregen'); }
    else if (effectiveRain >= 4) { score += 35; reasons.push('Starkregen'); }
    else if (effectiveRain >= 2) { score += 25; reasons.push('Kräftiger Regen'); }
    else if (rain >= 0.15 && precipProb >= 50) { score += 15; reasons.push('Regen'); }
    else if (rain >= 0.15) { score += 8; reasons.push('Niederschlag möglich'); }

    if (snowfall >= 3) { score += 35; reasons.push('Deutlicher Schneefall'); }
    else if (snowfall >= 1) { score += 25; reasons.push('Schneefall'); }
    else if (snowfall > 0.2 && precipProb >= 50) { score += 12; reasons.push('Leichter Schneefall'); }

    if ([95,96,99].includes(Number(weatherCode))) {
        score += 65; reasons.push('Gewittergefahr'); hard.push('thunder');
    } else if (cape >= 1200) {
        score += 40; reasons.push('Hohe Gewitterneigung');
    } else if (cape >= 700) {
        score += 25; reasons.push('Gewitterneigung');
    }

    if (visibility > 0 && visibility < 2000) {
        score += 25; reasons.push('Stark eingeschränkte Sicht');
    } else if (visibility > 0 && visibility < 5000) {
        score += 8; reasons.push('Eingeschränkte Sicht');

function getPressureLevelData(hourly, idx, targetAlt) {
    const levels = [
        {alt:500, t:'temperature_950hPa', w:'wind_speed_950hPa'},
        {alt:800, t:'temperature_925hPa', w:'wind_speed_925hPa'},
        {alt:1000, t:'temperature_900hPa', w:'wind_speed_900hPa'},
        {alt:1500, t:'temperature_850hPa', w:'wind_speed_850hPa'},
        {alt:1900, t:'temperature_800hPa', w:'wind_speed_800hPa'}
    ];
    const available=levels.map(l=>({...l,temp:Number(hourly[l.t]?.[idx]),wind:Number(hourly[l.w]?.[idx])}))
      .filter(x=>Number.isFinite(x.temp)&&Number.isFinite(x.wind));
    if(!available.length || !Number.isFinite(targetAlt)) return null;
    if(targetAlt<=available[0].alt) return {...available[0],alt:targetAlt};
    if(targetAlt>=available[available.length-1].alt) return {...available[available.length-1],alt:targetAlt};
    for(let i=0;i<available.length-1;i++){
      const a=available[i],b=available[i+1];
      if(targetAlt>=a.alt&&targetAlt<=b.alt){
        const f=(targetAlt-a.alt)/(b.alt-a.alt);
        return {alt:targetAlt,temp:a.temp+(b.temp-a.temp)*f,wind:a.wind+(b.wind-a.wind)*f};
      }
    }
    return null;
}

      const reasons=[...new Set(allReasons)].slice(0,3);
      const summary=reasons.length?reasons.join(' · '):(startDt.getHours()>=6 && startDt.getHours()<=20 ? 'Sonnig und trocken' : 'Klar und trocken');
      
      let html = futureWarningHtml + '<div class="location-title">📍 Ziel: ' + locationName + '</div><div class="tour-specs-header">📅 <strong>Datum:</strong> ' + tourDateStr + '<br>⏱️ <strong>Zeitraum:</strong> ' + tourStartStr + ' – ' + tourEndStr + ' Uhr (' + duration + ' Std.)<br>📍 <strong>Ortshöhe:</strong> ' + (locationElevation??'–') + ' m<br>⛰️ <strong>Gipfelhöhe:</strong> ' + (hasPeak?peakAlt+' m':'nicht angegeben') + '</div>';
      html += '<div class="risk-hero risk-' + overall + '"><div class="risk-icon">' + riskIcon(overall) + '</div><div class="risk-title">' + overallLabel + '</div><div class="risk-summary"><strong>Hinweis:</strong> ' + summary + '</div></div>';
      html += '<div class="trend-box ' + trend.cls + '"><strong>Wetterverlauf:</strong> ' + trendText + '</div>';
      
      const cc = confidence.level==='high'?'trend-good':confidence.level==='medium'?'trend-warn':'trend-danger'; 
      html += '<div class="trend-box ' + cc + '"><strong>Modellvergleich:</strong> ' + confidence.label + '<br><span style="font-size:11px">' + confidence.text + '</span><br><span style="font-size:10px">DWD ICON-D2 · ECMWF IFS · GFS</span></div>';
      html += '<div class="sun-text">🌅 Aufgang: <strong>' + sunrise + '</strong> · Untergang: <strong>' + sunset + '</strong> (' + daylight + ' Tageslicht)</div>';
      
      if (showAvalancheLink) html += '<a href="https://lawinen.at/" target="_blank" class="link-button"><span>🏔️ Lawinenwarndienst</span><span>Öffnen ↗</span></a>';
      html += '<a href="https://www.windy.com/?rain,' + lat + ',' + lon + ',10" target="_blank" class="link-button" style="background:#0f766e"><span>🌧️ Live Regenradar & Wind (' + locationName + ')</span><span>Windy ↗</span></a>';
      
      if (uniqueAdvice.length) {
        html += '<div class="warning-box">' + uniqueAdvice.join('<br><br>') + '</div>';
      }
      
      html += slotsHtml;
      html += '<button type="button" class="share-btn" onclick="triggerShare()">🔗 Tour-Wetter teilen</button>';
      html += '<button type="button" class="export-btn" onclick="window.print()">📄 Als PDF / Druckversion speichern</button>';
      html += '<div class="meta-info" style="margin-top:15px">Bergtouren Wetter Ampel · Modelle: DWD ICON-D2, ECMWF IFS, GFS<br><strong>Abrufzeitpunkt der Daten: ' + new Date().toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) + ' Uhr</strong></div>';
      
      document.getElementById('results').innerHTML = html;
      document.getElementById('results').scrollIntoView({behavior:'smooth'});
    } catch(e) {
      console.error(e);
      document.getElementById('results').innerHTML = '<p style="color:red;text-align:center">Fehler beim Laden der Wetterdaten.</p>';
    }
}
</script>
</body>
</html>
