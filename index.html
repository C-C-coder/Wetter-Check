<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bergtouren Wetter Ampel</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.png">
<link rel="icon" href="logo.png" type="image/png">
<style>
:root { --primary: #1e293b; --accent: #10b981; --accent-hover: #059669; --bg: #f8fafc; --card-bg: #ffffff; --border: #e2e8f0; --text: #334155; --text-light: #64748b; }
body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; justify-content: center; }
.container { width: 100%; max-width: 520px; background: var(--card-bg); padding: 22px; border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05); }
.header { text-align: center; margin-bottom: 20px; }
.logo-img { width: 80px; height: 80px; margin-bottom: 10px; border-radius: 50%; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
h1 { color: var(--primary); font-size: 20px; margin: 0; font-weight: 700; }
.card-section { background: #f8fafc; border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 16px; transition: all 0.2s ease; }
.card-section:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(16,185,129,0.1); }
label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 13px; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; }
.row { display: flex; gap: 8px; }
input, select { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; font-size: 14px; background: #fff; color: var(--text); box-sizing: border-box; transition: all 0.2s; }
input:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(16,185,129,0.15); }
.action-btn { background: #3b82f6; color: white; border: none; padding: 0 16px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 13px; white-space: nowrap; transition: background 0.2s; }
.action-btn:hover { background: #2563eb; }
.fav-bar { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.main-btn { background: var(--accent); color: white; border: none; padding: 14px; width: 100%; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(16,185,129,0.2); }
.main-btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
.main-btn:active { transform: translateY(0); }
#results { margin-top: 20px; }
.slot { padding: 14px; margin-bottom: 10px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; gap: 10px; }
.status-green { background: #ecfdf5; border-left: 5px solid #10b981; color: #065f46; }
.status-yellow { background: #fffbeb; border-left: 5px solid #f59e0b; color: #78350f; }
.status-red { background: #fef2f2; border-left: 5px solid #ef4444; color: #7f1d1d; }
.badge { font-weight: 700; padding: 4px 8px; border-radius: 6px; font-size: 11px; white-space: nowrap; background: rgba(0,0,0,0.06); }
.location-title { font-weight: 700; color: var(--primary); margin-bottom: 8px; font-size: 15px; }
.detected-location { font-size: 12px; color: #3b82f6; margin-top: 6px; font-weight: 600; }
.warning-box { background: #fff5f5; border: 1px solid #fecaca; color: #991b1b; padding: 14px; border-radius: 12px; margin-bottom: 12px; font-size: 13px; line-height: 1.5; }
.info-box { background: #f1f5f9; border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; font-size: 13px; color: var(--text); display: flex; justify-content: space-between; align-items: center; }
.info-box-link { text-decoration: none; color: inherit; display: block; transition: transform 0.1s; }
.info-box-link:hover .info-box { background: #e2e8f0; border-color: #cbd5e1; }
.info-box-link:active { transform: scale(0.99); }
.meta-info { margin-top: 20px; font-size: 11px; color: var(--text-light); text-align: center; border-top: 1px solid var(--border); padding-top: 10px; }
.footer-copyright { text-align: center; font-size: 11px; color: var(--text-light); margin-top: 24px; border-top: 1px solid var(--border); padding-top: 12px; }
#locationResultsSelect { display: none; margin-top: 8px; background: #f8fafc; border: 1px solid #3b82f6; }
</style>
</head>
<body>
<div class="container">
<div class="header">
<img src="logo.png" class="logo-img" alt="Logo">
<h1>Bergtouren Wetter Ampel</h1>
</div>
<div class="card-section">
<label>Ort oder Berg suchen:</label>
<div class="row">
<input type="text" id="locationSearch" placeholder="z.B. Schneeberg, Rax, Innsbruck" oninput="clearCoordsIfSearching()">
<button type="button" class="action-btn" onclick="searchLocation()">Suchen</button>
</div>
<div class="fav-bar">
<select id="favoritesDropdown" onchange="loadFavoriteFromDropdown()" style="font-size: 12px; padding: 8px;">
<option value="">⭐ Favoriten wählen...</option>
</select>
<button type="button" class="action-btn" onclick="saveCurrentAsFavorite()" style="background: #10b981; font-size: 12px; padding: 8px 12px;">+ Als Favorit speichern</button>
</div>
<select id="locationResultsSelect" onchange="selectLocationFromDropdown()">
<option value="">-- Bitte Ort auswählen --</option>
</select>
<div id="locationPreview" class="detected-location"></div>
</div>
<div class="card-section">
<label>Oder Koordinaten (Breite, Länge):</label>
<div class="row" style="margin-bottom: 8px;">
<input type="text" id="lat" placeholder="Breite (z.B. 47.4722)" oninput="clearSearchInput()">
<input type="text" id="lon" placeholder="Länge (z.B. 13.6105)" oninput="clearSearchInput()">
</div>
<button type="button" class="action-btn" onclick="getGPS()" style="width: 100%; padding: 10px; background: #64748b;">📍 Aktueller Standort</button>
</div>
<div class="card-section">
<div class="form-group" style="margin-bottom: 12px;">
<label style="display: flex; justify-content: space-between; align-items: center;">
<span>⏱️ Geplante Startzeit:</span>
<button type="button" onclick="setNowTime()" style="background: #e2e8f0; color: var(--text); border: none; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer;">🕒 Jetzt</button>
</label>
<input type="datetime-local" id="startTime" onchange="saveState()">
</div>
<div class="form-group" style="margin-bottom: 0;">
<label>🥾 Geplante Tourendauer:</label>
<select id="duration" onchange="saveState()">
<option value="4">4 Stunden (Halbtag)</option>
<option value="6" selected>6 Stunden (Normal)</option>
<option value="8">8 Stunden (Tagestour)</option>
<option value="10">10 Stunden (Lange Tour)</option>
</select>
</div>
</div>
<button class="main-btn" onclick="analyzeRisk()">Risiko analysieren</button>
<div id="results"></div>
<div class="footer-copyright">&copy; 2026 Christian Camus. Alle Rechte vorbehalten.</div>
</div>
<script>
let foundLocations = [];
let savedFavorites = JSON.parse(localStorage.getItem('bt_favorites') || '[]');

window.addEventListener('DOMContentLoaded', () => {
updateFavoritesDropdown();
const savedSearch = localStorage.getItem('bt_search');
const savedLat = localStorage.getItem('bt_lat');
const savedLon = localStorage.getItem('bt_lon');
const savedStart = localStorage.getItem('bt_start');
const savedDuration = localStorage.getItem('bt_duration');
const savedPreview = localStorage.getItem('bt_preview');
if (savedSearch) document.getElementById('locationSearch').value = savedSearch;
if (savedLat) document.getElementById('lat').value = savedLat;
if (savedLon) document.getElementById('lon').value = savedLon;
if (savedStart) {
document.getElementById('startTime').value = savedStart;
}
if (!document.getElementById('startTime').value) {
setNowTime();
}
if (savedDuration) document.getElementById('duration').value = savedDuration;
if (savedPreview) document.getElementById('locationPreview').innerText = savedPreview;

if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('sw.js').catch(() => {});
}
});

function updateFavoritesDropdown() {
const dropdown = document.getElementById('favoritesDropdown');
dropdown.innerHTML = '<option value="">⭐ Favoriten wählen...</option>';
savedFavorites.forEach((fav, index) => {
const opt = document.createElement('option');
opt.value = index;
opt.text = fav.name;
dropdown.appendChild(opt);
});
}

function saveCurrentAsFavorite() {
const name = document.getElementById('locationSearch').value.trim();
const lat = document.getElementById('lat').value.trim();
const lon = document.getElementById('lon').value.trim();
const preview = document.getElementById('locationPreview').innerText;

if (!name || !lat || !lon) {
alert("Bitte zuerst einen Ort suchen oder Koordinaten eingeben, um ihn als Favorit zu speichern.");
return;
}

const exists = savedFavorites.some(f => f.name === name);
if (!exists) {
savedFavorites.push({ name, lat, lon, preview });
localStorage.setItem('bt_favorites', JSON.stringify(savedFavorites));
updateFavoritesDropdown();
alert(`"${name}" wurde zu den Favoriten hinzugefügt!`);
} else {
alert(`"${name}" ist bereits in den Favoriten gespeichert.`);
}
}

function loadFavoriteFromDropdown() {
const dropdown = document.getElementById('favoritesDropdown');
const index = dropdown.value;
if (index === "") return;

const fav = savedFavorites[index];
document.getElementById('locationSearch').value = fav.name;
document.getElementById('lat').value = fav.lat;
document.getElementById('lon').value = fav.lon;
document.getElementById('locationPreview').innerText = fav.preview || `⭐ Favorit: ${fav.name}`;
document.getElementById('locationResultsSelect').style.display = "none";
saveState();
dropdown.value = "";
}

function setNowTime() {
const now = new Date();
const localIso = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
document.getElementById('startTime').value = localIso;
saveState();
}

function saveState() {
localStorage.setItem('bt_search', document.getElementById('locationSearch').value);
localStorage.setItem('bt_lat', document.getElementById('lat').value);
localStorage.setItem('bt_lon', document.getElementById('lon').value);
localStorage.setItem('bt_start', document.getElementById('startTime').value);
localStorage.setItem('bt_duration', document.getElementById('duration').value);
localStorage.setItem('bt_preview', document.getElementById('locationPreview').innerText);
}

function clearSearchInput() {
document.getElementById('locationSearch').value = "";
document.getElementById('locationResultsSelect').style.display = "none";
saveState();
}

function clearCoordsIfSearching() {
document.getElementById('lat').value = "";
document.getElementById('lon').value = "";
document.getElementById('locationPreview').innerText = "";
saveState();
}

async function searchLocation() {
const query = document.getElementById('locationSearch').value.trim();
const selectBox = document.getElementById('locationResultsSelect');
if (!query) {
alert("Bitte einen Orts- oder Bergname eingeben.");
return;
}
document.getElementById('locationPreview').innerText = "Suche Orte...";
selectBox.style.display = "none";
selectBox.innerHTML = '<option value="">-- Bitte Ort auswählen --</option>';
try {
const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5&language=de`);
const data = await res.json();
if (data.results && data.results.length > 0) {
foundLocations = data.results;
if (foundLocations.length === 1) {
setCoordinates(foundLocations[0]);
} else {
foundLocations.forEach((place, index) => {
const opt = document.createElement('option');
opt.value = index;
const regionParts = [place.admin1, place.country].filter(Boolean).join(', ');
opt.text = `${place.name} (${regionParts}) [${place.latitude.toFixed(2)}, ${place.longitude.toFixed(2)}]`;
selectBox.appendChild(opt);
});
selectBox.style.display = "block";
document.getElementById('locationPreview').innerText = "🔍 Mehrere Treffer gefunden. Bitte wähle den richtigen Ort aus:";
}
} else {
document.getElementById('locationPreview').innerText = "❌ Kein Ort gefunden. Bitte genauer eingeben.";
}
saveState();
} catch(e) {
document.getElementById('locationPreview').innerText = "❌ Fehler bei der Ortssuche.";
}
}

function selectLocationFromDropdown() {
const selectBox = document.getElementById('locationResultsSelect');
const index = selectBox.value;
if (index !== "" && foundLocations[index]) {
setCoordinates(foundLocations[index]);
selectBox.style.display = "none";
}
}

function setCoordinates(place) {
document.getElementById('lat').value = place.latitude.toFixed(4);
document.getElementById('lon').value = place.longitude.toFixed(4);
const regionParts = [place.admin1, place.country].filter(Boolean).join(', ');
document.getElementById('locationPreview').innerText = `📍 Ausgewählt: ${place.name} (${regionParts})`;
saveState();
}

async function getGPS() {
if (!navigator.geolocation) {
alert("GPS wird vom Browser nicht unterstützt.");
return;
}
document.getElementById('locationSearch').value = "";
document.getElementById('locationResultsSelect').style.display = "none";
navigator.geolocation.getCurrentPosition(async (p) => {
const lat = p.coords.latitude.toFixed(4);
const lon = p.coords.longitude.toFixed(4);
document.getElementById('lat').value = lat;
document.getElementById('lon').value = lon;
document.getElementById('locationPreview').innerText = "Ermittle Ortsname...";
const placeName = await fetchLocationName(lat, lon);
document.getElementById('locationPreview').innerText = `📍 Erkannt: ${placeName}`;
saveState();
}, () => {
alert("Standort konnte nicht ermittelt werden.");
}, { enableHighAccuracy: true, timeout: 10000 });
}

async function fetchLocationName(lat, lon) {
try {
const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=12&addressdetails=1`, {
headers: { 'Accept-Language': 'de' }
});
const data = await res.json();
if (data && data.address) {
const addr = data.address;
const name = addr.village || addr.town || addr.city || addr.municipality || addr.county || addr.suburb || "";
const region = addr.state || addr.region || "";
if (name && region) return `${name} (${region})`;
if (name) return name;
if (region) return region;
}
} catch(e) {}
return `Position (${lat}, ${lon})`;
}

function getSunTimes(dateStr) {
const d = new Date(dateStr);
const month = d.getMonth() + 1;
let sunrise = "06:45";
let sunset = "18:00";

if (month === 12) { sunrise = "07:45"; sunset = "16:15"; }
else if (month === 1 || month === 11) { sunrise = "07:30"; sunset = "16:45"; }
else if (month === 2) { sunrise = "07:00"; sunset = "17:30"; }
else if (month === 3 || month === 10) { sunrise = "06:30"; sunset = "18:30"; }
else if (month === 4 || month === 9) { sunrise = "06:15"; sunset = "19:45"; }
else if (month === 5 || month === 8) { sunrise = "05:30"; sunset = "20:30"; }
else if (month >= 6 && month <= 7) { sunrise = "05:00"; sunset = "21:15"; }

return { sunrise, sunset };
}

async function analyzeRisk() {
let lat = document.getElementById('lat').value.trim();
let lon = document.getElementById('lon').value.trim();
const query = document.getElementById('locationSearch').value.trim();
if ((!lat || !lon) && query && document.getElementById('locationResultsSelect').style.display === "none") {
await searchLocation();
lat = document.getElementById('lat').value.trim();
lon = document.getElementById('lon').value.trim();
}
const startTimeStr = document.getElementById('startTime').value;
const duration = parseInt(document.getElementById('duration').value);
if(!lat || !lon || !startTimeStr) {
alert("Bitte gib einen Ort ein oder trage Koordinaten ein.");
return;
}
saveState();
document.getElementById('results').innerHTML = '<p style="text-align:center; color:#64748b;">Ermittle hochauflösende Wetterdaten (ICON-D2)...</p>';
const [datePart, timePart] = startTimeStr.split('T');
let startHour = parseInt(timePart.split(':')[0]);
let startMinute = parseInt(timePart.split(':')[1]);
if (startMinute >= 30) {
startHour += 1;
}
const startDt = new Date(datePart + 'T' + String(startHour).padStart(2, '0') + ':00:00');
const endDt = new Date(startDt.getTime() + (duration + 2) * 3600 * 1000);
const startDateStr = datePart;
const endDateStr = endDt.toISOString().split('T')[0];
const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation,wind_gusts_10m,cape&start_date=${startDateStr}&end_date=${endDateStr}&models=icon_d2&timezone=auto`;
try {
const [weatherRes, locationName] = await Promise.all([
fetch(weatherUrl),
fetchLocationName(lat, lon)
]);
const data = await weatherRes.json();
const hourly = data.hourly;
const targetString = `${startDateStr}T${String(startHour).padStart(2, '0')}:00`;
let startIndex = hourly.time.findIndex(t => t.startsWith(targetString));
if (startIndex === -1) startIndex = 0;

function getRiskForHour(arrayIndex) {
if (arrayIndex >= hourly.time.length) return 'green';
let timeStr = hourly.time[arrayIndex];
let hOnly = parseInt(timeStr.split('T')[1].split(':')[0]);
let rain = hourly.precipitation[arrayIndex];
let gust = hourly.wind_gusts_10m[arrayIndex];
let cape = hourly.cape ? hourly.cape[arrayIndex] : 0;
if ((cape > 500 && hOnly >= 12) || gust > 75) return 'red';
if (rain > 0 || gust > 55) return 'yellow';
return 'green';
}

let tourHasRedRisk = false;
for (let i = 0; i < duration; i++) {
if (getRiskForHour(startIndex + i) === 'red') {
tourHasRedRisk = true;
break;
}
}

let postTourRiskWarning = false;
if (!tourHasRedRisk) {
for (let p = 0; p < 2; p++) {
let checkIndex = startIndex + duration + p;
if (getRiskForHour(checkIndex) === 'red') {
postTourRiskWarning = true;
break;
}
}
}

let html = `<div class="location-title">📍 Ziel: ${locationName} (ICON-D2 Modell)</div>`;

const sunTimes = getSunTimes(startDateStr);
html += `
<div class="info-box">
<span>🌅 Aufgang: <strong>${sunTimes.sunrise}</strong> | 🌇 Untergang: <strong>${sunTimes.sunset}</strong></span>
</div>
`;

// Komplett klickbare Info-Box für den Lawinenwarndienst
html += `
<a href="https://lawinen.at/" target="_blank" class="info-box-link">
<div class="info-box">
<span>🏔️ Übersicht Lawinensituation</span>
<span style="font-weight: 700; color: #3b82f6;">lawinen.at ↗</span>
</div>
</a>
`;

let warningsList = [];

if (postTourRiskWarning) {
warningsList.push("⚠️ <strong>Zeitfenster-Warnung:</strong> Das Wetter wird im Anschluss an deine Tour kritisch!");
}

let slotsHtml = '';
let hasRainOrDrizzle = false;
let hasThunderstormRisk = false;
let slotsCount = 0;

for (let i = 0; i < duration; i++) {
let currentHourIndex = startIndex + i;
if (currentHourIndex >= hourly.time.length) break;
let timeFormatted = hourly.time[currentHourIndex].replace('T', ' ');
let hourOnly = parseInt(hourly.time[currentHourIndex].split('T')[1].split(':')[0]);
let temp = hourly.temperature_2m[currentHourIndex];
let rain = hourly.precipitation[currentHourIndex];
let gust = hourly.wind_gusts_10m[currentHourIndex];
let cape = hourly.cape ? hourly.cape[currentHourIndex] : 0;
let risk = 'green';
let badgeText = 'STABIL';
let reasons = [];

if (cape > 500 && hourOnly >= 12) {
risk = 'red';
reasons.push("Starkes Gewitterrisiko!");
hasThunderstormRisk = true;
} else if (rain > 1.0) {
risk = (risk === 'red') ? 'red' : 'yellow';
reasons.push(`Regenschauer (${rain} mm)`);
hasRainOrDrizzle = true;
} else if (rain > 0) {
risk = (risk === 'red') ? 'red' : 'yellow';
reasons.push(`Leichter Niesel (${rain} mm)`);
hasRainOrDrizzle = true;
}

if (gust > 75) {
risk = 'red';
reasons.push(`Sturmböen (${gust.toFixed(0)} km/h)`);
} else if (gust > 55) {
risk = (risk === 'red') ? 'red' : 'yellow';
reasons.push(`Starker Wind (${gust.toFixed(0)} km/h) - Vorsicht auf Graten und bei exponierten Stellen`);
}

if (reasons.length === 0) {
reasons.push("Wetterverhältnisse unauffällig.");
} else if (risk === 'yellow') {
badgeText = 'ACHTUNG';
} else if (risk === 'red') {
badgeText = 'KRITISCH';
}

let cssClass = 'status-green';
if (risk === 'yellow') cssClass = 'status-yellow';
if (risk === 'red') cssClass = 'status-red';

slotsHtml += `
<div class="slot ${cssClass}">
<div>
<strong>${timeFormatted}</strong><br>
<small>Temp: ${temp}°C | Böen: ${gust} km/h | Regen: ${rain} mm</small><br>
<em>${reasons.join(' | ')}</em>
</div>
<div><span class="badge">${badgeText}</span></div>
</div>
`;
slotsCount++;
}

if (hasThunderstormRisk) {
warningsList.push("⚡ <strong>Gewittergefahr:</strong> Extremes Risiko für Blitzeinschläge und Sturmböen in höheren Lagen und auf exponierten Stellen (Grate, Gipfel) – akute Lebensgefahr!");
}

if (hasRainOrDrizzle) {
warningsList.push("⚠️ <strong>Rutschgefahr:</strong> Nässe am Felsen macht Steige deutlich schwieriger und anspruchsvoller.");
}

if (warningsList.length > 0) {
html += `
<div class="warning-box">
${warningsList.join('<br><br>')}
</div>
`;
}

html += slotsHtml;

if (slotsCount > 0) {
html += `
<div class="meta-info">
Datenquelle: DWD ICON-D2 & OpenStreetMap<br>
Aktualisiert: ${new Date().toLocaleTimeString('de-DE')}
</div>
`;
} else {
html += '<p>Keine Wetterdaten für diesen Zeitraum verfügbar.</p>';
}
document.getElementById('results').innerHTML = html;
} catch(e) {
document.getElementById('results').innerHTML = `<p style="color:red; text-align:center;">Fehler beim Laden der Wetterdaten.</p>`;
}
}
</script>
</body>
</html>
