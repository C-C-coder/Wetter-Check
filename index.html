<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bergtouren Wetter Ampel</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.png">
<link rel="icon" href="logo.png" type="image/png">

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<!-- Leaflet CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

<style>
   :root { 
       --primary: #1e293b; 
       --accent: #10b981; 
       --accent-hover: #059669; 
       --bg: #f8fafc; 
       --card-bg: #ffffff; 
       --border: #e2e8f0; 
       --text: #334155; 
       --text-light: #64748b; 
   }
   
   body { 
       font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
       background: var(--bg); 
       color: var(--text); 
       margin: 0; 
       padding: 15px; 
       display: flex; 
       justify-content: center; 
   }
   
   .container { 
       width: 100%; 
       max-width: 520px; 
       background: var(--card-bg); 
       padding: 20px; 
       border-radius: 24px; 
       box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05); 
   }
   
   .header { 
       text-align: center; 
       margin-bottom: 16px; 
   }
   
   .logo-img { 
       width: 80px; 
       height: 80px; 
       object-fit: contain; 
       margin-bottom: 8px; 
       border-radius: 16px; 
   }
   
   h1 { 
       font-size: 1.3rem; 
       color: var(--primary); 
       margin: 0 0 4px 0; 
   }
   
   .subtitle { 
       font-size: 0.85rem; 
       color: var(--text-light); 
       margin: 0; 
   }
   
   .form-group { 
       margin-bottom: 14px; 
   }
   
   label { 
       display: block; 
       font-size: 0.85rem; 
       font-weight: 600; 
       margin-bottom: 5px; 
       color: var(--primary); 
   }
   
   input, select { 
       width: 100%; 
       padding: 10px 12px; 
       border: 1px solid var(--border); 
       border-radius: 10px; 
       font-size: 0.9rem; 
       box-sizing: border-box; 
       background: #fff; 
       color: var(--text); 
       outline: none; 
       transition: border-color 0.2s; 
   }
   
   input:focus, select:focus { 
       border-color: var(--accent); 
   }
   
   .row { 
       display: flex; 
       gap: 6px; 
   }
   
   .row .form-group { 
       flex: 1; 
   }
   
   .btn { 
       width: 100%; 
       background: var(--accent); 
       color: white; 
       border: none; 
       padding: 12px; 
       border-radius: 12px; 
       font-size: 0.95rem; 
       font-weight: 600; 
       cursor: pointer; 
       transition: background 0.2s; 
       margin-top: 5px; 
   }
   
   .btn:hover { 
       background: var(--accent-hover); 
   }
   
   .btn-push { 
       background: #8b5cf6; 
       margin-top: 8px; 
       display: none; 
   } 
   
   .btn-push:hover { 
       background: #7c3aed; 
   }
   
   .btn-push.active { 
       background: #ef4444; 
   } 
   
   .btn-push.active:hover { 
       background: #dc2626; 
   }
   
   .results { 
       margin-top: 20px; 
       border-top: 1px solid var(--border); 
       padding-top: 15px; 
   }
   
   .warning-box { 
       background: #fff7ed; 
       border-left: 4px solid #f97316; 
       padding: 10px; 
       border-radius: 8px; 
       font-size: 0.85rem; 
       margin-top: 10px; 
       color: #9a3412; 
   }
   
   .share-btn, .export-btn, .map-link-btn { 
       background: var(--primary); 
       color: #fff; 
       margin-top: 8px; 
       border: none; 
       padding: 10px; 
       border-radius: 10px; 
       width: 100%; 
       cursor: pointer; 
       font-weight: 600; 
       font-size: 0.85rem; 
       text-align: center;
       text-decoration: none;
       display: block;
       box-sizing: border-box;
   }
   
   .map-link-btn {
       background: #0284c7;
   }
   .map-link-btn:hover {
       background: #0369a1;
   }

   .link-button { 
       display: flex; 
       justify-content: space-between; 
       align-items: center; 
       background: #e2e8f0; 
       color: var(--primary); 
       text-decoration: none; 
       padding: 10px 12px; 
       border-radius: 10px; 
       font-size: 0.85rem; 
       font-weight: 600; 
       margin-top: 8px; 
   }
   
   .card-section { 
       background: #f8fafc; 
       border: 1px solid var(--border); 
       border-radius: 16px; 
       padding: 15px; 
       margin-bottom: 12px; 
   }
   
   .fav-bar { 
       display: flex; 
       gap: 6px; 
       margin-top: 10px; 
       align-items: center; 
       flex-wrap: wrap; 
   }
   
   .action-btn { 
       background: #3b82f6; 
       color: white; 
       padding: 0 10px; 
       font-size: 13px; 
       white-space: nowrap; 
       border: none; 
       border-radius: 10px; 
       cursor: pointer; 
   }
   
   .detected-location { 
       font-size: 12px; 
       color: #3b82f6; 
       margin-top: 6px; 
       font-weight: 600; 
   }
   
   .advanced-panel { 
       display: none; 
       margin-top: 10px; 
   }
   
   .advanced-toggle { 
       width: 100%; 
       background: #64748b; 
       color: #fff; 
       padding: 10px 12px; 
       border-radius: 11px; 
       font-size: 13px; 
       margin-top: 10px; 
       border: none; 
       cursor: pointer; 
   }
   
   .peak-section { 
       margin-top: 12px; 
   }
   
   .selected-peak { 
       background: #ecfdf5; 
       border: 1px solid #a7f3d0; 
       color: #065f46; 
       padding: 10px; 
       border-radius: 10px; 
       font-size: 12px; 
       margin-top: 8px; 
   }
   
   .small-note { 
       font-size: 11px; 
       color: var(--text-light); 
       line-height: 1.4; 
   }
   
   .clear-small { 
       background: #e2e8f0; 
       color: #334155; 
       padding: 8px 10px; 
       font-size: 11px; 
       border: none; 
       border-radius: 8px; 
       cursor: pointer; 
   }
   
   .tour-grid { 
       display: grid; 
       grid-template-columns: 1fr 1fr; 
       gap: 8px; 
       margin-top: 6px; 
   }
   
   .tour-checkbox { 
       display: flex; 
       align-items: center; 
       gap: 6px; 
       font-size: 13px; 
       background: #fff; 
       padding: 8px 10px; 
       border-radius: 8px; 
       border: 1px solid var(--border); 
       cursor: pointer; 
   }
   
   .tour-checkbox input { 
       width: auto; 
       margin: 0; 
   }
   
   .gpx-box { 
       background: #f0fdf4; 
       border: 1px dashed #10b981; 
       border-radius: 16px; 
       padding: 12px; 
       margin-bottom: 12px; 
       text-align: center; 
   }
   
   .gpx-btn { 
       background: #10b981; 
       color: white; 
       padding: 10px 14px; 
       font-size: 13px; 
       border-radius: 10px; 
       cursor: pointer; 
       display: inline-block; 
       font-weight: 600; 
       border: none; 
   }
   
   .slot { 
       padding: 14px; 
       margin-bottom: 12px; 
       border-radius: 12px; 
       font-size: 13px; 
   }
   
   .status-green { 
       background: #ecfdf5; 
       border-left: 5px solid #10b981; 
       color: #065f46; 
   }
   
   .status-orange { 
       background: #fff7ed; 
       border-left: 5px solid #f59e0b; 
       color: #9a3412; 
   }
   
   .status-red { 
       background: #fef2f2; 
       border-left: 5px solid #ef4444; 
       color: #7f1d1d; 
   }
   
   .weather-split { 
       display: grid; 
       grid-template-columns: 1fr 1fr; 
       gap: 8px; 
       margin: 8px 0; 
       background: rgba(255,255,255,0.6); 
       padding: 8px; 
       border-radius: 8px; 
   }
   
   .weather-split.single-col { 
       grid-template-columns: 1fr; 
   }
   
   .weather-box-title { 
       font-weight: 700; 
       font-size: 11px; 
       text-transform: uppercase; 
       margin-bottom: 4px; 
       color: var(--primary); 
   }
   
   .risk-hero { 
       border-radius: 18px; 
       padding: 18px; 
       margin-bottom: 14px; 
       text-align: center; 
       border: 1px solid var(--border); 
   }
   
   .risk-green { 
       background: #ecfdf5; 
       border-color: #a7f3d0; 
       color: #065f46; 
   }
   
   .risk-orange { 
       background: #fff7ed; 
       border-color: #fdba74; 
       color: #9a3412; 
   }
   
   .risk-red { 
       background: #fef2f2; 
       border-color: #fecaca; 
       color: #7f1d1d; 
   }
   
   .risk-icon { 
       font-size: 34px; 
       line-height: 1.1; 
   }
   
   .risk-title { 
       font-size: 20px; 
       font-weight: 800; 
       margin: 5px 0; 
   }
   
   .risk-summary { 
       font-size: 13px; 
       margin-top: 8px; 
       line-height: 1.4; 
       text-align: left; 
       background: rgba(255,255,255,0.6); 
       padding: 10px; 
       border-radius: 10px; 
   }
   
   .trend-box { 
       margin: 12px 0; 
       padding: 12px; 
       border-radius: 12px; 
       background: #f1f5f9; 
       border: 1px solid var(--border); 
       font-size: 13px; 
       line-height: 1.45; 
   }
   
   .trend-good { 
       border-color: #a7f3d0; 
       background: #ecfdf5; 
       color: #065f46; 
   }
   
   .trend-warn { 
       border-color: #fdba74; 
       background: #fff7ed; 
       color: #9a3412; 
   }
   
   .trend-danger { 
       border-color: #fecaca; 
       background: #fef2f2; 
       color: #7f1d1d; 
   }
   
   .live-tour-box { 
       background: #eff6ff; 
       border: 1px solid #bfdbfe; 
       color: #1e3a8a; 
       padding: 14px; 
       border-radius: 14px; 
       margin-bottom: 12px; 
       font-size: 13px; 
       line-height: 1.45; 
   }
   
   .live-tour-box.live-alert { 
       background: #fff7ed; 
       border-color: #fdba74; 
       color: #9a3412; 
   }
   
   .live-tour-box.live-danger { 
       background: #fef2f2; 
       border-color: #fecaca; 
       color: #7f1d1d; 
   }
   
   .live-tour-head { 
       display: flex; 
       justify-content: space-between; 
       align-items: center; 
       gap: 8px; 
       margin-bottom: 7px; 
   }
   
   .live-dot { 
       display: inline-block; 
       width: 8px; 
       height: 8px; 
       border-radius: 50%; 
       background: #10b981; 
       margin-right: 6px; 
       box-shadow: 0 0 0 3px rgba(16,185,129,.15); 
   }
   
   .live-muted { 
       font-size: 11px; 
       color: #64748b; 
   }
   
   .live-row { 
       display: flex; 
       justify-content: space-between; 
       gap: 8px; 
       margin-top: 5px; 
   }

   #mapModal, #startMapModal, #peakMapModal { 
       display: none; 
       position: fixed; 
       z-index: 1000; 
       left: 0; 
       top: 0; 
       width: 100%; 
       height: 100%; 
       background-color: rgba(0,0,0,0.5); 
       align-items: center; 
       justify-content: center; 
   }
   
   #mapContainerWrapper, #startMapContainerWrapper, #peakMapContainerWrapper { 
       background: #fff; 
       width: 90%; 
       max-width: 500px; 
       height: 450px; 
       border-radius: 16px; 
       display: flex; 
       flex-direction: column; 
       overflow: hidden; 
       box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
   }
   
   #mapElement, #startMapElement, #peakMapElement { 
       flex: 1; 
       width: 100%; 
   }
   
   .map-modal-header { 
       padding: 12px 16px; 
       background: var(--primary); 
       color: white; 
       display: flex; 
       justify-content: space-between; 
       align-items: center; 
       font-weight: 600; 
       font-size: 0.9rem; 
   }
   
   .map-modal-footer { 
       padding: 10px; 
       background: #f8fafc; 
       display: flex; 
       justify-content: flex-end; 
       gap: 8px; 
       border-top: 1px solid var(--border); 
   }
</style>
</head>
<body>
<div class="container">
<div class="header">
   <img src="logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
   <h1>Bergtouren Wetter Ampel</h1>
   <p class="subtitle">Präzise Vorhersagen & Alpine Risiko-Engine</p>
</div>

<!-- GPX Import Section -->
<div class="gpx-box">
   <label style="color:#065f46;margin-bottom:6px">🗺️ Tour aus GPX-Datei laden</label>
   <input type="file" id="gpxFileInput" accept=".gpx" style="display:none" onchange="handleGPXUpload(event)">
   <button type="button" class="gpx-btn" onclick="document.getElementById('gpxFileInput').click()">📂 GPX-Datei auswählen</button>
   <div id="gpxStatus" class="small-note" style="margin-top:6px;color:#047857"></div>
</div>

<div class="card-section">
   <label>📍 Start / Talort</label>
   <div class="row" style="position:relative">
       <input type="text" id="locationSearch" placeholder="z.B. Waldegg, Ramsau, Puchberg" oninput="clearCoordsIfSearching()">
       <button type="button" onclick="clearSearchField()" style="position:absolute;right:175px;top:50%;transform:translateY(-50%);background:transparent;border:none;font-size:16px;color:#94a3b8;cursor:pointer">✖</button>
       <button type="button" class="action-btn" onclick="useCurrentGPS()" style="background:#0284c7;" id="gpsBtn">📍 GPS</button>
       <button type="button" class="action-btn" onclick="searchLocation()">Suchen</button>
   </div>

   <!-- Touren speichern & laden -->
   <div class="fav-bar">
       <select id="favoritesDropdown" onchange="loadFavoriteFromDropdown()" style="font-size:12px;padding:8px;flex:1"><option value="">💾 Gespeicherte Touren laden...</option></select>
       <button type="button" class="action-btn" onclick="saveCurrentAsFavorite()" style="background:#10b981;font-size:12px;padding:8px 10px">+ Speichern</button>
       <button type="button" class="action-btn" onclick="deleteSelectedFavorite()" style="background:#ef4444;font-size:12px;padding:8px 10px">❌ Löschen</button>
   </div>

   <select id="locationResultsSelect" onchange="selectLocationFromDropdown()" style="display:none;margin-top:8px;"><option value="">-- Bitte Ort auswählen --</option></select>
   <div id="locationPreview" class="detected-location"></div>

   <button type="button" class="advanced-toggle" onclick="openStartMapModal()">🗺️ auf Karte auswählen</button>

   <div id="advancedLocation" class="advanced-panel" style="display:none;">
       <input type="hidden" id="lat">
       <input type="hidden" id="lon">
       <input type="hidden" id="start_lat">
       <input type="hidden" id="start_lon">
       <input type="hidden" id="gpxUrlParam" value="">
   </div>
</div>

<!-- Startpunkt Karten-Modal -->
<div id="startMapModal">
   <div id="startMapContainerWrapper">
       <div class="map-modal-header">
           <span>Startpunkt auf Karte auswählen</span>
           <button type="button" onclick="closeStartMapModal()" style="background:transparent;border:none;color:white;font-size:16px;cursor:pointer;">✖</button>
       </div>
       <div id="startMapElement"></div>
       <div class="map-modal-footer">
           <button type="button" class="clear-small" onclick="closeStartMapModal()">Abbrechen</button>
           <button type="button" class="action-btn" onclick="confirmStartMapSelection()" style="background:#10b981;">Punkt übernehmen</button>
       </div>
   </div>
</div>

<!-- Gipfel Karten-Modal -->
<div id="peakMapModal">
   <div id="peakMapContainerWrapper">
       <div class="map-modal-header">
           <span>Gipfel auf Karte auswählen</span>
           <button type="button" onclick="closePeakMapModal()" style="background:transparent;border:none;color:white;font-size:16px;cursor:pointer;">✖</button>
       </div>
       <div id="peakMapElement"></div>
       <div class="map-modal-footer" style="display:flex;justify-content:space-between;align-items:center;">
           <span id="peakMapHint" style="font-size:11px;color:var(--text-light);">Klicke auf einen Gipfel oder eine freie Stelle.</span>
           <div>
               <button type="button" class="clear-small" onclick="closePeakMapModal()">Abbrechen</button>
           </div>
       </div>
   </div>
</div>

<div class="card-section peak-section">
   <label>⛰️ Gipfel / Ziel (optional)</label>
   <div id="peakSelected" class="selected-peak" style="display:none"></div>
   <div id="peakSearchHint" class="small-note">Startort wählen oder Karte öffnen.</div>
   <select id="peakDropdown" onchange="selectPeakFromDropdown()" style="margin-top:8px;display:none"><option value="">-- Gipfel auswählen --</option></select>
   <div id="peakLoading" class="small-note" style="display:none;color:#059669;margin-top:6px;">⛰️ Suche Gipfel in der Umgebung …</div>
   <div class="row" style="margin-top:8px;">
       <button type="button" id="peakSearchBtn" class="action-btn" onclick="searchMountainsAroundStart()" style="display:none;"></button>
       <button type="button" id="peakMapBtn" class="action-btn" onclick="openPeakMapModal()" style="width:100%;padding:10px;background:#0284c7;">🗺️ Gipfel auf Karte auswählen</button>
   </div>
</div>

<div class="card-section">
   <label>🥾 Tourart (Mehrfachauswahl möglich)</label>
   <div class="tour-grid">
       <label class="tour-checkbox"><input type="checkbox" name="tourType" value="hiking" onchange="saveState()"> Wanderung</label>
       <label class="tour-checkbox"><input type="checkbox" name="tourType" value="klettersteig" onchange="saveState()"> Klettersteig</label>
       <label class="tour-checkbox"><input type="checkbox" name="tourType" value="hochtour" onchange="saveState()"> Hochtour</label>
       <label class="tour-checkbox"><input type="checkbox" name="tourType" value="grat" onchange="saveState()"> Gratwanderung</label>
       <label class="tour-checkbox"><input type="checkbox" name="tourType" value="gletscher" onchange="saveState()"> Gletschertour</label>
       <label class="tour-checkbox"><input type="checkbox" name="tourType" value="klettern" onchange="saveState()"> Felskletterei</label>
       <label class="tour-checkbox"><input type="checkbox" name="tourType" value="ski" onchange="saveState()"> Schitour</label>
   </div>
</div>

<div class="card-section">
   <div class="form-group" style="margin-bottom:12px">
       <label style="display:flex;justify-content:space-between;align-items:center">
           <span>⏱️ Geplante Startzeit:</span>
           <button type="button" onclick="setNowTime()" style="background:#e2e8f0;color:var(--text);border:none;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;">🕒 Jetzt</button>
       </label>
       <input type="datetime-local" id="startTime" onchange="saveState()">
   </div>
   <div class="form-group">
       <label>🥾 Geplante Tourendauer:</label>
       <select id="duration" onchange="saveState()">
           <option value="4">4 Stunden (Halbtag)</option>
           <option value="6" selected>6 Stunden (Normal)</option>
           <option value="8">8 Stunden (Tagestour)</option>
           <option value="10">10 Stunden (Lange Tour)</option>
           <option value="12">12 Stunden (Sehr lange Tour)</option>
       </select>
   </div>
</div>

<button class="btn" onclick="analyzeRisk()">Wetter abfragen</button>
<button type="button" id="updateGpsBtn" class="action-btn" onclick="manualUpdateLiveGPS()" style="background:#3b82f6;margin-top:8px;width:100%;padding:10px;font-weight:600;display:none;">📍 Live-Standort für Tour aktualisieren</button>
<button type="button" id="pushToggleBtn" class="btn btn-push" onclick="toggleTourPush()">Push Benachrichtigungen für die Tour aktivieren</button>

<div id="pushStatusInfo" class="small-note" style="margin-top:8px;padding:10px;background:#f1f5f9;border-radius:10px;border:1px solid var(--border);display:none;"></div>

<div id="results" class="results"></div>
<div class="footer-copyright" style="text-align:center;font-size:11px;color:var(--text-light);margin-top:20px">© 2026 Christian Camus. Alle Rechte vorbehalten.</div>
</div>

<script>
// --- Firebase Initialisierung ---
const firebaseConfig = {
apiKey: "AIzaSyADlL7BKaVPgdCH6xSqWEjVqf54q33E9WE",
authDomain: "wetter-check.firebaseapp.com",
projectId: "wetter-check",
storageBucket: "wetter-check.firebasestorage.app",
messagingSenderId: "184488061652",
appId: "1:184488061652:web:dda3d879ff8cfd36d6e941"
};

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let messaging = null;

if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('./firebase-messaging-sw.js')
.then((registration) => {
   messaging = firebase.messaging(app);
   messaging.useServiceWorker(registration);
   messaging.onMessage((payload) => {
       if (payload.notification) {
           if ('Notification' in window && Notification.permission === 'granted') {
               navigator.serviceWorker.ready.then(reg => {
                   reg.showNotification(payload.notification.title, { body: payload.notification.body, icon: 'logo.png', data: payload.data });
               });
           }
       }
   });
}).catch((err) => {
   console.error('Service Worker Registrierung fehlgeschlagen:', err);
});
}

// --- Push-Status & Live-GPS Button Update ---
function updatePushStatusUI() {
const infoBox = document.getElementById('pushStatusInfo');
const btn = document.getElementById('pushToggleBtn');
const gpsBtn = document.getElementById('updateGpsBtn');
const isActive = localStorage.getItem('tour_push_active') === 'true';
const tourTitle = localStorage.getItem('tour_push_title') || 'Aktuelle Tour';
const startTime = localStorage.getItem('tour_push_start') || '';

if (isActive) {
   btn.classList.add('active');
   btn.innerText = 'Push Benachrichtigungen für die Tour deaktivieren';
   gpsBtn.style.display = 'block';
   infoBox.style.display = 'block';
   infoBox.innerHTML = `🔔 <strong>Push-Benachrichtigungen aktiv</strong> für: <em>${tourTitle}</em> (Start: ${startTime ? startTime.replace('T', ' ') : '–'})<br><span style="color:#64748b;">ℹ️ Stündliche Updates & Unwetter-Warnungen aktiv.</span><br><button type="button" class="action-btn" onclick="loadActiveTourFromCloud()" style="margin-top:8px;background:#0284c7;font-size:12px;padding:6px 10px;">aktive Tour laden</button>`;
} else {

async function loadActiveTourFromCloud() {

// --- Robuste Gipfelsuche (Overpass API) ---
async function searchMountainsAroundStartSilent() {
const lat = parseFloat(document.getElementById('lat').value);
const lon = parseFloat(document.getElementById('lon').value);
if (isNaN(lat) || isNaN(lon)) return;

const radius = 15000;
const query = `[out:json][timeout:15];
              node["natural"="peak"](around:${radius},${lat},${lon});
              out body 100;`;

try {
   const res = await fetch('https://overpass-api.de/api/interpreter', {
       method: 'POST',
       body: "data=" + encodeURIComponent(query),
       headers: { 'Content-type': 'application/x-www-form-urlencoded' }
   });
   const data = await res.json();
   
   let rawPeaks = data.elements
       .filter(el => el.tags && el.tags.name)
       .map(el => {
           return {
               name: el.tags.name,
               alt: el.tags.ele ? parseInt(el.tags.ele) : null,
               lat: el.lat,
               lon: el.lon,
               distance: getDistance(lat, lon, el.lat, el.lon)
           };
       });
   peakCandidates = rawPeaks.sort((a, b) => a.distance - b.distance);
} catch (e) {
   console.error("Fehler bei der stillen Overpass Gipfelsuche", e);
}
}

function getSelectedTourTypes() {

function setSelectedTourTypes(arr) {

function getDistance(a,b,c,d){
const R=6371;
const dl=(c-a)*Math.PI/180;
const dn=(d-b)*Math.PI/180;
const x=Math.sin(dl/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dn/2)**2;
return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// --- GPX Import ---
function handleGPXUpload(event) {
const file = event.target.files[0];
if (!file) return;
const status = document.getElementById('gpxStatus');
status.innerText = 'Lese GPX ...';

const gpxBlobUrl = URL.createObjectURL(file);
document.getElementById('gpxUrlParam').value = gpxBlobUrl;

const reader = new FileReader();
reader.onload = async function(e) {
   try {
       const xmlDoc = new DOMParser().parseFromString(e.target.result, "text/xml");
       const pts = xmlDoc.querySelectorAll("trkpt, wpt");
       if (!pts.length) {
           status.innerText = '❌ Keine Punkte in GPX.';
           return;
       }
       const sLat = parseFloat(pts[0].getAttribute("lat"));
       const sLon = parseFloat(pts[0].getAttribute("lon"));
       document.getElementById('lat').value = sLat.toFixed(5);
       document.getElementById('lon').value = sLon.toFixed(5);
       document.getElementById('start_lat').value = sLat.toFixed(5);
       document.getElementById('start_lon').value = sLon.toFixed(5);
       
       try {
           const rRev = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${sLat}&lon=${sLon}`);
           const dRev = await rRev.json();
           const placeName = dRev.address.village || dRev.address.town || dRev.address.city || dRev.address.municipality || 'GPX Startort';
           document.getElementById('locationSearch').value = placeName;
           document.getElementById('locationPreview').innerText = '📍 GPX Start: ' + placeName;
       } catch(err) {
           document.getElementById('locationSearch').value = 'GPX Startort';
       }
       
       let maxEle = -Infinity, pLat = null, pLon = null;
       pts.forEach(pt => {
           const el = pt.querySelector("ele");
           if (el) {
               const val = parseFloat(el.textContent);
               if (val > maxEle) {
                   maxEle = val;
                   pLat = parseFloat(pt.getAttribute("lat"));
                   pLon = parseFloat(pt.getAttribute("lon"));
               }
           }
       });
       
       if (maxEle !== -Infinity && pLat !== null) {
           let peakName = "Höchster Punkt";
           try {
               const nomRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=peak+near+${pLat},${pLon}&limit=1`);
               if (nomRes.ok) {
                   const nomData = await nomRes.json();
                   if (nomData && nomData.length > 0) {
                       peakName = nomData[0].display_name.split(',')[0];
                   }
               }
           } catch(err) {}

           selectedPeak = { name: peakName, alt: Math.round(maxEle), lat: pLat, lon: pLon };
           renderSelectedPeak();
       }
       status.innerText = '✅ GPX erfolgreich geladen!';
       saveState();
       searchMountainsAroundStart();
   } catch (err) {
       status.innerText = '❌ Fehler beim Lesen.';
   }
};
reader.readAsText(file);
}

if (isNaN(lat) || isNaN(lon)) return;

const loading = document.getElementById('peakLoading');
const sel = document.getElementById('peakDropdown');
const hint = document.getElementById('peakSearchHint');

loading.style.display = 'block';
sel.style.display = 'none';
hint.innerText = `Suche Gipfel im Umkreis von 15 km (Overpass API)…`;

const radius = 15000;
const query = `[out:json][timeout:15];
              node["natural"="peak"](around:${radius},${lat},${lon});
              out body 100;`;

try {
   const res = await fetch('https://overpass-api.de/api/interpreter', {
       method: 'POST',
       body: "data=" + encodeURIComponent(query),
       headers: { 'Content-type': 'application/x-www-form-urlencoded' }
   });
   const data = await res.json();
   
   let rawPeaks = data.elements
       .filter(el => el.tags && el.tags.name)
       .map(el => {
           return {
               name: el.tags.name,
               alt: el.tags.ele ? parseInt(el.tags.ele) : null,
               lat: el.lat,
               lon: el.lon,
               distance: getDistance(lat, lon, el.lat, el.lon)
           };
       });

   const missingEle = rawPeaks.filter(p => !p.alt);
   if (missingEle.length > 0) {
       try {
           const lats = missingEle.map(p => p.lat.toFixed(5)).join(',');
           const lons = missingEle.map(p => p.lon.toFixed(5)).join(',');
           const elR = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lats}&longitude=${lons}`);
           if (elR.ok) {
               const elD = await elR.json();
               const elevs = Array.isArray(elD.elevation) ? elD.elevation : [elD.elevation];
               missingEle.forEach((p, idx) => {
                   if (elevs[idx] !== undefined && elevs[idx] !== null) {
                       p.alt = Math.round(elevs[idx]);
                   }
               });
           }
       } catch (e) {}
   }

   loading.style.display = 'none';
   peakCandidates = rawPeaks.sort((a, b) => a.distance - b.distance);
   renderPeakOptions(peakCandidates, 15);
       
} catch (e) {
   console.error("Gipfel-Suche fehlgeschlagen", e);
   loading.style.display = 'none';
   hint.innerText = "Fehler bei der geographischen Gipfelsuche.";
}
}

}

{name:'N',lat:1,lon:0},{name:'NO',lat:.7071,lon:.7071},{name:'O',lat:0,lon:1},

function liveFormatTime(iso){

function liveDirectionName(name){

function liveDistancePoint(lat,lon,dir,km=8){
const dLat=(km/111.32)*dir.lat;
const dLon=(km/(111.32*Math.max(.2,Math.cos(lat*Math.PI/180))))*dir.lon;
return [lat+dLat,lon+dLon];
}

async function fetchGeoSphereNowcast(lat,lon){
const url='https://dataset.api.hub.geosphere.at/v1/timeseries/forecast/nowcast-v1-15min-1km?lat_lon='+
encodeURIComponent(lat.toFixed(5)+','+lon.toFixed(5))+
'&parameters=rr&forecast_offset=0&output_format=geojson';
const r=await fetch(url,{cache:'no-store'});
if(!r.ok)throw new Error('GeoSphere Nowcast HTTP '+r.status);
return r.json();
}

async function fetchGeoSphereNowcastPoints(points){
const url='https://dataset.api.hub.geosphere.at/v1/timeseries/forecast/nowcast-v1-15min-1km?'+
points.map(p=>'lat_lon='+encodeURIComponent(p.lat.toFixed(5)+','+p.lon.toFixed(5))).join('&')+
'&parameters=rr&forecast_offset=0&output_format=geojson';
const r=await fetch(url,{cache:'no-store'});
if(!r.ok)throw new Error('GeoSphere Nowcast HTTP '+r.status);
return r.json();
}

function parseGeoSphereSeries(data){
const f=data?.features?.[0];
const p=f?.properties?.parameters?.rr;
if(!p) return {times:[],values:[]};
return {times:p.timestamps||p.time||[],values:p.data||[]};
}

function parseGeoSpherePointSeries(data,index){
const f=data?.features?.[index];
const p=f?.properties?.parameters?.rr;
if(!p) return {times:[],values:[]};
return {times:p.timestamps||p.time||[],values:p.data||[]};
}

async function fetchLiveCenter(lat,lon){
const currentUrl='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+
'&current=temperature_2m,apparent_temperature,precipitation,rain,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m'+
'&timezone=auto&wind_speed_unit=kmh';
const [c,n]=await Promise.all([
   fetch(currentUrl,{cache:'no-store'}),
   fetchGeoSphereNowcast(lat,lon).catch(()=>null)
]);
if(!c.ok)throw new Error('Live-Wetter HTTP '+c.status);
const current=(await c.json()).current||{};
const nc=n?parseGeoSphereSeries(await n.json()):{times:[],values:[]};
return {current,nc};
}

async function fetchLiveDirectionSamples(lat,lon){
const points=[];
LIVE_DIRS.forEach(d=>{
   [4,8].forEach(km=>{
       const [pLat,pLon]=liveDistancePoint(lat,lon,d,km);
       points.push({dir:d.name,km,lat:pLat,lon:pLon});
   });
});
const j=await fetchGeoSphereNowcastPoints(points);
let thunder=[];
try {
   const u='https://api.open-meteo.com/v1/forecast?latitude='+points.map(p=>p.lat.toFixed(5)).join(',')+
   '&longitude='+points.map(p=>p.lon.toFixed(5)).join(',')+
   '&hourly=weather_code&forecast_hours=4&timezone=UTC';
   const r=await fetch(u,{cache:'no-store'});
   if(r.ok){
       const x=await r.json(); 
       thunder=Array.isArray(x)?x:[x];
   }
} catch(e) {
   thunder=[];
}
return points.map((p,i)=>{
   const nc=parseGeoSpherePointSeries(j,i);
   const wx=thunder[i]?.hourly||{};
   return {...p,nc,wx,thunderAt(time){
       const ts=wx.time||[]; 
       const codes=wx.weather_code||[];
       if(!time||!ts.length) return false;
       const target=new Date(time).getTime(); 
       let best=-1,bestDiff=Infinity;
       for(let k=0;k<ts.length;k++){
           const diff=Math.abs(new Date(ts[k]).getTime()-target);
           if(diff<bestDiff){bestDiff=diff;best=k;}
       }
       return best>=0 && bestDiff<=90*60000 && [95,96,99].includes(Number(codes[best]));
   }};
}).filter(s=>s.nc.times.length);
}

function getRainDescription(amount) {
if (amount < 0.2) return "Nieselregen";
if (amount < 2.0) return "leichter Regen";
if (amount < 6.0) return "moderater Regen";
return "starker Regen";
}

function liveFindOnset(series, threshold=0.08) {
for(let i=0;i<series.values.length;i++){
   const v=Number(series.values[i]||0);
   const next=Number(series.values[i+1]||0);
   if(v>=threshold && (next>=threshold || i===series.values.length-1)){
       return {idx:i,time:series.times?.[i],amount:v};
   }
}
return null;
}

function liveFindArrival(centerSeries,samples){
let threshold = 0.08;
let centerOnset = liveFindOnset(centerSeries, threshold);
if (!centerOnset) {
   threshold = 0.02; 
   centerOnset = liveFindOnset(centerSeries, threshold);
}

if(centerOnset){
   return {kind:'now',time:centerOnset.time,direction:null,amount:centerOnset.amount,confidence:'hoch'};
}
const grouped={};
samples.forEach(s=>{(grouped[s.dir] ||= {})[s.km]=s;});
const candidates=[];

Object.keys(grouped).forEach(dir=>{
   const s4=grouped[dir][4], s8=grouped[dir][8];
   if(!s4||!s8) return;
   
   let o4=liveFindOnset(s4.nc,0.08), o8=liveFindOnset(s8.nc,0.08);
   if (!o4 || !o8) {
        o4=liveFindOnset(s4.nc,0.02);
        o8=liveFindOnset(s8.nc,0.02);
   }

   if(!o4||!o8||!o4.time||!o8.time) return;
   const t4=new Date(o4.time).getTime(), t8=new Date(o8.time).getTime();
   const dt=t4-t8;
   
   if(dt<=0 || dt<15*60000 || dt>180*60000) return;
   
   const speedKmh=4/(dt/3600000);
   if(speedKmh<2 || speedKmh>100) return;
   
   const etaMs=t4-(4/speedKmh)*3600000;
   const now=Date.now();
   
   if(etaMs<now-15*60000 || etaMs>now+3*3600000) return;
   
   const thunder = Boolean(s4.thunderAt?.(o4.time) || s8.thunderAt?.(o4.time));
   candidates.push({
       kind:'incoming',time:new Date(etaMs).toISOString(),direction:dir,
       amount:Math.max(o4.amount,o8.amount),speedKmh,confidence:'hoch',thunder,
       source4:o4.time,source8:o8.time
   });
});

if(!candidates.length){
   const fallback=[];
   Object.keys(grouped).forEach(dir=>{
       const s4=grouped[dir][4];
       if(!s4) return;
       let o4=liveFindOnset(s4.nc,0.08);
       if (!o4) o4=liveFindOnset(s4.nc,0.02);
       if(!o4||!o4.time) return;
       const mins=Math.round((new Date(o4.time)-new Date())/60000);
       if(mins>=0 && mins<=120){
           fallback.push({kind:'incoming',time:o4.time,direction:dir,amount:o4.amount,confidence:'mittel',thunder:Boolean(s4.thunderAt?.(o4.time))});
       }
   });
   if(!fallback.length) return null;
   fallback.sort((a,b)=>new Date(a.time)-new Date(b.time));
   return fallback[0];
}

candidates.sort((a,b)=>new Date(a.time)-new Date(b.time));
return candidates[0];
}

   if(arrival){

               liveLastAlertKey=key;

           liveShowStatus(html,thunder?'live-danger':'live-alert');
       }else{

           let windowMin = Math.max(0, mins - 10);

           const key=arrival.direction+'-'+arrival.time.slice(0,16);

}

function startLiveTourWeather(){
if(!liveIsTourWindow()) return;
liveTourActive=true;
liveRequestNotificationPermission();
liveCreateBox();

if(liveGpsWatch===null && navigator.geolocation){
   liveGpsWatch=navigator.geolocation.watchPosition(pos=>{
       liveLastPosition = {lat: pos.coords.latitude, lon: pos.coords.longitude};
       if(Date.now()-liveLastUpdate>120000){
           updateLiveTourWeather();
       }
   },err=>{},{enableHighAccuracy:true,maximumAge:10000,timeout:15000});
}

updateLiveTourWeather();
clearInterval(liveTourTimer);
liveTourTimer=setInterval(updateLiveTourWeather,5*60*1000);
}

function stopLiveTourWeather(){
liveTourActive=false;
clearInterval(liveTourTimer); 
liveTourTimer=null;
clearTimeout(liveStartTimer); 
liveStartTimer=null;

if(liveGpsWatch!==null && navigator.geolocation){
   navigator.geolocation.clearWatch(liveGpsWatch);
   liveGpsWatch=null;
}

const box=document.getElementById('liveTourBox');
if(box) box.remove();
}

function scheduleLiveTourWeather(){
stopLiveTourWeather();
const startStr=document.getElementById('startTime').value;
const duration=Number(document.getElementById('duration').value||0);
if(!startStr||!duration) return;

const start=new Date(startStr);
const now=new Date();
const delay=start-now;

if(delay<=0 && liveIsTourWindow()) {
   startLiveTourWeather();
} else if(delay>0 && delay<2147483647){
   liveStartTimer=setTimeout(startLiveTourWeather,delay);
}
}

function evaluateZoneRisk(weather, tourTypes, isPeak, month) {
let score = 0;
let reasons = [];
const isExposed = tourTypes.some(t=>['klettersteig','grat','hochtour','gletscher','klettern'].includes(t));
const isKlettersteigOrClimb = tourTypes.some(t=>['klettersteig','klettern'].includes(t));
const isHochtourOrGlacier = tourTypes.some(t=>['hochtour','gletscher'].includes(t));

const isThunder = [95,96,99].includes(weather.code) || (weather.cape >= 1000 && weather.prob >= 30);
if (isThunder && isKlettersteigOrClimb) {
   return { score: 100, reasons: ['⚡ Gewittergefahr am Klettersteig/Fels (Absolutes Risiko/ Drahtseile!)'] };
} else if (isThunder) {
   score += 70; 
   reasons.push('Gewittergefahr');
}

if (weather.rain >= 2.0 && (isKlettersteigOrClimb || isHochtourOrGlacier)) {
   return { score: 90, reasons: ['🌧️ Starker Regen bei Klettersteig/Hochtour (Extremer Nässe- & Absturzfaktor!)'] };
}

if (weather.wetRock && (isKlettersteigOrClimb || tourTypes.includes('grat'))) {
   score += 45;
   reasons.push(isPeak ? 'Feuchter Fels in exponierter Lage (Rutschgefahr)' : 'Fels durch Vorniederschlag noch nass');
}

const windFactor = isExposed ? 1.4 : 1.0;
if (weather.gust >= 80) { score += 55 * windFactor; reasons.push('Sturmböen'); }
else if (weather.gust >= 60) { score += 35 * windFactor; reasons.push('Kräftige Böen'); }
else if (weather.gust >= 45) { score += 20 * windFactor; reasons.push('Böen'); }

if (weather.rain >= 4) { score += 40; reasons.push('Starkregen'); }
else if (weather.rain >= 1) { score += 25; reasons.push('Regen'); }
else if (weather.prob >= 60 && weather.rain < 0.2) { score += 15; reasons.push('Hohe Schauerneigung'); }

if (weather.snow >= 2) { score += 35; reasons.push('Schneefall'); }
if (weather.ice) { score += 35; reasons.push('Vereisung / Glatteis'); }

if ((weather.vis > 0 && weather.vis < 2000) || [45,48].includes(weather.code)) {
   score += 25; reasons.push('Eingeschränkte Sicht / Nebel');
}

const finalScore = Math.min(100, Math.round(score));
let level = 'Niedrig';
if (finalScore >= 60) level = 'Hoch';
else if (finalScore >= 30) level = 'Mäßig';

return { score: finalScore, level: level, reasons: [...new Set(reasons)] };
}

function tourWarnings(weather, tourTypes, isPeak) {
const a = [];
const isKlettersteigOrClimb = tourTypes.some(t=>['klettersteig','klettern'].includes(t));
const isThunder = [95,96,99].includes(weather.code) || (weather.cape >= 1000 && weather.prob >= 30);

if (weather.wetRock && isKlettersteigOrClimb) {
   a.push('⚠️ <strong>Nasser Fels:</strong> Rutschig. Erhöhte Absturzgefahr!');
}
if (isThunder && isKlettersteigOrClimb) {
   a.push('⚡ <strong>Lebensgefahr am Klettersteig:</strong> Drahtseile wirken wie Blitzableiter!');
} else if (isThunder) {
   a.push('⚡ <strong>Gewittergefahr:</strong> Exponierte Bereiche meiden.');
}
if (weather.gust >= 50 && isKlettersteigOrClimb) {
   a.push('💨 <strong>Wind an Geländekanten:</strong> Erhöhtes Sturzrisiko.');
}
if ((weather.vis > 0 && weather.vis < 2000) || [45,48].includes(weather.code)) {
   a.push('👁️ <strong>Sichtwarnung:</strong> Nebel schränkt Orientierung ein.');
}
if (weather.ice) {
   a.push('🧊 <strong>Glatteis:</strong> Gefrierende Nässe.');
}
return a;
}

function conditionHint(d){
if([95,96,99].includes(d.code)) return 'Gewittergefahr';
if(d.snow>=1) return 'Schneefall';
if(d.rain>=4) return 'Starkregen';
if(d.rain>=.1) return 'Regen / Nässe';
if(d.gust>=60) return 'Kräftige Böen';
if([45,48].includes(d.code) || (d.vis>0&&d.vis<2000)) return 'Nebel / Schlechte Sicht';
if(d.prob>=60) return 'Hohe Schauerneigung';
return 'Trocken / Stabil';
}

// STATE-OF-THE-ART Multi-Modell Analyse (Dynamischer Ensemble-Vergleich)
function calculateRealModelConfidence(h, startIndex, duration) {
let totalScore = 0;
let validHours = 0;

for (let i = 0; i < duration; i++) {
   const idx = startIndex + i;
   if (idx >= h.time.length) break;

   // Dynamisch verfügbare Modelle für den jeweiligen Zeitpunkt auslesen
   const temps = [h.temperature_2m_icon_d2?.[idx], h.temperature_2m_ecmwf_ifs04?.[idx], h.temperature_2m_gfs_seamless?.[idx]].filter(v => typeof v === 'number' && Number.isFinite(v));
   const tempDiff = temps.length > 1 ? (Math.max(...temps) - Math.min(...temps)) : 0;
   // Praxisschwelle: Bis 1.5°C Differenz völlig normal, darüber Punkteabzug
   let tempScore = Math.max(0, 100 - (Math.max(0, tempDiff - 1.5) * 15));

   const rains = [h.precipitation_icon_d2?.[idx], h.precipitation_ecmwf_ifs04?.[idx], h.precipitation_gfs_seamless?.[idx]].filter(v => typeof v === 'number' && Number.isFinite(v));
   const rainDiff = rains.length > 1 ? (Math.max(...rains) - Math.min(...rains)) : 0;
   // Praxisschwelle: Konvektiver Niederschlag streut; erst Abweichungen > 0.5mm/h gewichten
   let rainScore = Math.max(0, 100 - (Math.max(0, rainDiff - 0.5) * 12));

   const winds = [h.wind_speed_10m_icon_d2?.[idx], h.wind_speed_10m_ecmwf_ifs04?.[idx], h.wind_speed_10m_gfs_seamless?.[idx]].filter(v => typeof v === 'number' && Number.isFinite(v));
   const windDiff = winds.length > 1 ? (Math.max(...winds) - Math.min(...winds)) : 0;
   // Praxisschwelle: Bis 10 km/h Abweichung im Gebirge gewöhnlich
   let windScore = Math.max(0, 100 - (Math.max(0, windDiff - 10) * 2));

   if(temps.length > 1 || rains.length > 1 || winds.length > 1) {
       totalScore += (tempScore * 0.3) + (rainScore * 0.4) + (windScore * 0.3);
       validHours++;
   }
}

// Fallback bei nur 1 verfügbaren Modell (z.B. weit in der Zukunft)
const finalPct = validHours > 0 ? Math.round(totalScore / validHours) : 85;

let text = "Sehr gute Modellübereinstimmung für diesen Zeitraum.";
if (finalPct < 80) text = "Leichte Unsicherheiten in der Prognose (Modelle weichen ab).";
if (finalPct < 60) text = "Hohe Unsicherheit! Wettermodelle sind sich uneinig. Lokales Nowcasting zwingend beachten!";

return { pct: finalPct, text: text };
}

function windDir(deg){
if(!Number.isFinite(deg)) return '–';
const dirs=['N','NO','O','SO','S','SW','W','NW'];
return dirs[Math.round(deg/45)%8];
}

// ==========================================
// HAUPT-ANALYSE FUNKTION
// ==========================================
async function analyzeRisk(){
const lat = Number(document.getElementById('start_lat').value) || Number(document.getElementById('lat').value);
const lon = Number(document.getElementById('start_lon').value) || Number(document.getElementById('lon').value);
const startStr = document.getElementById('startTime').value;
const duration = Number(document.getElementById('duration').value);
const selectedTourTypes = getSelectedTourTypes();
let peak = getPeakData();

if(!Number.isFinite(lat) || !Number.isFinite(lon) || !startStr){
   alert('Bitte Startort und Startzeit angeben.');
   return;
}

document.getElementById('results').innerHTML = '<div class="loading" style="text-align:center;padding:15px;color:#64748b;">🌦️ Alpine Risiko-Engine berechnet Tal- & Gipfel-Werte …</div>';

const startDt = new Date(startStr);
const endDt = new Date(startDt.getTime()+duration*3600000);
const tourMonth = startDt.getMonth();
const isSummer = (tourMonth >= 5 && tourMonth <= 7);
const isWinterSeason = (tourMonth >= 10 || tourMonth <= 4);
const startHour = startDt.getHours();
const isHighTourOrGlacier = selectedTourTypes.some(t => ['hochtour', 'gletscher'].includes(t));

try{
   const searchStart = new Date(startDt.getTime() - 4 * 3600000);
   const date = searchStart.toLocaleDateString('sv-SE');
   const endDate = endDt.toLocaleDateString('sv-SE');
   
   const vars = 'is_day,temperature_2m,apparent_temperature,precipitation,rain,snowfall,weather_code,precipitation_probability,cloud_cover,visibility,wind_speed_10m,wind_direction_10m,wind_gusts_10m,cape,snowfall_height,dew_point_2m';
   const multiModels = 'best_match,icon_d2,ecmwf_ifs04,gfs_seamless';

   const iconUrl = 'latitude='+lat+'&longitude='+lon+'&hourly='+vars+'&daily=sunrise,sunset,daylight_duration&start_date='+date+'&end_date='+endDate+'&timezone=auto&wind_speed_unit=kmh&models='+multiModels;
   
   let peakUrl=null;
   if(peak && Number.isFinite(peak.lat) && Number.isFinite(peak.lon)){
       peakUrl = 'https://api.open-meteo.com/v1/forecast?latitude='+peak.lat+'&longitude='+peak.lon+'&hourly='+vars+'&start_date='+date+'&end_date='+endDate+'&timezone=auto&wind_speed_unit=kmh&models='+multiModels+(peak.alt?'&elevation='+peak.alt:'');
   }

   const [baseR, peakR, elevR] = await Promise.all([
       fetch('https://api.open-meteo.com/v1/forecast?'+iconUrl),
       peakUrl ? fetch(peakUrl) : Promise.resolve(null),
       fetch('https://api.open-meteo.com/v1/elevation?latitude='+lat+'&longitude='+lon)
   ]);

   const data = await baseR.json();
   const pData = peakR && peakR.ok ? await peakR.json() : null;
   const elevD = await elevR.json();
   
   const baseElev = Number(elevD.elevation?.[0]||0);
   const h = data.hourly;
   const pH = pData?.hourly;

   const times = h.time||[];
   const targetMs = startDt.getTime();

   const sunsetStr = data.daily?.sunset?.[0];
   const sunsetDt = sunsetStr ? new Date(sunsetStr) : null;
   const isAfterSunset = sunsetDt && (endDt > sunsetDt);
   
   let idx=0, bestDelta=Infinity;
   times.forEach((x,i)=>{
       const delta=Math.abs(new Date(x).getTime()-targetMs);
       if(delta<bestDelta){bestDelta=delta;idx=i;}
   });

   let liveBlend=null;
   if(liveIsTourWindow()){
       try{ liveBlend = await fetchLiveCenter(lat,lon); }catch(e){}
   }

   let slots='', maxTotalScore=-1, maxLevel='Niedrig', allWarnings=[];
   const parsedPeakAlt = peak && peak.alt ? parseFloat(peak.alt) : 0;
   const hasPeakAlt = Number.isFinite(parsedPeakAlt) && parsedPeakAlt > 0;

   let maxGust = 0, gustTime = "";
   let firstRainTime = null;
   let maxThunderRisk = false, thunderTime = "";

   for(let i=0; i<duration; i++){
       const bi=idx+i; 
       if(bi>=times.length) break;
       const t=times[bi];
       
       let temp=Number(h.temperature_2m?.[bi]??0);
       let rain=Number(h.precipitation?.[bi]??0);
       let snow=Number(h.snowfall?.[bi]??0);
       let wind=Number(h.wind_speed_10m?.[bi]??0);
       let gust=Number(h.wind_gusts_10m?.[bi]??0);
       let dir=Number(h.wind_direction_10m?.[bi]??0);
       let prob=Number(h.precipitation_probability?.[bi]??0);
       let cape=Number(h.cape?.[bi]??0);
       let vis=Number(h.visibility?.[bi]??0);
       let code=Number(h.weather_code?.[bi]??0);
       let cloud=Number(h.cloud_cover?.[bi]??0);
       let snowHeight=Number(h.snowfall_height?.[bi]??0);

       if(liveBlend?.nc?.times?.length){
           const hourStart=new Date(t).getTime();
           const hourEnd=hourStart+3600000;
           let nowRain=0;
           liveBlend.nc.times.forEach((ts,k)=>{
               const ms=new Date(ts).getTime();
               if(ms>=hourStart&&ms<hourEnd) nowRain+=Number(liveBlend.nc.values?.[k]||0);
           });
           if(nowRain>0){
               rain=Math.max(rain,nowRain);
               prob=Math.max(prob,Math.min(100,Math.round(35+nowRain*25)));
           }
       }
       if(liveBlend?.current && Math.abs(new Date(t)-new Date())<45*60000){
           const lc=liveBlend.current;
           if(Number.isFinite(Number(lc.temperature_2m))) temp=Number(lc.temperature_2m);
           if(Number.isFinite(Number(lc.wind_speed_10m))) wind=Number(lc.wind_speed_10m);
           if(Number.isFinite(Number(lc.wind_gusts_10m))) gust=Number(lc.wind_gusts_10m);
           if(Number.isFinite(Number(lc.rain))) rain=Math.max(rain,Number(lc.rain));
       }

       let baseWetRock = false;
       for(let p=1; p<=3; p++){
           let pre = bi-p;
           if(pre>=0 && Number(h.precipitation?.[pre]??0) > 0.1) {
               if (!isSummer || p === 1) {
                   baseWetRock = true; 
               }
           }
       }

       const isFreezing = temp <= 1;
       const isIce = isFreezing && (snow > 0 || rain > 0.05);

       const valleyWeather = { rain, snow, gust, wind, cape, code, prob, vis, temp, ice: isIce, wetRock: baseWetRock };
       const valleyRisk = evaluateZoneRisk(valleyWeather, selectedTourTypes, false, tourMonth);

       // Sichere Temperatur-Fallbacks für Gipfel
       let ptemp = pH ? Number(pH.temperature_2m?.[bi]) : (hasPeakAlt ? temp - (((parsedPeakAlt - baseElev)/100) * 0.65) : temp);
       let pdew = pH ? Number(pH.dew_point_2m?.[bi]) : (temp - 3);
       let pwind = pH ? Number(pH.wind_speed_10m?.[bi]) : wind;
       let pgust = pH ? Number(pH.wind_gusts_10m?.[bi]) : (hasPeakAlt ? gust * 1.2 : gust);
       let pdir = pH ? Number(pH.wind_direction_10m?.[bi]) : dir;
       let prain = pH ? Number(pH.precipitation?.[bi]) : rain;
       let psnow = pH ? Number(pH.snowfall?.[bi]) : snow;
       let pcode = pH ? Number(pH.weather_code?.[bi]) : code;
       let pcape = pH ? Number(pH.cape?.[bi]) : cape;
       let pprob = pH ? Number(pH.precipitation_probability?.[bi]) : prob;
       let pvis = pH ? Number(pH.visibility?.[bi]) : vis;

       let peakCloudBaseMsl = hasPeakAlt ? Math.round(parsedPeakAlt + Math.max(0, (ptemp - pdew) * 125)) : 0;
       
       let pWetRock = false;
       if(pH) {
           for(let p=1; p<=3; p++){
               let pre = bi-p;
               if(pre>=0 && Number(pH.precipitation?.[pre]??0) > 0.1) {
                   if (!isSummer || p === 1) pWetRock = true; 
               }
           }
       } else {
           pWetRock = baseWetRock;
       }

       const peakWeather = { rain: prain, snow: psnow, gust: pgust, wind: pwind, cape: pcape, code: pcode, prob: pprob, vis: pvis, temp: ptemp, ice: ptemp<=1&&(psnow>0||prain>0.05), wetRock: pWetRock };
       const peakRisk = evaluateZoneRisk(peakWeather, selectedTourTypes, true, tourMonth);

       let currentMaxGust = Math.max(gust, hasPeakAlt ? pgust : 0);
       if (currentMaxGust > maxGust) { maxGust = currentMaxGust; gustTime = t.replace('T', ' '); }
       
       if (!firstRainTime && (rain > 0.1 || (hasPeakAlt && prain > 0.1))) {
           firstRainTime = t.replace('T', ' ');
       }
       
       if ([95,96,99].includes(code) || (cape >= 1000 && prob >= 30) || (hasPeakAlt && ([95,96,99].includes(pcode) || (pcape >= 1000 && pprob >= 30)))) {
           maxThunderRisk = true;
           if (!thunderTime) thunderTime = t.replace('T', ' ');
       }

       const slotMaxScore = Math.max(valleyRisk.score, hasPeakAlt ? peakRisk.score : 0);
       if(slotMaxScore > maxTotalScore) {
           maxTotalScore = slotMaxScore;
           maxLevel = slotMaxScore >= 60 ? 'Hoch' : (slotMaxScore >= 30 ? 'Mäßig' : 'Niedrig');
       }

       allWarnings.push(...tourWarnings(valleyWeather, selectedTourTypes, false));
       if(hasPeakAlt) allWarnings.push(...tourWarnings(peakWeather, selectedTourTypes, true));

       const hint = conditionHint(valleyWeather);
       const dirTxt = windDir(dir);
       const pDirTxt = windDir(pdir);
       let visTxt = vis>0 ? (vis>=24000?'>24km':(vis>=1000?(vis/1000).toFixed(1)+'km':vis+'m')) : '–';

       const peakBox = hasPeakAlt ? `<div><div class="weather-box-title">⛰️ Gipfel (${Math.round(parsedPeakAlt)}m)</div>🌡️ ${ptemp.toFixed(1)}°C<br>💨 Wind: ${Math.round(pwind)} km/h (Böen: ${Math.round(pgust)} km/h)<br>🧭 ${pDirTxt}<br>🌦️ ${conditionHint(peakWeather)}<br>🌧️ ${prain.toFixed(1)}mm<br>💧 Regenwahrscheinlichkeit: ${Math.round(pprob)}%<br>☁️ Wolkenbasis: ca. ${peakCloudBaseMsl}m</div>` : '';
       const cls = slotMaxScore>=60?'status-red':slotMaxScore>=30?'status-orange':'status-green';

       slots+=`<div class="slot ${cls}"><div style="display:flex;justify-content:space-between"><strong>⏱️ ${t.replace('T',' ')} Uhr</strong><span>Risiko: <strong>${slotMaxScore>=60?'Hoch':(slotMaxScore>=30?'Mäßig':'Niedrig')}</strong></span></div><div class="weather-split${hasPeakAlt?'':' single-col'}"><div><div class="weather-box-title">📍 Tal (${Math.round(baseElev)}m)</div>🌡️ ${temp.toFixed(1)}°C<br>💨 Wind: ${Math.round(wind)} km/h (Böen: ${Math.round(gust)} km/h)<br>🧭 ${dirTxt}<br>🌦️ ${hint}<br>🌧️ ${rain.toFixed(1)}mm<br>💧 Regenwahrscheinlichkeit: ${Math.round(prob)}%</div>${peakBox}</div><div style="font-size:11px">Bewölkung: ${Math.round(cloud)}% · Sicht: ${visTxt} · Schneefallgrenze: ${Math.round(snowHeight)}m</div></div>`;
   }

   const overall = maxTotalScore>=60?'red':maxTotalScore>=30?'orange':'green';
   const tourName = selectedTourTypes.length ? selectedTourTypes.map(t=>TOUR_NAMES[t]).join(' + ') : 'Wetteranalyse';
   
   const conf = calculateRealModelConfidence(h, idx, duration);
   let warnings = [...new Set(allWarnings)];

   let summaryText = overall==='red'?'Erhöhte alpine Gefahren (Gewitter, Nässe, Sturm). Tour nicht empfohlen!':(overall==='orange'?'Anspruchsvolle Bedingungen. Genau auf Wetterumschwünge achten.':'Stabile alpine Bedingungen.');

   const startLatVal = document.getElementById('start_lat').value || document.getElementById('lat').value || '';
   const startLonVal = document.getElementById('start_lon').value || document.getElementById('lon').value || '';
   const startTitleVal = document.getElementById('locationSearch').value || 'Start';
   const peakLatVal = peak && peak.lat ? peak.lat : '';
   const peakLonVal = peak && peak.lon ? peak.lon : '';
   const peakTitleVal = peak && peak.name ? peak.name : '';
   const gpxVal = document.getElementById('gpxUrlParam').value || '';

   let timeVal = document.getElementById('startTime').value;
   if (!timeVal) {
       const now = new Date();
       timeVal = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0,16);
   }
   const durVal = document.getElementById('duration').value || "6";

   let mapQueryParams = new URLSearchParams();
   if(startLatVal) mapQueryParams.set('startLat', startLatVal);
   if(startLonVal) mapQueryParams.set('startLng', startLonVal);
   if(startTitleVal) mapQueryParams.set('startTitle', startTitleVal);
   if(peakLatVal) mapQueryParams.set('peakLat', peakLatVal);
   if(peakLonVal) mapQueryParams.set('peakLng', peakLonVal);
   if(peakTitleVal) mapQueryParams.set('peakTitle', peakTitleVal);
   if(gpxVal) mapQueryParams.set('gpx', gpxVal);
   mapQueryParams.set('startTime', timeVal);
   mapQueryParams.set('duration', durVal);

   const mapAppUrl = 'map.html?' + mapQueryParams.toString();

   let html=`<div style="font-weight:700;color:var(--primary);margin-bottom:8px;font-size:16px">📍 ${(document.getElementById('locationSearch').value||'Startpunkt')+(peak?' → ⛰️ '+peak.name:'')}</div>`;
   html+=`<div class="tour-specs-header">📅 <strong>Datum:</strong> ${startDt.toLocaleDateString('de-DE')} | ⏱️ <strong>Start:</strong> ${startDt.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} (${duration} Std.)<br>🥾 <strong>Tour:</strong> ${tourName}</div>`;

   if (isHighTourOrGlacier && startHour >= 7) {
       html+=`<div class="warning-box" style="background:#eff6ff;border-color:#3b82f6;color:#1e3a8a;">⏰ <strong>Frühstart-Empfehlung:</strong> Bei Hochtouren und Gletschertouren wird ein Start zwischen <strong>03:00 und 06:00 Uhr</strong> dringend empfohlen!</div>`;
   }

   if(isAfterSunset && sunsetDt) {
       const sunsetTimeStr = sunsetDt.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
       html+=`<div class="warning-box" style="background:#fefce8;border-color:#fef08a;color:#854d0e;">🔦 <strong>Dunkelheitswarnung:</strong> Die Tour endet nach Sonnenuntergang (${sunsetTimeStr} Uhr). <strong>Stirnlampe mitnehmen!</strong></div>`;
   }

   html+=`<div class="risk-hero risk-${overall}"><div class="risk-icon">${overall==='red'?'🔴':overall==='orange'?'🟠':'🟢'}</div><div class="risk-title">GESAMTRISIKO: ${maxLevel.toUpperCase()}</div><div class="risk-summary"><strong>Alpin-Fazit:</strong> ${summaryText}</div></div>`;

   html+=`<a href="${mapAppUrl}" target="_blank" class="map-link-btn">🗺️ 3D-Wetter Simulation ↗</a>`;

   if (isWinterSeason) {
       html+=`<a href="https://lawinen.at/" target="_blank" class="link-button" style="background:#0284c7;margin-bottom:8px;"><span>🏔️ Lawinenwarndienst</span><span>Öffnen ↗</span></a>`;
   }

   html+=`<a href="https://www.windy.com/?rain,${lat},${lon},11" target="_blank" class="link-button" style="background:#0f766e;margin-bottom:12px;"><span>🌧️ Live Regenradar & Wind (Windy)</span><span>Öffnen ↗</span></a>`;
   html+=`<div class="trend-box trend-good"><strong>Modellübereinstimmung: ${conf.pct}%</strong><br><span style="font-size:11px">${conf.text}</span></div>`;

   if(warnings.length) {
       html+=`<div class="warning-box">${warnings.join('<br><br>')}</div>`;
   }
   
   let summaryBox = `<div style="background:#f8fafc; border:1px solid #94a3b8; border-radius:12px; padding:12px; margin-bottom:15px; font-size:13px; line-height:1.5;">`;
   summaryBox += `<strong style="color:var(--primary); text-transform:uppercase; font-size:11px;">⚠️ Tour-Fokus (Heikelste Faktoren)</strong><br>`;

   if (maxThunderRisk) {
       summaryBox += `⚡ Ab ca. ${thunderTime.split(' ')[1]} Uhr erhöhtes <strong>Gewitterrisiko</strong>!<br>`;
   }
   if (maxGust >= 45) {
       summaryBox += `💨 <strong>Spitzenböen bis ${Math.round(maxGust)} km/h</strong> (um ca. ${gustTime.split(' ')[1]} Uhr).<br>`;
   }
   if (firstRainTime) {
       summaryBox += `🌧️ <strong>Niederschlag</strong> erwartet ab ca. ${firstRainTime.split(' ')[1]} Uhr.<br>`;
   } else if (!maxThunderRisk) {
       summaryBox += `✅ Niederschlag im Tourverlauf derzeit <strong>unwahrscheinlich</strong>.<br>`;
   }
   
   if(!maxThunderRisk && maxGust < 45 && !firstRainTime) {
       summaryBox += `✅ Wetterbedingungen im Zeitraum durchgehend <strong>stabil und ruhig</strong>.`;
   }
   summaryBox += `</div>`;
   html += summaryBox;

   html+=slots;
   html+=`<button type="button" class="share-btn" onclick="triggerShare()">🔗 Tour-Wetter teilen</button><button type="button" class="export-btn" onclick="window.print()">📄 Als PDF speichern</button>`;

   document.getElementById('results').innerHTML=html;
   document.getElementById('pushToggleBtn').style.display = 'block';
   document.getElementById('results').scrollIntoView({behavior:'smooth'});
   saveState();
   
} catch(e) { 
   document.getElementById('results').innerHTML='<div class="warning-box">❌ Fehler beim Abrufen der Wetterdaten. Bitte Eingaben überprüfen.</div>'; 
}
}
