<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Bergtouren Wetter Ampel</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="logo.png"><link rel="icon" href="logo.png" type="image/png"><style>

.advanced-toggle{width:100%;background:#64748b;color:#fff;padding:10px 12px;border-radius:11px;font-size:13px;margin-top:10px}.advanced-panel{display:none;margin-top:10px}.advanced-panel.open{display:block}.peak-section{margin-top:12px}.manual-peak{display:none;margin-top:10px}.manual-peak.show{display:block}.small-note{font-size:11px;color:var(--text-light);line-height:1.4}.selected-peak{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;padding:10px;border-radius:10px;font-size:12px;margin-top:8px}.manual-save{background:#10b981;color:#fff;padding:9px 12px;margin-top:8px;width:100%;font-size:12px}.clear-small{background:#e2e8f0;color:#334155;padding:8px 10px;font-size:11px}.loading{text-align:center;color:#64748b;font-size:12px;padding:10px}.warning-box.safety{background:#fff7ed;border-color:#fdba74;color:#9a3412}
.trend-box { margin: 12px 0; padding: 12px; border-radius: 12px; background: #f1f5f9; border: 1px solid var(--border); font-size: 13px; line-height: 1.45; }
.trend-good { border-color: #a7f3d0; background: #ecfdf5; color: #065f46; }
.trend-warn { border-color: #fdba74; background: #fff7ed; color: #9a3412; }
.trend-danger { border-color: #fecaca; background: #fef2f2; color: #7f1d1d; }
.gpx-box { background: #f0fdf4; border: 1px dashed #10b981; border-radius: 16px; padding: 12px; margin-bottom: 12px; text-align: center; }

.tour-checkbox input { width: auto; margin: 0; }

/* Live-Tour-Wetter: nur während einer aktiven/geplanten Tour sichtbar */
.live-tour-box{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;padding:14px;border-radius:14px;margin-bottom:12px;font-size:13px;line-height:1.45}
.live-tour-box.live-alert{background:#fff7ed;border-color:#fdba74;color:#9a3412}
.live-tour-box.live-danger{background:#fef2f2;border-color:#fecaca;color:#7f1d1d}

</style></head>
<body><div class="container">
<div class="header"><img src="logo.png" class="logo-img" alt="Logo"><h1>Bergtouren Wetter Ampel</h1></div>

<!-- GPX Import Section -->
<div class="gpx-box">
<label style="color:#065f46;margin-bottom:6px">🗺️ Tour aus GPX-Datei laden</label>
<input type="file" id="gpxFileInput" accept=".gpx" style="display:none" onchange="handleGPXUpload(event)">
<button type="button" class="gpx-btn" onclick="document.getElementById('gpxFileInput').click()">📂 GPX-Datei auswählen</button>
<div id="gpxStatus" class="small-note" style="margin-top:6px;color:#047857"></div>
</div>

<div class="card-section">
<label>📍 Startort</label>
<div class="row" style="position:relative"><input type="text" id="locationSearch" placeholder="z.B. Waldegg, Ramsau, Puchberg" oninput="clearCoordsIfSearching()"><button type="button" onclick="clearSearchField()" style="position:absolute;right:155px;top:50%;transform:translateY(-50%);background:transparent;border:none;font-size:16px;color:#94a3b8;box-shadow:none">✖</button><button type="button" class="action-btn" onclick="useCurrentGPS()" style="background:#10b981;" title="Aktuelle GPS Position verwenden">📍 GPS</button><button type="button" class="action-btn" onclick="searchLocation()">Suchen</button></div>

<!-- Touren speichern & laden -->
<div class="fav-bar"><select id="favoritesDropdown" onchange="loadFavoriteFromDropdown()" style="font-size:12px;padding:8px;flex:1"><option value="">💾 Gespeicherte Touren laden...</option></select><button type="button" class="action-btn" onclick="saveCurrentAsFavorite()" style="background:#10b981;font-size:12px;padding:8px 10px">+ Speichern</button><button type="button" class="action-btn" onclick="deleteSelectedFavorite()" style="background:#ef4444;font-size:12px;padding:8px 10px">❌ Löschen</button></div>

<select id="locationResultsSelect" onchange="selectLocationFromDropdown()"><option value="">-- Bitte Ort auswählen --</option></select><div id="locationPreview" class="detected-location"></div>
<button type="button" class="advanced-toggle" onclick="toggleAdvancedLocation()">⚙️ Erweiterte Standortangabe</button>
<div id="advancedLocation" class="advanced-panel"><label>Koordinaten (Breite, Länge)</label><div class="row"><input type="text" id="lat" placeholder="47.7800" oninput="clearSearchInput()"><input type="text" id="lon" placeholder="15.8900" oninput="clearSearchInput()"></div></div>
</div>

<div class="card-section peak-section">
<label>⛰️ Gipfel / Ziel (optional)</label>
<button type="button" id="peakSearchBtn" class="action-btn" onclick="searchMountainsAroundStart()" style="width:100%;padding:10px;margin-bottom:8px;background:#059669;">⛰️ Gipfel im Umkreis suchen</button>
<div id="peakSelected" class="selected-peak" style="display:none"></div>
<div id="peakSearchHint" class="small-note">Startort wählen und Suche starten.</div>
<select id="peakDropdown" onchange="selectPeakFromDropdown()" style="margin-top:8px;display:none"><option value="">-- Gipfel auswählen --</option></select>
<div id="peakLoading" class="loading" style="display:none">⛰️ Suche Gipfel in der Umgebung …</div>
<button type="button" id="manualPeakButton" class="clear-small" onclick="showManualPeak()" style="width:100%;margin-top:8px">Mein Berg ist nicht dabei → manuelle Eingabe</button>
<div id="manualPeak" class="manual-peak"><label>Gipfelname</label><input id="manualPeakName" placeholder="z.B. Hohe Wand"><div class="row" style="margin-top:8px"><div style="flex:1"><label>Höhe (m)</label><input type="number" id="peakAltInput" placeholder="z.B. 1132"></div><div style="flex:1"><label>Breite</label><input type="text" id="peakLatInput" placeholder="47.82"></div></div><label style="margin-top:8px">Länge</label><input type="text" id="peakLonInput" placeholder="16.03"><button type="button" class="manual-save" onclick="saveManualPeakFavorite()">⭐ Gipfel als Favorit speichern</button></div>
</div>

<div class="card-section">
<label>🥾 Tourart (Mehrfachauswahl möglich)</label>
<div class="tour-grid">
 <label class="tour-checkbox"><input type="checkbox" name="tourType" value="hiking" onchange="saveState()"> Wanderung</label>
 <label class="tour-checkbox"><input type="checkbox" name="tourType" value="klettersteig" onchange="saveState()"> Klettersteig</label>
 <label class="tour-checkbox"><input type="checkbox" name="tourType" value="hochtour" onchange="saveState()"> Hochtour</label>
 <label class="tour-checkbox"><input type="checkbox" name="tourType" value="grat" onchange="saveState()"> Gratwanderung</label>
 <label class="tour-checkbox"><input type="checkbox" name="tourType" value="gletscher" onchange="saveState()"> Gletschertour</label>
 <label class="tour-checkbox"><input type="checkbox" name="tourType" value="klettern" onchange="saveState()"> Felskletterei</label>
 <label class="tour-checkbox"><input type="checkbox" name="tourType" value="ski" onchange="saveState()"> Schitour</label>
</div>
</div>

<div class="card-section">
<div class="form-group" style="margin-bottom:12px">
 <label style="display:flex;justify-content:space-between;align-items:center">
   <span>⏱️ Geplante Startzeit:</span>
   <button type="button" onclick="setNowTime()" style="background:#e2e8f0;color:var(--text);border:none;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:600">🕒 Jetzt</button>
 </label>
 <input type="datetime-local" id="startTime" onchange="saveState()">
</div>
<div class="form-group">
 <label>🥾 Geplante Tourendauer:</label>
 <select id="duration" onchange="saveState()">
   <option value="4">4 Stunden (Halbtag)</option>
   <option value="6" selected>6 Stunden (Normal)</option>
   <option value="8">8 Stunden (Tagestour)</option>
   <option value="10">10 Stunden (Lange Tour)</option>
   <option value="12">12 Stunden (Sehr lange Tour)</option>
 </select>
</div>
</div>

<button class="main-btn" onclick="analyzeRisk()">Wetter abfragen</button>
<div id="results"></div>
<div class="footer-copyright">© 2026 Christian Camus. Alle Rechte vorbehalten.</div>
</div>

<script>
let foundLocations=[], peakCandidates=[], selectedPeak=null; let savedFavorites=JSON.parse(localStorage.getItem('bt_favorites_v5')||'[]');
const TOUR_NAMES={hiking:'Wanderung',klettersteig:'Klettersteig',hochtour:'Hochtour',grat:'Gratwanderung',gletscher:'Gletschertour',klettern:'Felskletterei',ski:'Schitour'};

function getSelectedTourTypes() {
return Array.from(document.querySelectorAll('input[name="tourType"]:checked')).map(cb => cb.value);
}

function setSelectedTourTypes(typesArray) {
document.querySelectorAll('input[name="tourType"]').forEach(cb => {
 cb.checked = typesArray.includes(cb.value);
});
}

function getDistance(a,b,c,d){const R=6371,dl=(c-a)*Math.PI/180,dn=(d-b)*Math.PI/180,x=Math.sin(dl/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dn/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function toggleAdvancedLocation(){document.getElementById('advancedLocation').classList.toggle('open');}
function setNowTime(){const n=new Date();document.getElementById('startTime').value=new Date(n.getTime()-n.getTimezoneOffset()*60000).toISOString().slice(0,16);saveState();}

function saveState(){
['locationSearch','lat','lon','startTime','duration'].forEach(id=>localStorage.setItem('bt5_'+id,document.getElementById(id).value));
localStorage.setItem('bt5_tourTypes', JSON.stringify(getSelectedTourTypes()));
if(selectedPeak)localStorage.setItem('bt5_peak',JSON.stringify(selectedPeak));
const mn=document.getElementById('manualPeakName')?.value||'',ma=document.getElementById('peakAltInput')?.value||'',mlat=document.getElementById('peakLatInput')?.value||'',mlon=document.getElementById('peakLonInput')?.value||'';
localStorage.setItem('bt5_manualPeak',JSON.stringify({name:mn,alt:ma,lat:mlat,lon:mlon}));
}

function clearSearchField(){document.getElementById('locationSearch').value='';document.getElementById('locationResultsSelect').style.display='none';document.getElementById('locationPreview').innerText='';document.getElementById('lat').value='';document.getElementById('lon').value='';clearPeak();saveState();}
function clearSearchInput(){document.getElementById('locationSearch').value='';document.getElementById('locationResultsSelect').style.display='none';saveState();}
function clearCoordsIfSearching(){document.getElementById('lat').value='';document.getElementById('lon').value='';document.getElementById('locationPreview').innerText='';clearPeak();saveState();}
function clearPeak(){selectedPeak=null;document.getElementById('peakDropdown').style.display='none';document.getElementById('peakDropdown').innerHTML='<option value="">-- Gipfel auswählen --</option>';document.getElementById('peakSelected').style.display='none';document.getElementById('manualPeak').classList.remove('show');document.getElementById('manualPeakName').value='';document.getElementById('peakAltInput').value='';document.getElementById('peakLatInput').value='';document.getElementById('peakLonInput').value='';}

function handleGPXUpload(event) {
const file = event.target.files[0];
if (!file) return;

const status = document.getElementById('gpxStatus');
status.innerText = 'Lese GPX-Datei ...';

const reader = new FileReader();
reader.onload = async function(e) {
 try {
   const xmlDoc = new DOMParser().parseFromString(e.target.result, "text/xml");
   const trackpoints = xmlDoc.querySelectorAll("trkpt, wpt");

   if (trackpoints.length === 0) {
     status.innerText = '❌ Keine Wegpunkte in GPX gefunden.';
     return;
   }

   const startLat = parseFloat(trackpoints[0].getAttribute("lat"));
   const startLon = parseFloat(trackpoints[0].getAttribute("lon"));
   document.getElementById('lat').value = startLat.toFixed(5);
   document.getElementById('lon').value = startLon.toFixed(5);

   let maxEle = -Infinity;
   let peakLat = null;
   let peakLon = null;

   trackpoints.forEach(pt => {
     const eleNode = pt.querySelector("ele");
     if (eleNode) {
       const ele = parseFloat(eleNode.textContent);
       if (ele > maxEle) {
         maxEle = ele;
         peakLat = parseFloat(pt.getAttribute("lat"));
         peakLon = parseFloat(pt.getAttribute("lon"));
       }
     }
   });

   const nameNode = xmlDoc.querySelector("trk > name, gpx > name");
   const gpxTourName = nameNode ? nameNode.textContent.trim() : "";

   try {
     const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${startLat}&lon=${startLon}`);
     const d = await r.json();
     const placeName = d.address.village || d.address.town || d.address.city || d.address.municipality || 'GPX Startort';
     document.getElementById('locationSearch').value = placeName;
     document.getElementById('locationPreview').innerText = '📍 GPX Start: ' + placeName;
   } catch (err) {
     document.getElementById('locationSearch').value = 'GPX Startort';
   }

   if (maxEle !== -Infinity) {
     selectedPeak = {
       name: gpxTourName ? `Gipfel (${gpxTourName})` : "Höchster Punkt (GPX)",
       alt: Math.round(maxEle),
       lat: peakLat,
       lon: peakLon
     };
     renderSelectedPeak();
   }

   status.innerText = '✅ GPX-Daten erfolgreich übernommen!';
   saveState();

 } catch (err) {
   status.innerText = '❌ Fehler beim Lesen der GPX-Datei.';
   console.error(err);
 }
};
reader.readAsText(file);
}

function updateFavoritesDropdown(){
const d=document.getElementById('favoritesDropdown');
d.innerHTML='<option value="">💾 Gespeicherte Touren laden...</option>';
savedFavorites.forEach((f,i)=>{
 const o=document.createElement('option');
 o.value=i;
 const peakStr = f.peakName ? ' → ⛰️ ' + f.peakName : '';
 const nameStr = f.tourTitle || ((f.startName||'Startort') + peakStr);
 o.text = nameStr + (f.peakAlt ? ' (' + f.peakAlt + ' m)' : '');
 d.appendChild(o);
});
}

function saveCurrentAsFavorite(){
const s=document.getElementById('locationSearch').value.trim(),lat=document.getElementById('lat').value.trim(),lon=document.getElementById('lon').value.trim();
if(!lat||!lon){alert('Bitte zuerst einen Startort auswählen.');return;}
const peak=getPeakData();
const defaultTitle = (s || 'Startort') + (peak?.name ? ' - ' + peak.name : '');
const tourTitle = prompt('Name für diese Tour eingeben:', defaultTitle);
if(!tourTitle) return;

const f={
 tourTitle: tourTitle,
 startName:s||'Startort',
 lat,
 lon,
 peakName:peak?.name||'',
 peakLat:peak?.lat||'',
 peakLon:peak?.lon||'',
 peakAlt:peak?.alt||'',
 tourTypes: getSelectedTourTypes(),
 duration: document.getElementById('duration').value
};
savedFavorites.push(f);
localStorage.setItem('bt_favorites_v5',JSON.stringify(savedFavorites));
updateFavoritesDropdown();
alert('Tour "' + tourTitle + '" erfolgreich gespeichert!');
}

function loadFavoriteFromDropdown(){
const i=Number(document.getElementById('favoritesDropdown').value);
const f=savedFavorites[i];
if(!f)return;

document.getElementById('locationSearch').value=f.startName||'';
document.getElementById('lat').value=f.lat||'';
document.getElementById('lon').value=f.lon||'';
document.getElementById('locationPreview').innerText='💾 Tour geladen: '+(f.tourTitle || f.startName);

if(f.tourTypes) setSelectedTourTypes(f.tourTypes);
else if(f.tourType) setSelectedTourTypes([f.tourType]);
if(f.duration) document.getElementById('duration').value = f.duration;

if(f.peakName){
 selectedPeak={name:f.peakName,lat:Number(f.peakLat)||null,lon:Number(f.peakLon)||null,alt:Number(f.peakAlt)||null};
 renderSelectedPeak();
} else clearPeak();

document.getElementById('favoritesDropdown').value='';
saveState();
}

function deleteSelectedFavorite(){
const d=document.getElementById('favoritesDropdown'),i=Number(d.value);
if(!Number.isInteger(i)||!savedFavorites[i]){alert('Bitte zuerst eine Tour aus der Liste auswählen.');return;}
if(confirm('Möchtest du diese gespeicherte Tour wirklich löschen?')){
 savedFavorites.splice(i,1);
 localStorage.setItem('bt_favorites_v5',JSON.stringify(savedFavorites));
 updateFavoritesDropdown();
}
d.value='';
}

function saveManualPeakFavorite(){

async function searchMountainsAroundStart() {
const lat = parseFloat(document.getElementById('lat').value);
const lon = parseFloat(document.getElementById('lon').value);
const startName = document.getElementById('locationSearch').value.trim();

if (isNaN(lat) || isNaN(lon)) {
alert('Bitte zuerst einen Startort auswählen.');
return;
}

const loading = document.getElementById('peakLoading');
const sel = document.getElementById('peakDropdown');
const hint = document.getElementById('peakSearchHint');

loading.style.display = 'block';
sel.style.display = 'none';

let rawPeaks = [];
const radii = [15, 20, 30];
let usedRadius = 15;

for (const radius of radii) {
usedRadius = radius;
hint.innerText = `Suche Gipfel im Umkreis von ${radius} km…`;
rawPeaks = [];

try {
  const searchTerm = startName ? startName : 'Gipfel';
  const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(searchTerm)}&count=50&language=de&format=json`);
  if (r.ok) {
    const d = await r.json();
    if (d.results) {
      d.results.forEach(x => {
        const dist = getDistance(lat, lon, x.latitude, x.longitude);
        if (dist <= radius) {
          rawPeaks.push({
            name: x.name,
            alt: x.elevation ? Math.round(x.elevation) : null,
            lat: x.latitude,
            lon: x.longitude,
            distance: dist
          });
        }
      });
    }
  }
} catch(e) {}

if (rawPeaks.length < 5) {
  try {
    const nomRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=peak+near+${lat},${lon}&limit=30`);
    if (nomRes.ok) {
      const nomData = await nomRes.json();
      nomData.forEach(x => {
        const pLat = parseFloat(x.lat);
        const pLon = parseFloat(x.lon);
        const dist = getDistance(lat, lon, pLat, pLon);
        if (dist <= radius) {
          rawPeaks.push({
            name: x.display_name.split(',')[0],
            alt: x.extratags && x.extratags.ele ? parseInt(x.extratags.ele) : null,
            lat: pLat,
            lon: pLon,
            distance: dist
          });
        }
      });
    }
  } catch (e) {}
}

if (rawPeaks.length > 0) break;
}

const uniquePeaks = [];
const map = new Map();
for (const item of rawPeaks) {
if(!map.has(item.name)){
  map.set(item.name, true);
  uniquePeaks.push(item);
}
}

const missingEle = uniquePeaks.filter(p => !p.alt);
if (missingEle.length > 0) {
try {
  const lats = missingEle.map(p => p.lat.toFixed(5)).join(',');
  const lons = missingEle.map(p => p.lon.toFixed(5)).join(',');
  const elR = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lats}&longitude=${lons}`);
  if (elR.ok) {
    const elD = await elR.json();
    const elevs = Array.isArray(elD.elevation) ? elD.elevation : [elD.elevation];
    missingEle.forEach((p, idx) => {
      if (elevs[idx] !== undefined && elevs[idx] !== null) {
        p.alt = Math.round(elevs[idx]);
      }
    });
  }
} catch (e) {}
}

loading.style.display = 'none';
peakCandidates = uniquePeaks.sort((a, b) => a.distance - b.distance);
renderPeakOptions(peakCandidates, usedRadius);
}

peaks.forEach((p, i) => {

// Entkoppelte und verbesserte Risikobewertung
function scoreRisk(d){
let s=0,r=[];const tourTypes=d.tourTypes||[];
const isExposed=tourTypes.some(t=>['klettersteig','grat','hochtour','gletscher','klettern'].includes(t));
const windFactor=isExposed?1.3:1;

// Windböen Bewertung
if(d.gust>=90){s+=60*windFactor;r.push('Sturmböen');}
else if(d.gust>=75){s+=45*windFactor;r.push('Sehr kräftige Böen');}
else if(d.gust>=60){s+=30*windFactor;r.push('Kräftige Böen');}
else if(d.gust>=50){s+=15*windFactor;r.push('Böen');}

// Nässe am Fels für exponierte Touren
if(isExposed && (d.rain>0.1 || d.prob>=40)){
   s+=40;
   r.push(tourTypes.includes('klettersteig')?'Nasser Fels / Rutschgefahr am Klettersteig':'Nässe & Rutschgefahr am Fels');
}

// Entkoppelt: Absolute Regenmenge
if(d.rain>=8){s+=45;r.push('Starkregen');}
else if(d.rain>=4){s+=35;r.push('Starkregen');}
else if(d.rain>=2){s+=25;r.push('Kräftiger Regen');}
else if(d.rain>=0.2){s+=15;r.push('Regen');}

// Entkoppelt: Regenwahrscheinlichkeit (Konvektiv/Schauer)
if(d.prob>=75 && d.rain<0.2){s+=20;r.push('Hohe Schauerwahrscheinlichkeit');}
else if(d.prob>=50 && d.rain<0.2){s+=10;r.push('Schauerneigung');}

// Schneefall
const snowFactor=tourTypes.some(t=>['ski','hochtour','gletscher'].includes(t))?1.2:1;
if(d.snow>=3){s+=35*snowFactor;r.push('Deutlicher Schneefall');}
else if(d.snow>=1){s+=25*snowFactor;r.push('Schneefall');}

// Gewitter & CAPE
if([95,96,99].includes(d.code)){s+=70;r.push('Gewittergefahr');}
else if(d.cape>=1200){s+=45;r.push('Hohe Gewitterneigung');}
else if(d.cape>=700){s+=30;r.push('Gewitterneigung');}

if(d.vis>0&&d.vis<2000){s+=25;r.push('Stark eingeschränkte Sicht');}
if(d.ice){s+=30;r.push('Vereisung / Glafeis');}

return {score:Math.min(100,Math.round(s)),reasons:[...new Set(r)]};
}

if(wet&&tourTypes.some(t=>['klettersteig','klettern'].includes(t)))a.push('⚠️ <strong>AKUTE NÄSSEWARNUNG:</strong> Nasser Fels verringert die Reibung drastisch. Am Klettersteig besteht erhöhte Rutsch- und Absturzgefahr!');

if(wind&&tourTypes.some(t=>['klettersteig','grat','hochtour','gletscher','klettern'].includes(t)))a.push('💨 <strong>Wind:</strong> Kräftige Böen an exponierten Stellen.');
if(thunder)a.push('⚡ <strong>Gewittergefahr:</strong> Drahtseile auf Klettersteigen wirken wie Blitzableiter! Exponierte Bereiche frühzeitig verlassen.');

// Echte Prognosewahrscheinlichkeit durch Multi-Modell-Abgleich (ICON vs. ECMWF)
function modelConfidence(iconHourly, ecmwfHourly, startIndex, duration, hoursAhead){
let baseScore = 100;

// 1. Zeitliche Unsicherheit (1.5% Abzug pro 24h)
baseScore -= Math.min(25, Math.max(0, hoursAhead - 24) * 0.15);

if(iconHourly && ecmwfHourly){
   let totalTempDiff = 0, totalWindDiff = 0, totalRainDiff = 0;
   let validSlots = 0;

   for(let i = 0; i < duration; i++){
       const idx = startIndex + i;
       if(iconHourly.temperature_2m?.[idx] !== undefined && ecmwfHourly.temperature_2m?.[idx] !== undefined){
           totalTempDiff += Math.abs(iconHourly.temperature_2m[idx] - ecmwfHourly.temperature_2m[idx]);
           totalWindDiff += Math.abs((iconHourly.wind_gusts_10m?.[idx]||0) - (ecmwfHourly.wind_gusts_10m?.[idx]||0));
           totalRainDiff += Math.abs((iconHourly.precipitation?.[idx]||0) - (ecmwfHourly.precipitation?.[idx]||0));
           validSlots++;
       }
   }

   if(validSlots > 0){
       const avgTempDiff = totalTempDiff / validSlots;
       const avgWindDiff = totalWindDiff / validSlots;
       const avgRainDiff = totalRainDiff / validSlots;

       // Abzüge bei Abweichungen zwischen ICON und ECMWF
       baseScore -= (avgTempDiff * 3); // 3% pro Grad Temp-Abweichung
       baseScore -= (avgWindDiff * 0.5); // 0.5% pro km/h Böen-Abweichung
       baseScore -= (avgRainDiff * 8); // 8% pro mm Niederschlag-Abweichung
   }
}

const pct = Math.max(25, Math.min(98, Math.round(baseScore)));
let text = 'Hohe Einstimmigkeit zwischen ICON-D2/Seamless & ECMWF IFS.';
if(pct < 60) text = 'Erhöhte Modell-Abweichungen (ICON vs. ECMWF). Wetterlage ist unsicher!';
else if(pct < 80) text = 'Moderate Einstimmigkeit der Wettermodelle. Lokale Abweichungen möglich.';

return { pct, text };
}

function liveDistancePoint(lat,lon,dir,km=8){
  const dLat=(km/111.32)*dir.lat;
  const dLon=(km/(111.32*Math.max(.2,Math.cos(lat*Math.PI/180))))*dir.lon;

}
async function fetchGeoSphereNowcast(lat,lon){
  const url='https://dataset.api.hub.geosphere.at/v1/timeseries/forecast/nowcast-v1-15min-1km?lat_lon='+
    encodeURIComponent(lat.toFixed(5)+','+lon.toFixed(5))+
    '&parameters=rr&forecast_offset=0&output_format=geojson';
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok)throw new Error('GeoSphere Nowcast HTTP '+r.status);
  return r.json();
}
function parseGeoSphereSeries(data){
  const f=data?.features?.[0];
  const p=f?.properties?.parameters?.rr;
  if(!p)return {times:[],values:[]};
  return {times:p.timestamps||p.time||[],values:p.data||[]};
}
async function fetchLiveCenter(lat,lon){
  const currentUrl='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+
    '&current=temperature_2m,apparent_temperature,precipitation,rain,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m'+
    '&timezone=auto&wind_speed_unit=kmh';
  const [c,n]=await Promise.all([
    fetch(currentUrl,{cache:'no-store'}),
    fetchGeoSphereNowcast(lat,lon).catch(()=>null)
  ]);
  if(!c.ok)throw new Error('Live-Wetter HTTP '+c.status);
  const current=(await c.json()).current||{};
  const nc=n?parseGeoSphereSeries(await n.json()):{times:[],values:[]};
  return {current,nc};
}
async function fetchLiveDirectionSamples(lat,lon){
  const samples=await Promise.all(LIVE_DIRS.map(async d=>{
    try{
      const [pLat,pLon]=liveDistancePoint(lat,lon,d,8);
      const j=await fetchGeoSphereNowcast(pLat,pLon);
      return {dir:d.name,lat:pLat,lon:pLon,nc:parseGeoSphereSeries(j)};
    }catch(e){return null;}
  }));
  return samples.filter(Boolean);
}
function liveFindArrival(centerSeries,samples){
  const threshold=.08; // mm per 15 min: deliberately low to catch approaching showers
  let centerIndex=-1;
  for(let i=0;i<centerSeries.values.length;i++){
    if(Number(centerSeries.values[i]||0)>=threshold){centerIndex=i;break;}
  }
  let candidates=[];
  samples.forEach(s=>{
    let idx=-1;
    for(let i=0;i<s.nc.values.length;i++){
      if(Number(s.nc.values[i]||0)>=threshold){idx=i;break;}
    }
    if(idx>=0)candidates.push({...s,idx});
  });
  if(centerIndex>=0){
    const iso=centerSeries.times?.[centerIndex];
    return {kind:'now',time:iso,direction:null,amount:Number(centerSeries.values[centerIndex]||0)};
  }
  if(!candidates.length)return null;
  candidates.sort((a,b)=>a.idx-b.idx);
  const best=candidates[0];
  // Only call it an incoming cell when the outer point sees precipitation soon enough.
  if(best.idx<=8){
    const time=best.nc.times?.[best.idx];
    return {kind:'incoming',time,direction:best.dir,amount:Number(best.nc.values[best.idx]||0)};
  }
  return null;
}

}

      const thunder=liveThunderPotential();
      if(arrival.kind==='now'){
        html+='<div style="margin-top:9px"><strong>'+ (thunder?'⚡ Gewitter-/Regenzelle':'🌧️ Regenzelle') +' erreicht den Standort jetzt.</strong><br>Aktueller Niederschlag wird vom Nowcast bestätigt.</div>';
        const key='now-'+Math.floor(Date.now()/900000);
        if(key!==liveLastAlertKey){liveNotify(thunder?'⚡ Gewitter-/Regenzelle am Standort':'🌧️ Regen am Standort','Aktueller Niederschlag wird am Tourstandort erfasst.');liveLastAlertKey=key;}
        liveShowStatus(html,thunder?'live-danger':'live-alert');
      }else{
        html+='<div style="margin-top:9px"><strong>'+ (thunder?'⚡ Gewitter-/Regenzelle kommt':'🌧️ Regen kommt') +'</strong><br>Aus Richtung <strong>'+liveDirectionName(arrival.direction)+'</strong> · voraussichtlich in <strong>'+mins+' Min.</strong> (ca. '+liveFormatTime(arrival.time)+' Uhr).</div>';
        const key=arrival.direction+'-'+arrival.time.slice(0,16);
        if(key!==liveLastAlertKey && mins<=60){
          liveNotify(thunder?'⚡ Gewitter-/Regenzelle kommt':'🌧️ Regen kommt','Aus Richtung '+liveDirectionName(arrival.direction)+' · voraussichtlich in ca. '+mins+' Minuten.');
          liveLastAlertKey=key;
        }
        liveShowStatus(html,thunder?'live-danger':'live-alert');
      }
    }else{
      html+='<div style="margin-top:9px"><strong>✅ Aktuell keine Niederschlagszelle im unmittelbaren Nowcast.</strong><br><span class="live-muted">Der Kurzfrist-Nowcast wird während der Tour automatisch alle 5 Minuten aktualisiert.</span></div>';
      liveShowStatus(html);
    }
    liveLastUpdate=Date.now();
  }catch(e){
    console.warn('Live-Tour-Wetter:',e);
    liveShowStatus('<div class="live-tour-head"><strong>📡 Live-Tour-Wetter</strong><span class="live-muted">vorübergehend nicht verfügbar</span></div>Live-Daten konnten gerade nicht abgerufen werden. Die normale Wetterprognose bleibt unverändert.');
  }
}
function startLiveTourWeather(){
  if(!liveIsTourWindow())return;
  liveTourActive=true;
  liveRequestNotificationPermission();
  liveCreateBox();
  if(liveGpsWatch===null && navigator.geolocation){
    liveGpsWatch=navigator.geolocation.watchPosition(pos=>{
      liveLastPosition={lat:pos.coords.latitude,lon:pos.coords.longitude};
      if(Date.now()-liveLastUpdate>120000)updateLiveTourWeather();
    },()=>{}, {enableHighAccuracy:true,maximumAge:60000,timeout:15000});
  }
  updateLiveTourWeather();
  clearInterval(liveTourTimer);
  liveTourTimer=setInterval(updateLiveTourWeather,5*60*1000);
}
function stopLiveTourWeather(){
  liveTourActive=false;
  clearInterval(liveTourTimer); liveTourTimer=null;
  clearTimeout(liveStartTimer); liveStartTimer=null;
  if(liveGpsWatch!==null && navigator.geolocation){navigator.geolocation.clearWatch(liveGpsWatch);liveGpsWatch=null;}
  const box=document.getElementById('liveTourBox');
  if(box)box.remove();
}
function scheduleLiveTourWeather(){
  stopLiveTourWeather();
  const startStr=document.getElementById('startTime').value;
  const duration=Number(document.getElementById('duration').value||0);
  if(!startStr||!duration)return;
  const start=new Date(startStr), now=new Date(), delay=start-now;
  if(delay<=0 && liveIsTourWindow()) startLiveTourWeather();
  else if(delay>0 && delay<2147483647){
    liveStartTimer=setTimeout(startLiveTourWeather,delay);
  }
}
async function analyzeRisk(){
const lat=Number(document.getElementById('lat').value),lon=Number(document.getElementById('lon').value),startStr=document.getElementById('startTime').value,duration=Number(document.getElementById('duration').value);
const selectedTourTypes = getSelectedTourTypes();
let peak=getPeakData();

if(!Number.isFinite(lat)||!Number.isFinite(lon)||!startStr){alert('Bitte Startort und Startzeit angeben.');return;}

document.getElementById('results').innerHTML='<div class="loading">🌦️ Wettermodelle (ICON & ECMWF) werden abgeglichen …</div>';

if(peak && peak.lat && peak.lon && !peak.alt){
   try{
       const elR=await fetch('https://api.open-meteo.com/v1/elevation?latitude='+peak.lat+'&longitude='+peak.lon);
       const elD=await elR.json();
       if(elD.elevation?.[0]) peak.alt = Math.round(elD.elevation[0]);
   }catch(e){}
}

const startDt=new Date(startStr);
const endDt=new Date(startDt.getTime()+duration*3600000);
const hoursAhead=(startDt-new Date())/3600000;

try{
   const date=startDt.toLocaleDateString('sv-SE'),endDate=endDt.toLocaleDateString('sv-SE');
   const vars='is_day,temperature_2m,apparent_temperature,precipitation,rain,snowfall,weather_code,precipitation_probability,cloud_cover,visibility,wind_speed_10m,wind_direction_10m,wind_gusts_10m,cape,freezing_level_height';
   const primaryModel=(hoursAhead<=48?'icon_d2':'icon_seamless');
   
   // API-Aufrufe für ICON & ECMWF Multi-Modell
   const iconUrl='latitude='+lat+'&longitude='+lon+'&hourly='+vars+'&daily=sunrise,sunset,daylight_duration&start_date='+date+'&end_date='+endDate+'&timezone=auto&wind_speed_unit=kmh&models='+primaryModel;
   const ecmwfUrl='latitude='+lat+'&longitude='+lon+'&hourly='+vars+'&start_date='+date+'&end_date='+endDate+'&timezone=auto&wind_speed_unit=kmh&models=ecmwf_ifs025';
   
   let peakUrl=null;
   if(peak&&Number.isFinite(peak.lat)&&Number.isFinite(peak.lon)){
       peakUrl='https://api.open-meteo.com/v1/forecast?latitude='+peak.lat+'&longitude='+peak.lon+'&hourly='+vars+'&start_date='+date+'&end_date='+endDate+'&timezone=auto&wind_speed_unit=kmh&models='+primaryModel+(peak.alt?'&elevation='+peak.alt:'');
   }

   const [baseR, ecmwfR, peakR, elevR] = await Promise.all([
       fetch('https://api.open-meteo.com/v1/forecast?'+iconUrl),
       fetch('https://api.open-meteo.com/v1/forecast?'+ecmwfUrl),
       peakUrl ? fetch(peakUrl) : Promise.resolve(null),
       fetch('https://api.open-meteo.com/v1/elevation?latitude='+lat+'&longitude='+lon)
   ]);
   
   const data=await baseR.json(), ecmwfData=await ecmwfR.json(), pData=peakR&&peakR.ok?await peakR.json():null, elevD=await elevR.json();
   const baseElev=Number(elevD.elevation?.[0]||0);
   
   const sunsetStr = data.daily?.sunset?.[0];
   const sunsetDt = sunsetStr ? new Date(sunsetStr) : null;
   const isAfterSunset = sunsetDt && (endDt > sunsetDt);

   const h=data.hourly,times=h.time||[];
   const idx=Math.max(0,times.findIndex(x=>x.startsWith(startDt.toLocaleDateString('sv-SE')+'T'+String(startDt.getHours()).padStart(2,'0'))));
   
   let maxScore=-1,worstReason='',slots='',allWarn=[];
   const pH=pData?.hourly;
   const hasPeakAlt = peak && Number.isFinite(peak.alt) && peak.alt > 0;

   for(let i=0;i<duration;i++){
       const bi=idx+i; if(bi>=times.length)break;
       const t=times[bi];
       let temp=Number(h.temperature_2m?.[bi]??0),feel=Number(h.apparent_temperature?.[bi]??temp),rain=Number(h.precipitation?.[bi]??0),snow=Number(h.snowfall?.[bi]??0),gust=Number(h.wind_gusts_10m?.[bi]??0),wind=Number(h.wind_speed_10m?.[bi]??0),dir=Number(h.wind_direction_10m?.[bi]??0),prob=Number(h.precipitation_probability?.[bi]??0),cape=Number(h.cape?.[bi]??0),vis=Number(h.visibility?.[bi]??0),code=Number(h.weather_code?.[bi]??0),freeze=Number(h.freezing_level_height?.[bi]??9999),cloud=Number(h.cloud_cover?.[bi]??0),isDay=Number(h.is_day?.[bi]??1);
       if(liveBlend?.nc?.times?.length){
         const hourStart=new Date(t).getTime(), hourEnd=hourStart+3600000;
         let nowRain=0;
         liveBlend.nc.times.forEach((ts,k)=>{const ms=new Date(ts).getTime();if(ms>=hourStart&&ms<hourEnd)nowRain+=Number(liveBlend.nc.values?.[k]||0);});
         if(nowRain>0){rain=Math.max(rain,nowRain);prob=Math.max(prob,Math.min(100,Math.round(35+nowRain*25)));}
       }
       if(liveBlend?.current && Math.abs(new Date(t)-new Date())<45*60000){
         const lc=liveBlend.current;
         if(Number.isFinite(Number(lc.temperature_2m)))temp=Number(lc.temperature_2m);
         if(Number.isFinite(Number(lc.wind_speed_10m)))wind=Number(lc.wind_speed_10m);
         if(Number.isFinite(Number(lc.wind_gusts_10m)))gust=Number(lc.wind_gusts_10m);
         if(Number.isFinite(Number(lc.rain)))rain=Math.max(rain,Number(lc.rain));
       }
       
       // Gipfel-Kompensation: Primär über Open-Meteo elevation API, Fallback feucht-adiabatisch (-0.65°C/100m)
       let ptemp = pH ? Number(pH.temperature_2m?.[bi]) : (hasPeakAlt ? temp - ((peak.alt - baseElev)/100 * 0.65) : null);
       let pwind = pH ? Number(pH.wind_speed_10m?.[bi]) : (hasPeakAlt ? wind * 1.25 : null);
       let pgust = pH ? Number(pH.wind_gusts_10m?.[bi]) : (hasPeakAlt ? gust * 1.2 : gust);
       
       const useGust=Number.isFinite(pgust)?pgust:gust;
       
       // Ice-Risk: Fels-/Trittereisung auch bei flüssigem Niederschlag nahe oder unter dem Gefrierpunkt
       const isFreezing = hasPeakAlt ? (freeze <= peak.alt || ptemp <= 1) : (freeze <= baseElev || temp <= 1);
       const isIceRisk = isFreezing && (snow > 0 || rain > 0.05);

       const risk=scoreRisk({rain,gust:useGust,cape,code,prob,vis,snow,tourTypes:selectedTourTypes,ice:isIceRisk});
       
       if(risk.score>maxScore){maxScore=risk.score;worstReason=risk.reasons[0]||'';}
       allWarn.push(...tourWarnings({rain,snow,gust:useGust,cape,code,tourTypes:selectedTourTypes,ice:isIceRisk}));
       
       const hint=conditionHint({rain,snow,gust:useGust,prob,code,isDay});
       const dirTxt=windDir(dir);
       
       const peakBox=hasPeakAlt?'<div><div class="weather-box-title">⛰️ Gipfel ('+Math.round(peak.alt)+' m)</div>🌡️ '+(Number.isFinite(ptemp)?ptemp.toFixed(1):'–')+' °C<br>💨 '+(Number.isFinite(pwind)?Math.round(pwind):'–')+' km/h (Böen '+(Number.isFinite(pgust)?Math.round(pgust):'–')+' km/h)<br>🧭 '+dirTxt+'<br>🌦️ '+hint+'</div>':'';
       
       const cls=risk.score>=60?'status-red':risk.score>=30?'status-orange':'status-green';
       const splitCls = hasPeakAlt ? '' : ' single-col';
       
       slots+='<div class="slot '+cls+'"><div style="display:flex;justify-content:space-between"><strong>⏱️ '+t.replace('T',' ')+' Uhr</strong><span class="badge">'+risk.score+'/100</span></div><div class="weather-split'+splitCls+'"><div><div class="weather-box-title">📍 Start ('+Math.round(baseElev)+' m)</div>🌡️ '+temp.toFixed(1)+' °C (gef. '+feel.toFixed(1)+' °C)<br>💨 '+Math.round(wind)+' km/h (Böen '+Math.round(gust)+' km/h)<br>🧭 '+dirTxt+'<br>🌦️ '+hint+'</div>'+peakBox+'</div><div style="font-size:11px">Bewölkung '+Math.round(cloud)+'% · Nullgradgrenze '+Math.round(freeze)+' m</div></div>';
   }

   const overall=maxScore>=60?'red':maxScore>=30?'orange':'green';
   const tourName=selectedTourTypes.length ? selectedTourTypes.map(t => TOUR_NAMES[t]).join(' + ') : 'Wetteranalyse';
   
   // Aufruf der echten Multi-Modell-Vergleichsfunktion
   const conf=modelConfidence(h, ecmwfData?.hourly, idx, duration, hoursAhead);
   
   let warnings=[...new Set(allWarn)];
   const summary=worstReason||((maxScore<30)?'Gute und stabile Bedingungen':'Wetterbedingungen aufmerksam beobachten.');

   const tourMonth = startDt.getMonth();
   const isWinterSeason = (tourMonth >= 10 || tourMonth <= 4);

   let html='<div class="location-title">📍 '+(document.getElementById('locationSearch').value||'Startpunkt')+(peak?' → ⛰️ '+(peak.name||'Gipfel'):'')+'</div>';
   html+='<div class="tour-specs-header">📅 <strong>Datum:</strong> '+startDt.toLocaleDateString('de-DE')+' | ⏱️ <strong>Start:</strong> '+startDt.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr ('+duration+' Std.)<br>🥾 <strong>Tour:</strong> '+tourName+'</div>';
   
   if(isAfterSunset && sunsetDt) {
     const sunsetTimeStr = sunsetDt.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
     html+='<div class="warning-box headlamp">🔦 <strong>Dunkelheitswarnung:</strong> Die Tour endet voraussichtlich nach Sonnenuntergang ('+sunsetTimeStr+' Uhr). <strong>Stirnlampe mitnehmen!</strong></div>';
   }

   html+='<div class="risk-hero risk-'+overall+'"><div class="risk-icon">'+riskIcon(overall)+'</div><div class="risk-title">'+riskText(overall)+'</div><div class="risk-summary"><strong>Hinweis:</strong> '+summary+'</div></div>';
   
   if (isWinterSeason) {
     html+='<a href="https://lawinen.at/" target="_blank" class="link-button" style="background:#0284c7;margin-bottom:8px;"><span>🏔️ Lawinenwarndienst</span><span>Öffnen ↗</span></a>';
   }

   html+='<a href="https://www.windy.com/?rain,'+lat+','+lon+',10" target="_blank" class="link-button" style="background:#0f766e;margin-bottom:12px;"><span>🌧️ Live Regenradar & Wind (Windy)</span><span>Öffnen ↗</span></a>';
   
   html+='<div class="trend-box '+(conf.pct<60?'trend-danger':conf.pct<80?'trend-warn':'trend-good')+'"><strong>Modelleinstimmigkeit & Prognosesicherheit: '+conf.pct+'%</strong><br><span style="font-size:11px">'+conf.text+'</span></div>';
   
   if(warnings.length)html+='<div class="warning-box safety">'+[...new Set(warnings)].join('<br><br>')+'</div>';
   
   html+=slots;
   html+='<button type="button" class="share-btn" onclick="triggerShare()">🔗 Tour-Wetter teilen</button><button type="button" class="export-btn" onclick="window.print()">📄 Als PDF / Druckversion speichern</button>';
   
   document.getElementById('results').innerHTML=html;
   document.getElementById('results').scrollIntoView({behavior:'smooth'});
   saveState();
}catch(e){
   console.error(e);
   document.getElementById('results').innerHTML='<div class="warning-box">❌ Fehler beim Abrufen der Wetterdaten. Bitte Eingaben prüfen.</div>';
}
}
